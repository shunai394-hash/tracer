<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRACER AI Live — Local Demo</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;background:#101522;color:#f4f6ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(780px,100%);background:#1a2233;border:1px solid #33415c;border-radius:24px;padding:clamp(20px,4vw,36px);box-shadow:0 20px 80px #0005}
.tag{font-size:.78rem;letter-spacing:.08em;color:#9ed8ca}h1{margin:.4rem 0;font-size:clamp(1.5rem,4vw,2.2rem)}.sub{color:#bdc8dc}
.stage{display:grid;grid-template-columns:180px 1fr;gap:24px;align-items:center;margin:28px 0}
.avatar{width:160px;height:160px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#91e7df,#617be4 55%,#6d4eb5);box-shadow:0 0 0 10px #ffffff09,0 0 50px #7184ed30;position:relative}
.face{width:100px;height:78px;border-radius:48%;background:#f2f6ff;position:relative;box-shadow:inset 0 -7px #d8e1f7}
.eye{position:absolute;top:26px;width:9px;height:13px;border-radius:50%;background:#263553}.eye.l{left:27px}.eye.r{right:27px}
.mouth{position:absolute;left:40px;top:49px;width:20px;height:7px;border-bottom:3px solid #c16d88;border-radius:50%}
.avatar.talking .mouth{height:16px;top:45px;background:#c16d88;border:2px solid #c16d88;animation:talk .16s infinite alternate}
.avatar.talking{animation:bob .6s infinite alternate}
@keyframes talk{to{transform:scaleY(.45)}}@keyframes bob{to{transform:translateY(-4px)}}
.answer{min-height:90px;padding:18px;background:#111827;border-radius:16px;line-height:1.8;border:1px solid #303c53}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:#a8f0df;color:#12222b;font-weight:700}
button.secondary{background:#34435c;color:#f4f6ff}button:disabled{opacity:.45;cursor:not-allowed}
.controls,.comments{display:flex;gap:10px;flex-wrap:wrap}.comments{margin-top:12px}
small{display:block;margin-top:20px;color:#9aa9c0;line-height:1.7}
@media(max-width:540px){.stage{grid-template-columns:1fr;justify-items:center}.answer{width:100%}}
</style>
</head>
<body>
<main>
<div class="tag">LOCAL-ONLY PROTOTYPE · 架空データ</div>
<h1>TRACER AIアバター配信テスト</h1>
<p class="sub">音声はこのブラウザの日本語音声合成を使用。外部API・DB・配信サービスには接続しません。</p>
<section class="stage" aria-live="polite">
<div class="avatar" id="avatar" role="img" aria-label="簡易AIアバター">
<div class="face"><span class="eye l"></span><span class="eye r"></span><span class="mouth"></span></div>
</div>
<div><div class="tag">AIの応答</div><p class="answer" id="answer">コメント例を選ぶと、架空の商品データを使って回答します。</p></div>
</section>
<div class="controls">
<button id="voice" type="button">音声テスト</button>
<button id="stop" class="secondary" type="button">音声停止</button>
</div>
<h2>コメントをシミュレーション</h2>
<div class="comments">
<button data-type="price">価格は？</button>
<button data-type="features">どんな商品？</button>
<button data-type="availability">在庫は？</button>
<button data-type="purchase">どこで買える？</button>
<button data-type="unknown">明日届く？</button>
</div>
<small id="status">状態：待機中。デモ商品は架空情報です。実商品・在庫・配送状況を示すものではありません。</small>
</main>
<script>
(() => {
  const item = Object.freeze({
    title: "デモ商品（架空データ）",
    description: "これは動作確認用の架空商品です。実在の商品情報ではありません。",
    sellingPrice: 2980,
    productUrl: "https://tracer.base.ec/"
  });
  const replies = {
    price: `こちらは動作確認用の架空商品で、表示価格は${item.sellingPrice.toLocaleString("ja-JP")}円です。`,
    features: item.description,
    availability: "このデモでは在庫ありとして応答しています。実商品の在庫状況は確認していません。",
    purchase: `購入先の表示例はこちらです。${item.productUrl}`,
    unknown: "お届け予定日はこのデモでは確認できません。実際の商品ページでご確認ください。"
  };
  const avatar = document.querySelector("#avatar");
  const answer = document.querySelector("#answer");
  const status = document.querySelector("#status");
  let timer;
  function speak(text) {
    if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
      status.textContent = "このブラウザは音声合成に対応していません。別の最新ブラウザでお試しください。";
      return;
    }
    speechSynthesis.cancel();
    clearTimeout(timer);
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "ja-JP";
    utterance.rate = 1;
    utterance.onstart = () => { avatar.classList.add("talking"); status.textContent = "状態：日本語音声を再生中"; };
    utterance.onend = () => { avatar.classList.remove("talking"); status.textContent = "状態：待機中"; };
    utterance.onerror = () => { avatar.classList.remove("talking"); status.textContent = "状態：音声を再生できませんでした"; };
    speechSynthesis.speak(utterance);
  }
  document.querySelector("#voice").addEventListener("click", () => speak("こんにちは。こちらはTRACERのローカル音声テストです。"));
  document.querySelector("#stop").addEventListener("click", () => {
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    clearTimeout(timer); avatar.classList.remove("talking"); status.textContent = "状態：音声停止";
  });
  document.querySelectorAll("[data-type]").forEach(button => button.addEventListener("click", () => {
    const text = replies[button.dataset.type];
    answer.textContent = text;
    speak(text);
  }));
})();
</script>
</body>
</html>
