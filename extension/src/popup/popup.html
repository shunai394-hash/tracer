<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TRACER</title>
  <style>
    body { width: 360px; margin: 0; padding: 16px; font-family: system-ui, sans-serif; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    button { width: 100%; padding: 10px; margin-top: 8px; cursor: pointer; }
    input { box-sizing: border-box; width: 100%; padding: 8px; margin: 4px 0 8px; }
    #status { white-space: pre-wrap; margin-top: 12px; font-size: 12px; }
    .ok { color: #146c2e; }
    .error { color: #a61b1b; }
    details { margin-top: 12px; }
  </style>
</head>
<body>
  <h1>TRACER Product Capture</h1>
  <button id="capture">Amazon商品をTRACERへ送信</button>
  <div id="status">待機中</div>

  <details>
    <summary>接続設定</summary>
    <label>TRACER URL</label>
    <input id="apiUrl" placeholder="http://localhost:3000">
    <label>Extension Key</label>
    <input id="apiKey" type="password" placeholder="TRACER_EXTENSION_API_KEY">
    <button id="save">保存</button>
  </details>

  <script type="module" src="../../dist/popup/popup.js"></script>
</body>
</html>
