<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TRACER AIライブ販売コンソール</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101827;color:#f8fafc}*{box-sizing:border-box}
body{margin:0;padding:22px}main{max-width:1100px;margin:auto;display:grid;gap:16px;grid-template-columns:1.1fr .9fr}
section{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:20px}h1{font-size:1.45rem;margin:0 0 8px}h2{font-size:1.05rem;margin:0 0 12px}
p{line-height:1.6}.muted{color:#cbd5e1;font-size:.9rem}.warning{color:#fbbf24}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
input,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #475569;background:#0f172a;color:#fff}input,select{width:100%}
button{cursor:pointer;background:#334155}button.primary{background:#1d4ed8}button:disabled{opacity:.45;cursor:not-allowed}
#productList{display:grid;gap:8px;max-height:320px;overflow:auto}.product{padding:12px;border:1px solid #475569;border-radius:10px;cursor:pointer}.product.active{border-color:#60a5fa;background:#172554}
#avatar{height:130px;display:grid;place-items:center;background:radial-gradient(#475569,#0f172a);border-radius:12px;font-size:72px}
#avatar.talking{animation:pulse .25s infinite alternate}@keyframes pulse{to{transform:scale(1.015)}}
#reply{min-height:100px;background:#0f172a;padding:12px;border-radius:10px;line-height:1.7;overflow-wrap:anywhere}
.status{font-size:.85rem;color:#cbd5e1;white-space:pre-wrap}a{color:#93c5fd}
@media(max-width:760px){main{grid-template-columns:1fr}body{padding:10px}}
</style></head>
<body><main>
<section>
<h1>TRACER AIライブ販売コンソール</h1>
<p class="warning">管理者専用。外部ライブ配信・SNS投稿は行わない。音声生成は操作した時だけ実行され、Fish Audioの利用枠を消費する場合がある。</p>
<label for="token">TRACER管理トークン（この画面のメモリ内だけで使用。保存しない）</label>
<input id="token" type="password" autocomplete="off" placeholder="管理トークン">
<div class="row"><button class="primary" id="connect">商品データを読み込む</button><button id="clear">トークン消去</button></div>
<p class="status" id="connection">未接続</p>
<h2>販売可能商品（TRACER読み取り専用）</h2>
<div id="productList">接続後、販売可能な日本語商品を表示する。</div>
</section>
<section>
<h2>AI販売員</h2>
<div id="avatar" role="img" aria-label="AI販売員の音声再生状態">🧑🏻‍💼</div>
<p id="selected" class="muted">商品を選択してください。</p>
<h2>コメント対応テスト</h2>
<div class="row">
<button data-comment="いくらですか？">価格</button><button data-comment="どんな商品ですか？">商品説明</button>
<button data-comment="在庫ありますか？">在庫</button><button data-comment="どこで買えますか？">購入方法</button>
<button data-comment="明日届きますか？">配送質問</button>
</div>
<div id="reply" aria-live="polite">商品を選び、質問ボタンを押すと、登録情報に基づく回答を音声化する。</div>
<audio id="audio" controls></audio>
<div class="row">
<button class="primary" id="run30">30分連続応答テスト</button><button id="run60">60分連続応答テスト</button><button id="stop">停止</button>
</div>
<p id="runStatus" class="status">連続テスト未実行</p>
<p class="muted">連続テストは1分ごとに模擬質問を送り、応答を音声化する。実際の配信コメント取得や公開配信ではない。停止ボタンでいつでも中断できる。</p>
</section></main>
<script>
(()=> {
 const $=id=>document.getElementById(id), token=$('token'), list=$('productList'), audio=$('audio'), avatar=$('avatar');
 let products=[], selected=null, runTimer=null, runDeadline=0, runCount=0, busy=false, runIndex=0, activeUrl=null;
 const questions=['いくらですか？','どんな商品ですか？','在庫ありますか？','どこで買えますか？','明日届きますか？'];
 function auth(){return {Authorization:'Bearer '+token.value.trim()};}
 async function api(path,options={}) {
  const response=await fetch(path,{...options,headers:{...auth(),...(options.headers||{})},cache:'no-store'});
  if(!response.ok) throw new Error(response.status===401?'認証エラー。管理トークンを確認。':'APIエラー '+response.status);
  return response;
 }
 function stopRun(message='停止しました。') {
  if(runTimer) clearTimeout(runTimer);runTimer=null;
  $('run30').disabled=false;$('run60').disabled=false;
  $('runStatus').textContent=message;
 }
 function clearAudio(){
  audio.pause();audio.removeAttribute('src');audio.load();
  if(activeUrl){URL.revokeObjectURL(activeUrl);activeUrl=null;}
  avatar.classList.remove('talking');
 }
 async function loadProducts(){
  if(!token.value.trim()) throw new Error('管理トークンを入力してください。');
  $('connection').textContent='TRACER商品データを確認中…';
  const res=await api('/api/admin/ai-live/products?limit=20');
  const data=await res.json();
  if(!data.ok) throw new Error(data.error||'商品取得に失敗');
  products=data.products||[];list.replaceChildren();
  if(!products.length){list.textContent='現在、条件を満たす販売可能な日本語商品はありません。';}
  products.forEach((p,i)=>{
   const el=document.createElement('div');el.className='product';el.tabIndex=0;
   const title=document.createElement('strong');title.textContent=p.title;
   const meta=document.createElement('div');meta.className='muted';meta.textContent=p.sellingPrice.toLocaleString('ja-JP')+'円 · 在庫あり';
   el.append(title,meta);el.addEventListener('click',()=>choose(p,el));
   el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(p,el);}});
   list.append(el);if(i===0)choose(p,el);
  });
  $('connection').textContent='接続済み：'+products.length+'商品 / 読み取り専用 / '+new Date(data.generatedAt).toLocaleString('ja-JP');
 }
 function choose(p,el){
  selected=p;document.querySelectorAll('.product').forEach(x=>x.classList.remove('active'));el.classList.add('active');
  $('selected').textContent=p.title+' / '+p.sellingPrice.toLocaleString('ja-JP')+'円';
  $('reply').textContent='選択中の商品：'+p.title;
 }
 async function respond(comment){
  if(!selected) throw new Error('先に商品を選択してください。');
  if(busy) return;
  busy=true;clearAudio();$('reply').textContent='コメントを確認し、商品情報と照合中…';
  try{
   const facts=await api('/api/admin/ai-live/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({comment,productId:selected.id})});
   const result=await facts.json();
   const reply=result.suggestedReply;
   if(!reply){$('reply').textContent='自動回答対象外：'+(result.route?.reason||'担当者確認が必要です');return false;}
   $('reply').textContent=reply;
   const speech=await api('/api/admin/ai-live/speak-reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({comment,productId:selected.id})});
   const blob=await speech.blob();if(!blob.type.startsWith('audio/'))throw new Error('音声データではありません。');
   activeUrl=URL.createObjectURL(blob);audio.src=activeUrl;avatar.classList.add('talking');
   await audio.play();
   await new Promise(resolve=>{audio.onended=resolve;audio.onerror=resolve;});
   avatar.classList.remove('talking');runCount++;return true;
  }finally{busy=false;avatar.classList.remove('talking');}
 }
 document.querySelectorAll('[data-comment]').forEach(b=>b.addEventListener('click',async()=>{
  stopRun('手動応答中');try{await respond(b.dataset.comment);}catch(e){$('reply').textContent=e.message;}
 }));
 $('connect').addEventListener('click',async()=>{try{await loadProducts();}catch(e){$('connection').textContent=e.message;}});
 $('clear').addEventListener('click',()=>{stopRun('トークンを消去');token.value='';products=[];selected=null;list.textContent='未接続';$('connection').textContent='未接続';clearAudio();});
 async function startRun(minutes){
  stopRun();if(!selected){$('runStatus').textContent='先に商品を読み込んで選択してください。';return;}
  runDeadline=Date.now()+minutes*60000;runCount=0;runIndex=0;
  $('run30').disabled=true;$('run60').disabled=true;
  const tick=async()=>{
   if(Date.now()>=runDeadline){stopRun(minutes+'分テスト完了。応答 '+runCount+'回');return;}
   $('runStatus').textContent=minutes+'分テスト実行中 / '+runCount+'回完了';
   try{await respond(questions[runIndex++%questions.length]);}
   catch(e){stopRun('エラーで停止：'+e.message);return;}
   if(Date.now()<runDeadline)runTimer=setTimeout(tick,60000);
   else stopRun(minutes+'分テスト完了。応答 '+runCount+'回');
  };
  await tick();
 }
 $('run30').addEventListener('click',()=>startRun(30));
 $('run60').addEventListener('click',()=>startRun(60));
 $('stop').addEventListener('click',()=>{stopRun('手動停止。応答 '+runCount+'回');clearAudio();});
 window.addEventListener('pagehide',()=>{stopRun();clearAudio();token.value='';});
})();
</script></body></html>
