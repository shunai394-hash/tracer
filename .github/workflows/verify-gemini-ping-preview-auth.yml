name: One-time Gemini ping preview auth verification

on:
  push:
    branches:
      - test/gemini-ping-preview-auth-20261012
    paths:
      - .github/workflows/verify-gemini-ping-preview-auth.yml

permissions:
  contents: read
  id-token: write

jobs:
  verify-preview-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify unauthenticated POST returns 401
        shell: bash
        run: |
          set -euo pipefail
          url="https://tracer-git-fix-protect-gemini-p-97760d-shunai394-9704s-projects.vercel.app/api/intelligence/ping"
          code="$(curl --silent --show-error --output /tmp/gemini-ping-unauth.json --write-out '%{http_code}' --max-time 20 -X POST -H 'Content-Type: application/json' --data '{}' "$url")"
          echo "Unauthenticated POST status: HTTP $code"
          if [[ "$code" != "401" ]]; then
            echo "Expected HTTP 401 from the auth guard; got HTTP $code"
            exit 1
          fi
      - name: Verify non-main GitHub OIDC token is rejected by the read-only production endpoint
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl --silent --show-error --fail -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          code="$(curl --silent --show-error --output /tmp/pipeline-status-oidc.json --write-out '%{http_code}' --max-time 20 -H "Authorization: Bearer $token" "https://tracer-pied-alpha.vercel.app/api/intelligence/pipeline-status")"
          echo "OIDC token from non-main ref: HTTP $code"
          if [[ "$code" != "401" ]]; then
            echo "Expected the ref guard to reject a non-main workflow token."
            exit 1
          fi
      - name: Verify bearer authentication reaches the protected handler
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "SKIP: CRON_SECRET GitHub Actions secret is unavailable; no authenticated bearer request was sent."
            exit 0
          fi
          url="https://tracer-git-fix-protect-gemini-p-97760d-shunai394-9704s-projects.vercel.app/api/intelligence/ping"
          code="$(curl --silent --show-error --output /tmp/gemini-ping-auth.json --write-out '%{http_code}' --max-time 25 -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer ${CRON_SECRET}" --data '{}' "$url")"
          echo "Authenticated POST status: HTTP $code"
          case "$code" in
            200) echo "PASS: auth accepted and Gemini ping succeeded." ;;
            503) echo "PASS: auth accepted; protected handler ran but Gemini/provider check returned 503." ;;
            401) echo "FAIL: preview rejected the configured bearer secret."; exit 1 ;;
            *) echo "FAIL: unexpected HTTP status from protected handler."; exit 1 ;;
          esac
