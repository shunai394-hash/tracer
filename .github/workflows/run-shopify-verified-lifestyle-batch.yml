name: One-time verified lifestyle Shopify sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-shopify-verified-lifestyle-batch.yml

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    if: contains(github.event.head_commit.message, '[run-shopify-lifestyle-now]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for production deployment
        run: sleep 60
      - name: Sync only three gate-passed lifestyle listings
        env:
          PRODUCTION_ORIGIN: https://tracer-pied-alpha.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          listing_ids='["2a40749b-da0e-4659-bfac-c7558d571be5","f48d0efc-3ebd-45dc-8a00-0e9d9ff32127","c50c3dc0-aac2-4c8c-8c00-751d7762f573"]'
          failures=0
          for pass in 1 2 3; do
            token_response="$(curl -fsS \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app")"
            token="$(jq -r '.value' <<< "$token_response")"
            test -n "$token" && test "$token" != "null"
            response="$(curl -sS --max-time 240 \
              -X POST \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" \
              -H "Cache-Control: no-cache" \
              --data "{\"listingIds\":$listing_ids,\"limit\":3}" \
              "$PRODUCTION_ORIGIN/api/admin/shopify/sync")"
            echo "$response" | jq '{ok,configured,attempted,synced,failed,listingIds}'
            configured="$(jq -r '.configured // false' <<< "$response")"
            failed_count="$(jq -r '(.failed // []) | length' <<< "$response")"
            if [[ "$configured" != "true" ]]; then
              echo "::error::Shopify sync is not configured"
              exit 1
            fi
            if [[ "$failed_count" -eq 0 ]]; then
              break
            fi
            failures=1
            listing_ids="$(jq -c '[.failed[]?.listingId | select(type == "string")]' <<< "$response")"
            [[ "$listing_ids" != "[]" ]] || break
            sleep 3
          done
          if [[ "$failures" -ne 0 ]]; then
            echo "::error::One or more targeted listings remain failed; inspect the JSON above."
            exit 1
          fi
