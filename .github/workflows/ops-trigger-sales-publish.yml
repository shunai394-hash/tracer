name: ops-trigger-sales-publish

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-trigger-sales-publish.yml"

jobs:
  trigger:
    if: contains(github.event.head_commit.message, "[ops-trigger]")
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sales publication
        run: |
          set -e
          curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://tracer-oj6gg3lhx-shunai394-9704s-projects.vercel.app/api/cron/sales-test-publication"
          sleep 10
          curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://tracer-oj6gg3lhx-shunai394-9704s-projects.vercel.app/api/cron/base-publish"
