name: One-time guarded Shopify sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-shopify-sync-once.yml

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    if: contains(github.event.head_commit.message, '[run-shopify-sync-now]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sync only the three verified women-focused listings
        env:
          PRODUCTION_ORIGIN: https://tracer-pied-alpha.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          listing_ids='["4583386e-0b03-4c1b-aa2c-445c1be0bcbc","9e9a03cb-6436-44af-a2d7-081a459af4f7","3b369452-762a-4ab2-9a46-20442ad9d574"]'
          for pass in 1 2 3; do
            token_response="$(curl -fsS \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app")"
            token="$(jq -r '.value' <<< "$token_response")"
            if [[ -z "$token" || "$token" == "null" ]]; then
              echo "GitHub OIDC token was not issued."
              exit 1
            fi

            response="$(curl -sS --max-time 240 \
              -X POST \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" \
              -H "Cache-Control: no-cache" \
              --data "{\"listingIds\":$listing_ids,\"limit\":3}" \
              "$PRODUCTION_ORIGIN/api/admin/shopify/sync")"
            echo "$response" | jq '{ok, configured, attempted, synced, failed, listingIds}'
            configured="$(jq -r '.configured // false' <<< "$response")"
            failed_count="$(jq -r '(.failed // []) | length' <<< "$response")"
            synced="$(jq -r '.synced // 0' <<< "$response")"
            attempted="$(jq -r '.attempted // 0' <<< "$response")"
            if [[ "$configured" != "true" || "$failed_count" -gt 0 ]]; then failures=1; fi
            if [[ "$failed_count" -eq 0 ]]; then
              break
            fi
            listing_ids="$(jq -c '[.failed[]?.listingId | select(type == "string")]' <<< "$response")"
            if [[ "$listing_ids" == "[]" ]]; then break; fi
            sleep 3
          done
          if [[ "$failures" -ne 0 ]]; then
            echo "At least one targeted Shopify sync pass reported failures; inspect the JSON above."
            exit 1
          fi
