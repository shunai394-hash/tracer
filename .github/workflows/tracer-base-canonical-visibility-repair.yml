name: TRACER BASE canonical hidden-item repair

on:
  push:
    branches: [main]
    paths:
      - "ops/run-base-canonical-visibility-repair-once.txt"
  workflow_dispatch:
    inputs:
      apply:
        description: "Publish eligible canonical items on BASE (false = read-only preflight)"
        required: false
        type: boolean
        default: false
      limit:
        description: "Maximum canonical items to repair in this run (1-70; processed in verified batches of 10)"
        required: false
        type: number
        default: 70

permissions:
  contents: read
  id-token: write

concurrency:
  group: tracer-base-canonical-hidden-item-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait until production serves this commit
        env:
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            response="$(curl --fail --silent --show-error --max-time 15 https://tracer-pied-alpha.vercel.app/api/health || true)"
            deployed_sha="$(printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);process.stdout.write(String(j.gitCommitSha||j.commitSha||j.commit||j.sha||""))}catch{}})')"
            if [ "$deployed_sha" = "$TARGET_SHA" ]; then echo "Production serves $TARGET_SHA"; exit 0; fi
            sleep 10
          done
          echo "Production did not report target SHA $TARGET_SHA; refusing BASE repair."
          exit 1
      - name: Run read-only preflight and optional bounded repair
        env:
          APPLY: ${{ github.event_name == 'push' || inputs.apply }}
          REPAIR_LIMIT: ${{ github.event_name == 'push' && 70 || inputs.limit }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          const audience = "https://tracer-pied-alpha.vercel.app";
          const tokenUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          tokenUrl.searchParams.set("audience", audience);
          const tokenResponse = await fetch(tokenUrl, { headers: { Authorization: "Bearer " + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN } });
          if (!tokenResponse.ok) throw new Error("OIDC_TOKEN_REQUEST_FAILED:" + tokenResponse.status);
          const tokenBody = await tokenResponse.json();
          if (typeof tokenBody.value !== "string" || !tokenBody.value) throw new Error("OIDC_TOKEN_MISSING");
          const endpoint = audience + "/api/channels/base/visibility-repair";
          const headers = { Authorization: "Bearer " + tokenBody.value, "Content-Type": "application/json", Accept: "application/json" };
          const maxItems = Math.max(1, Math.min(70, Math.floor(Number(process.env.REPAIR_LIMIT) || 70)));
          const request = async (apply, limit) => {
            const response = await fetch(endpoint, { method: "POST", headers, body: JSON.stringify({ apply, limit }), signal: AbortSignal.timeout(110000) });
            const result = await response.json().catch(() => ({}));
            if (!response.ok || result.ok !== true) throw new Error("BASE_VISIBILITY_REPAIR_REQUEST_FAILED:" + response.status);
            return { status: response.status, result };
          };
          const first = await request(false, Math.min(10, maxItems));
          let preflight = first.result;
          console.log(JSON.stringify({ stage: "read-only preflight", status: first.status, ...preflight }, null, 2));
          if (preflight.readOnly !== true || preflight.snapshotComplete !== true) throw new Error("BASE_VISIBILITY_REPAIR_PREFLIGHT_FAILED");
          let result = preflight;
          const batches = [];
          let totalVerified = 0;
          if (process.env.APPLY === "true") {
            let remaining = maxItems;
            for (let batchNo = 1; batchNo <= 10 && remaining > 0; batchNo++) {
              if (Number(preflight.eligibleCandidates) <= 0) break;
              const limit = Math.min(10, remaining);
              const applied = await request(true, limit);
              result = applied.result;
              console.log(JSON.stringify({ stage: "apply batch " + batchNo, status: applied.status, ...result }, null, 2));
              if (result.readbackFailed > 0 || result.failed > 0 || result.readbackVerified <= 0) {
                throw new Error("BASE_VISIBILITY_REPAIR_BATCH_FAILED:" + batchNo);
              }
              batches.push({ batchNo, requested: limit, selected: result.selected, published: result.published, readbackVerified: result.readbackVerified, readbackFailed: result.readbackFailed, readback: result.readback });
              totalVerified += Number(result.readbackVerified || 0);
              remaining -= Number(result.readbackVerified || 0);
              const next = await request(false, Math.min(10, remaining || 1));
              preflight = next.result;
              if (preflight.readOnly !== true || preflight.snapshotComplete !== true) throw new Error("BASE_VISIBILITY_REPAIR_PREFLIGHT_FAILED_AFTER_BATCH");
              if (result.readbackVerified === 0 || (Number(preflight.eligibleCandidates) > 0 && remaining <= 0)) break;
            }
            result = { ok: batches.every(x => x.readbackFailed === 0), apply: true, readOnly: false, maxItems, totalVerified, batches, remainingEligible: preflight.eligibleCandidates, finalPreflight: preflight };
            if (result.ok !== true) throw new Error("BASE_VISIBILITY_REPAIR_FAILED");
          } else {
            console.log("Read-only mode: no BASE item was edited.");
            result = { ...preflight, maxItems, batches: [], totalVerified: 0 };
          }
          await writeFile("base-canonical-visibility-repair-result.json", JSON.stringify(result, null, 2), { mode: "0600" });
          await writeFile(process.env.GITHUB_STEP_SUMMARY, [
            "# TRACER BASE canonical hidden-item repair",
            "",
            "Mode: " + (process.env.APPLY === "true" ? "apply" : "read-only"),
            "",
            "```json",
            JSON.stringify(result, null, 2),
            "```",
            ""
          ].join("\n"));
          NODE
      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-canonical-visibility-repair-${{ github.run_id }}
          path: base-canonical-visibility-repair-result.json
          if-no-files-found: ignore
          retention-days: 14
