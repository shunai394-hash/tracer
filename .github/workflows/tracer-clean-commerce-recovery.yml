name: TRACER clean-commerce bounded recovery

# TRACER_CLEAN_COMMERCE_RECOVERY: bounded production recovery requested 2026-10-16; wait for exact production commit before supplier import and gated channel publication.
# Recovery re-trigger after CJ identity parser, bounded batch, and Shopify inventory idempotency fixes (2026-10-17).
# Publish both storefronts through one shared commerce entry point.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  recover:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'TRACER_CLEAN_COMMERCE_RECOVERY')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository history for deployment SHA verification
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for production to serve this exact commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          ready=0
          for attempt in $(seq 1 36); do
            code="$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 10 "$BASE/api/health" || true)"
            sha="$(python3 -c 'import json; d=json.load(open("/tmp/health.json")); print(d.get("gitCommitSha") or "")' 2>/dev/null || true)"
            if [[ "$code" == "200" && "$sha" == "$GITHUB_SHA" ]]; then
              echo "Production is serving expected commit $GITHUB_SHA."
              ready=1
              break
            fi
            if [[ "$code" == "200" && -n "$sha" ]]; then
              git fetch --no-tags origin main
              if git cat-file -e "$sha^{commit}" 2>/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" "$sha"; then
                echo "Production is serving descendant commit $sha, which includes $GITHUB_SHA."
                ready=1
                break
              fi
            fi
            echo "Waiting for deployment: HTTP=$code sha=$sha attempt=$attempt/36"
            sleep 10
          done
          [[ "$ready" == "1" ]] || { echo "Production did not serve this commit within 6 minutes."; exit 1; }

      - name: Publish both storefronts through the unified commerce runner
        shell: bash
        run: |
          set -uo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          token() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }
          call_publish() {
            local path="$1" out="$2" t code
            t="$(token)" || { echo "OIDC token failed for $path"; return 1; }
            code="$(curl -sS -o "$out" -w "%{http_code}" --max-time 300 \
              -H "Authorization: Bearer $t" "$BASE/$path" || true)"
            echo "=== $path HTTP $code ==="
            python3 - "$out" <<'PY'
          import json,sys
          try:
              d=json.load(open(sys.argv[1]))
              print(json.dumps(d,ensure_ascii=False)[:6000])
          except Exception:
              print(open(sys.argv[1]).read()[:1200])
          PY
            [[ "$code" == "200" ]]
          }
          failed=0
          # One recovery workflow: first recalculate existing linked offers and reconcile stale storefront prices,
          # then publish bounded eligible items to both channels through the shared publisher.
          # Supplier discovery and paid-order procurement remain separate; no stock/shipping evidence is fabricated.
          call_publish "api/cron/commerce-reprice-existing?limit=100" "commerce-reprice.json" || failed=1
          for pass in 1 2 3; do
            call_publish "api/cron/commerce-publish-all?limit=5&onlyUnpublished=true" "commerce-publish-${pass}.json" || failed=1
          done
          echo "Unified bounded publication passes finished; inspect each JSON response for published/failed counts."
          exit "$failed"
