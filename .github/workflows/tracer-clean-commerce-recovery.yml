name: TRACER clean-commerce bounded recovery

# TRACER_CLEAN_COMMERCE_RECOVERY: bounded production recovery requested 2026-10-16; wait for exact production commit before supplier import and gated channel publication.
# Recovery re-trigger after CJ identity parser, bounded batch, and Shopify inventory idempotency fixes (2026-10-17).
# Run the bounded publication recovery after the timeout fix is deployed.
# 2026-10-18: trigger the guarded recovery workflow after confirming the verified backlog is ready.
# 2026-10-18: TRACER_CLEAN_COMMERCE_RECOVERY retry with title-only legacy backlog isolated.
# 2026-10-18: TRACER_CLEAN_COMMERCE_RECOVERY retry after batched listing-state read fix.
# 2026-10-18: TRACER_CLEAN_COMMERCE_RECOVERY verify saleability and hide unfulfillable existing listings.
# 2026-10-18: TRACER_CLEAN_COMMERCE_RECOVERY rerun after fresh-offer repricing fix #1328 is deployed.
# 2026-10-18: TRACER_CLEAN_COMMERCE_RECOVERY retry for two fresh verified bag listings.
# 2026-10-20: retry recovery after stale hidden BASE identity markers became re-queueable.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Isolate recovery runs by commit. A shared group allows a newer ordinary push
# to cancel the queued run before its job-level commit-message guard can skip it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  recover:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'TRACER_CLEAN_COMMERCE_RECOVERY')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository history for deployment SHA verification
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for production to serve this exact commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          ready=0
          for attempt in $(seq 1 36); do
            code="$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 10 "$BASE/api/health" || true)"
            sha="$(python3 -c 'import json; d=json.load(open("/tmp/health.json")); print(d.get("gitCommitSha") or "")' 2>/dev/null || true)"
            if [[ "$code" == "200" && "$sha" == "$GITHUB_SHA" ]]; then
              echo "Production is serving expected commit $GITHUB_SHA."
              ready=1
              break
            fi
            if [[ "$code" == "200" && -n "$sha" ]]; then
              git fetch --no-tags origin main
              if git cat-file -e "$sha^{commit}" 2>/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" "$sha"; then
                echo "Production is serving descendant commit $sha, which includes $GITHUB_SHA."
                ready=1
                break
              fi
            fi
            echo "Waiting for deployment: HTTP=$code sha=$sha attempt=$attempt/36"
            sleep 10
          done
          [[ "$ready" == "1" ]] || { echo "Production did not serve this commit within 6 minutes."; exit 1; }

      - name: Reconcile existing prices in bounded batches
        shell: bash
        run: |
          set -uo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          token() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }
          call_api() {
            local path="$1" out="$2" t code
            t="$(token)" || { echo "OIDC token failed for $path"; return 1; }
            code="$(curl -sS -o "$out" -w "%{http_code}" --max-time 300 \
              -H "Authorization: Bearer $t" "$BASE/$path" || true)"
            echo "=== $path HTTP $code ==="
            python3 - "$out" <<'PY'
          import json,sys
          try: print(json.dumps(json.load(open(sys.argv[1])),ensure_ascii=False)[:6000])
          except Exception: print(open(sys.argv[1]).read()[:1200])
          PY
            [[ "$code" == "200" || "$code" == "207" ]]
          }
          # Reprice one bounded batch only. This endpoint also reconciles both storefronts,
          # so looping it until the entire storefront backlog drains can consume the full
          # workflow timeout before the dedicated publication step ever starts.
          call_api "api/cron/commerce-reprice-existing?limit=25" "commerce-reprice-1.json" || {
            echo "Price reconciliation request failed; refusing publication."
            exit 1
          }
          python3 - <<'PY'
          import json,pathlib,sys
          path=pathlib.Path("commerce-reprice-1.json")
          try:
              data=json.loads(path.read_text())
          except Exception as exc:
              print(f"Price reconciliation response is invalid: {exc}")
              sys.exit(1)
          errors=data.get("errors") or []
          if data.get("error") or errors:
              print("Price calculation did not complete cleanly; refusing publication.")
              print(json.dumps({"ok":data.get("ok"),"repriced":data.get("repriced"),"errors":len(errors)},ensure_ascii=False))
              sys.exit(1)
          print(json.dumps({
              "ok":data.get("ok"),
              "considered":data.get("considered"),
              "repriced":data.get("repriced"),
              "storefrontSync":data.get("storefrontSync"),
              "storefrontSyncRemaining":data.get("storefrontSyncRemaining"),
              "storefrontSyncErrors":len(data.get("storefrontSyncErrors") or []),
          },ensure_ascii=False))
          print("Price batch completed. Remaining storefront backlog is handled by the dedicated bounded publication step and recurring cron.")
          PY

      - name: Publish verified commerce backlog in bounded batches
        shell: bash
        run: |
          set -uo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          token() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }
          call_publish() {
            local path="$1" out="$2" t code
            t="$(token)" || { echo "OIDC token failed for $path"; return 1; }
            code="$(curl -sS -o "$out" -w "%{http_code}" --max-time 300 \
              -H "Authorization: Bearer $t" "$BASE/$path" || true)"
            echo "=== $path HTTP $code ==="
            python3 - "$out" <<'PY'
          import json,sys
          try:
              d=json.load(open(sys.argv[1]))
              print(json.dumps(d,ensure_ascii=False)[:6000])
          except Exception:
              print(open(sys.argv[1]).read()[:1200])
          PY
            [[ "$code" == "200" ]]
          }
          failed=0
          # CJ's daily API points are exhausted. Publish only already verified,
          # fresh, profitable Japanese listings; supplier import remains separate.
          # Each pass is deliberately small: the previous 100-item requests timed out
          # at the platform 300-second limit. Repeat bounded 10-item passes to drain
          # the known backlog while preserving per-request limits and safety checks.
          # Stop on any HTTP/API failure rather than claiming the backlog is complete.
          for pass in $(seq 1 25); do
            call_publish "api/cron/commerce-publish-base?limit=10&onlyUnpublished=true" "base-publish-${pass}.json" || failed=1
            call_publish "api/cron/commerce-publish-shopify?limit=10&onlyUnpublished=true" "shopify-publish-${pass}.json" || failed=1
          done
          # No supplier purchase or customer order is created by this workflow.
          # Paid-order procurement remains separate and requires payment_status=paid.
          echo "Bounded publication passes finished; inspect each JSON response for published/failed counts."
          exit "$failed"
# 2026-10-18: TRACER_CLEAN_COMMERCE_RECOVERY after #1344 newest-first supplier offer scan is live; reconcile prices and publish bounded eligible backlog.
# 2026-10-20: one-shot rerun after production deploy #1694 removed timestamp-only listing blocks; recheck actual eligibility and bounded channel recovery.
# 2026-10-20: TRACER_CLEAN_COMMERCE_RECOVERY rerun with single-batch repricing so eligible channel publication starts promptly.
# 2026-10-25: TRACER_CLEAN_COMMERCE_RECOVERY after PR #1952 added source-grounded Japanese titles for two verified brush-cleaning products.

# 2026-10-20: TRACER_CLEAN_COMMERCE_RECOVERY trigger after PR #1709 separated fatal repricing errors from remaining storefront backlog.
