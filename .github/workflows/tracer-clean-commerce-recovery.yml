name: TRACER clean-commerce bounded recovery

# Post-reset rebuild: wait for the exact production commit before supplier imports or channel writes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  recover:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'TRACER_CLEAN_COMMERCE_RECOVERY')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for production to serve this exact commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          ready=0
          for attempt in $(seq 1 36); do
            code="$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 10 "$BASE/api/health" || true)"
            sha="$(python3 -c 'import json; d=json.load(open("/tmp/health.json")); print(d.get("gitCommitSha") or "")' 2>/dev/null || true)"
            if [[ "$code" == "200" && "$sha" == "$GITHUB_SHA" ]]; then
              echo "Production is serving expected commit $GITHUB_SHA."
              ready=1
              break
            fi
            echo "Waiting for deployment: HTTP=$code sha=$sha attempt=$attempt/36"
            sleep 10
          done
          [[ "$ready" == "1" ]] || { echo "Production did not serve this commit within 6 minutes."; exit 1; }

      - name: Import supplier-native CJ products and run gated channel publication
        shell: bash
        run: |
          set -uo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          token() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }
          call_get() {
            local path="$1" out="$2" max_time="$3" t code
            t="$(token)" || { echo "OIDC token failed for $path"; return 1; }
            code="$(curl -sS -o "$out" -w "%{http_code}" --max-time "$max_time" \
              -H "Authorization: Bearer $t" "$BASE/$path" || true)"
            echo "=== $path HTTP $code ==="
            python3 - "$out" <<'PY'
          import json,sys
          try:
              d=json.load(open(sys.argv[1]))
              print(json.dumps(d,ensure_ascii=False)[:6000])
          except Exception:
              print(open(sys.argv[1]).read()[:1200])
          PY
            [[ "$code" == "200" || "$code" == "207" ]]
          }
          failed=0
          # Refresh existing products by exact CJ IDs before discovering any new products.
          call_get "api/cron/commerce-cj-import?productIds=1732295872995663872,1732293361517735936,2406100641131613800,2406110943541622000&limit=4" "cj-refresh-bags-hair-1.json" 300 || failed=1
          call_get "api/cron/commerce-cj-import?productIds=1715919913287692288,1439910326744256512,2409230148051626500,1606597353589452800&limit=4" "cj-refresh-bags-hair-2.json" 300 || failed=1
          call_get "api/cron/commerce-cj-import?limit=2" "cj-import.json" 300 || failed=1
          call_publish() {
            local path="$1" out="$2" t code
            t="$(token)" || { echo "OIDC token failed for $path"; return 1; }
            code="$(curl -sS -o "$out" -w "%{http_code}" --max-time 300 \
              -H "Authorization: Bearer $t" "$BASE/$path" || true)"
            echo "=== $path HTTP $code ==="
            python3 - "$out" <<'PY'
          import json,sys
          try:
              d=json.load(open(sys.argv[1]))
              print(json.dumps(d,ensure_ascii=False)[:6000])
          except Exception:
              print(open(sys.argv[1]).read()[:1200])
          PY
            [[ "$code" == "200" ]]
          }
          # Publish only fresh, verified, profitable Japanese listings; the bounded import ran once above.
          call_publish "api/cron/commerce-publish-base" "base-publish.json" || failed=1
          call_publish "api/cron/commerce-publish-shopify" "shopify-publish.json" || failed=1
          # No supplier purchase is created here; the procurement cron independently requires payment_status=paid.
          echo "Publication pass finished. Any partial failures are recorded in the output JSON above."
          exit "$failed"
