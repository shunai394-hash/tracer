name: TRACER Ten-Cycle Supply, Publication & Audit
# Manual, bounded production run. This discovers supply and publishes only candidates
# that pass the existing Sales Test Gate; it does not place supplier purchase orders.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: tracer-ten-cycle-production-patrol
  cancel-in-progress: false

jobs:
  ten-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Run ten measured supply / publication / audit cycles
        shell: bash
        run: |
          set -uo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          FAILED=0

          token() {
            curl --fail-with-body --silent --show-error --max-time 30 \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }

          run_endpoint() {
            local cycle="$1"
            local label="$2"
            local path="$3"
            local max_seconds="$4"
            local output="cycle-${cycle}-${label}.json"
            local access_token
            local http_status

            echo "===== CYCLE ${cycle} / 10: ${label} ====="
            if ! access_token="$(token)"; then
              printf '{"ok":false,"error":"oidc_token_failed","path":"%s"}\n' "$path" > "$output"
              echo "::error::Cycle ${cycle} ${label}: could not obtain deployment token"
              FAILED=1
              return 0
            fi

            if ! http_status="$(curl --silent --show-error --max-time "$max_seconds" \
              -o "$output" -w '%{http_code}' \
              -H "Authorization: Bearer ${access_token}" \
              "${BASE}${path}")"; then
              echo "::error::Cycle ${cycle} ${label}: request failed or timed out"
              FAILED=1
              return 0
            fi

            if ! python3 - "$output" "$http_status" "$label" <<'PY'
          import json, sys
          path, status, label = sys.argv[1:]
          try:
              with open(path, encoding="utf-8") as f:
                  body = json.load(f)
          except Exception as exc:
              print(f"::error::{label}: response is not valid JSON: {exc}")
              raise SystemExit(1)
          if not status.isdigit() or not 200 <= int(status) < 300:
              print(f"::error::{label}: HTTP {status}")
              raise SystemExit(1)
          if not isinstance(body, dict) or body.get("ok") is not True:
              print(f"::error::{label}: endpoint did not report ok=true")
              raise SystemExit(1)
          print(f"{label}: HTTP {status}, ok=true")
          if label == "audit":
              counts = body.get("counts", {})
              for key in ("shop_listings", "shop_listings_published", "shop_listings_published_orderable", "shop_listings_on_base_published"):
                  print(f"  {key}={counts.get(key, 'not_returned')}")
          if label == "supply":
              supply = body.get("supplyFirst", {})
              opportunity = body.get("opportunityIntelligence", {})
              if isinstance(supply, dict) and (supply.get("ok") is False or supply.get("error")):
                  print("::error::Supply discovery reported a nested failure")
                  raise SystemExit(1)
              if isinstance(opportunity, dict) and opportunity.get("error"):
                  print("::error::Opportunity intelligence reported a nested failure")
                  raise SystemExit(1)
          if label == "sales":
              selected = body.get("supplySelected", body.get("decision", {}))
              if isinstance(selected, dict):
                  print(f"  published={selected.get('published', 'not_returned')}")
              downstream = body.get("downstream", {})
              if not isinstance(downstream, dict):
                  downstream = {}
              shopify = downstream.get("shopify", {})
              if isinstance(shopify, dict) and (shopify.get("error") or shopify.get("configured") is False or shopify.get("failed", 0)):
                  print("::error::Shopify sync reported a failure or is not configured")
                  raise SystemExit(1)
              base = downstream.get("base", {})
              if isinstance(base, dict) and base.get("error"):
                  print("::error::BASE publication reported a failure")
                  raise SystemExit(1)
              if isinstance(base, dict):
                  results = base.get("results", [])
                  failed = [row for row in results if not row.get("ok") or not row.get("baseItemId")]
                  if failed:
                      print(f"::error::BASE reported {len(failed)} failed/unlinked publication result(s)")
                      raise SystemExit(1)
          PY
            then
              FAILED=1
            fi
          }

          for cycle in $(seq 1 10); do
            run_endpoint "$cycle" supply "/api/cron/supply-first" 300
            run_endpoint "$cycle" sales "/api/cron/sales-test-publication" 300
            run_endpoint "$cycle" audit "/api/intelligence/pipeline-audit" 60
          done

          echo "===== FINAL SUMMARY ====="
          echo "cycles=10"
          if ! python3 <<'PY'
          import json
          def counts(cycle):
              with open(f"cycle-{cycle}-audit.json", encoding="utf-8") as f:
                  return json.load(f).get("counts", {})
          try:
              before, after = counts(1), counts(10)
          except Exception as exc:
              print(f"::error::Cannot compare first/last audit counts: {exc}")
              raise SystemExit(1)
          keys = ("shop_listings_published", "shop_listings_published_orderable", "shop_listings_on_base_published")
          progressed = False
          for key in keys:
              a, b = before.get(key), after.get(key)
              print(f"{key}: before={a} after={b}")
              if isinstance(a, (int, float)) and isinstance(b, (int, float)) and b > a:
                  progressed = True
          if not progressed:
              print("::error::Ten cycles ran but no publication/orderability count increased; inspect blockers in the saved audit evidence.")
              raise SystemExit(1)
          print("Verified progress: at least one publication/orderability count increased.")
          PY
          then
            FAILED=1
          fi
          echo "failed_endpoint_or_publication_checks=${FAILED}"
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::At least one cycle failed or the ten-cycle run made no measurable publication progress; inspect saved cycle JSON artifacts."
            exit 1
          fi
          echo "All ten cycles completed with successful checks and measurable progress."
      - name: Preserve per-cycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracer-ten-cycle-evidence
          path: cycle-*.json
          if-no-files-found: warn
          retention-days: 30
