name: BASE external listing readback audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/base-external-readback-audit.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: base-external-readback-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Read actual BASE item details in bounded batches
        run: |
          node <<'NODE'
          const fs = require("node:fs/promises");
          (async () => {
            const audience = "https://tracer-pied-alpha.vercel.app";
            const oidcUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            oidcUrl.searchParams.set("audience", audience);
            const oidcResponse = await fetch(oidcUrl, {
              headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            });
            if (!oidcResponse.ok) throw new Error(`GitHub OIDC token request failed: HTTP ${oidcResponse.status}`);
            const { value: token } = await oidcResponse.json();
            if (!token) throw new Error("GitHub OIDC token was missing");

            const baseUrl = "https://tracer-pied-alpha.vercel.app/api/cron/base-channel-external-readback";
            const limit = 10;
            let offset = 0;
            let totalRows = null;
            const totals = {
              rowsReturned: 0, priceMatches: 0, priceMismatches: 0,
              skuMatches: 0, skuMismatches: 0,
              visibilityMatches: 0, visibilityMismatches: 0, readErrors: 0, missingSku: 0,
            };
            const anomalies = [];
            const readErrorCounts = {};

            while (totalRows === null || offset < totalRows) {
              const url = new URL(baseUrl);
              url.searchParams.set("offset", String(offset));
              url.searchParams.set("limit", String(limit));
              const response = await fetch(url, {
                headers: { Authorization: `Bearer ${token}`, Accept: "application/json" },
                cache: "no-store",
              });
              const body = await response.json();
              if (!response.ok && response.status !== 207) {
                throw new Error(`BASE readback failed at offset ${offset}: HTTP ${response.status} ${body.error ?? "unknown"}`);
              }
              if (totalRows === null) totalRows = body.totalRows;
              if (!Number.isFinite(totalRows)) throw new Error("Audit response did not include totalRows");
              for (const key of Object.keys(totals)) totals[key] += Number(body[key] ?? 0);
              for (const [error, count] of Object.entries(body.readErrorCounts ?? {})) {
                readErrorCounts[error] = (readErrorCounts[error] ?? 0) + Number(count ?? 0);
              }
              for (const row of body.results ?? []) {
                if (row.error || !row.priceMatches || !row.skuMatches || !row.visibilityMatches || !row.skuPresent) {
                  anomalies.push({
                    listingId: row.listingId, baseItemId: row.baseItemId, status: row.status,
                    expectedSku: row.expectedSku, externalSku: row.externalSku,
                    expectedPrice: row.expectedPrice, externalPrice: row.externalPrice,
                    externalVisible: row.externalVisible, skuPresent: row.skuPresent,
                    skuMatches: row.skuMatches, priceMatches: row.priceMatches, visibilityMatches: row.visibilityMatches,
                    error: row.error,
                  });
                }
              }
              const nextOffset = Number(body.nextOffset);
              if (!Number.isFinite(nextOffset) || nextOffset <= offset) {
                throw new Error(`Audit pagination did not advance at offset ${offset}`);
              }
              offset = nextOffset;
              console.log(JSON.stringify({ offset, totalRows, pageRows: body.rowsReturned, pageErrors: body.readErrors }));
            }

            const report = {
              completedAt: new Date().toISOString(),
              totalRows,
              ...totals,
              readErrorCounts,
              anomalyCount: anomalies.length,
              anomalies,
            };
            await fs.mkdir("base-external-readback-artifacts", { recursive: true });
            await fs.writeFile("base-external-readback-artifacts/report.json", JSON.stringify(report, null, 2) + "\n");
            const columns = [
              "listingId", "baseItemId", "status", "expectedSku", "externalSku",
              "expectedPrice", "externalPrice", "externalVisible", "skuPresent",
              "skuMatches", "priceMatches", "visibilityMatches", "error",
            ];
            const csvCell = (value) => {
              const text = value == null ? "" : String(value);
              return /[",\r\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
            };
            const csv = [columns.join(","), ...anomalies.map((row) => columns.map((key) => csvCell(row[key])).join(","))].join("\n") + "\n";
            await fs.writeFile("base-external-readback-artifacts/anomalies.csv", csv);

            const summary = [
              "# BASE external listing readback audit", "",
              `- Total TRACER BASE listing rows: **${totalRows}**`,
              `- Rows actually scanned: **${totals.rowsReturned}**`,
              `- Price matches / mismatches: **${totals.priceMatches} / ${totals.priceMismatches}**`,
              `- SKU matches / mismatches: **${totals.skuMatches} / ${totals.skuMismatches}**`,
              `- Visibility matches / mismatches: **${totals.visibilityMatches} / ${totals.visibilityMismatches}**`,
              `- External API read errors: **${totals.readErrors}**`,
              `- Read error categories: **${JSON.stringify(readErrorCounts)}**`,
              `- Rows without external SKU: **${totals.missingSku}**`,
              `- Rows requiring review: **${anomalies.length}**`,
              "- Machine-readable JSON and CSV are attached as the workflow artifact **base-external-readback-audit**.", "",
              anomalies.length ? "## Anomalies\n\n```json\n" + JSON.stringify(anomalies, null, 2) + "\n```" : "No discrepancies detected in the returned listing set.",
              "",
            ].join("\n");
            await fs.appendFile(process.env.GITHUB_STEP_SUMMARY, summary);
            console.log(JSON.stringify({ ...report, anomalies: anomalies.slice(0, 50) }, null, 2));

            const incomplete = totals.rowsReturned !== totalRows;
            const mismatches = totals.priceMismatches > 0 || totals.skuMismatches > 0 ||
              totals.visibilityMismatches > 0 || totals.readErrors > 0 ||
              totals.missingSku > 0 || anomalies.length > 0;
            if (incomplete) console.error(`Incomplete audit: scanned ${totals.rowsReturned} of ${totalRows} rows`);
            if (mismatches) console.error("Audit found discrepancies; inspect the JSON/CSV artifact and step summary.");
            if (incomplete || mismatches) process.exitCode = 1;
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Upload JSON and CSV audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-external-readback-audit
          path: base-external-readback-artifacts/
          if-no-files-found: warn
          retention-days: 30
