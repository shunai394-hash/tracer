name: TRACER Read-only Production Probe

# Read-only evidence collection against production while deploys are rate
# limited. Only GET requests to endpoints that are already public on the
# deployed commit; no auth tokens, no writes, no event sends.
on:
  push:
    branches: ["claude/sweet-cori-vf28y4"]
    paths: [".github/workflows/tracer-readonly-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch public read-only endpoints
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p probe
          T=https://tracer-self.vercel.app
          N=https://newfind-self.vercel.app
          get() { # get <file> <url>
            code="$(curl -sS -o "probe/$1" -w '%{http_code}' --max-time 60 "$2" || echo 000)"
            echo "$1 HTTP $code ($(wc -c < "probe/$1" 2>/dev/null || echo 0) bytes)"
          }
          get tracer_health.json "$T/api/health"
          get demand_matches.json "$T/api/intelligence/demand-match-inspect"
          get demand_candidates.json "$T/api/intelligence/demand-candidate-inspect"
          get demand_latest.json "$T/api/intelligence/demand-latest"
          get cj_listings.json "$T/api/intelligence/cj-listing-inspect"
          get product_catalog.json "$T/api/intelligence/product-catalog-inspect"
          get newfind_tracer_receiver.json "$N/api/integrations/tracer"
          get newfind_discovery_public.json "$N/api/discovery"
          # Observation rows referenced by the newest candidates (max 12).
          python3 - <<'PY' > probe/obs_ids.txt
          import json
          try:
              rows = json.load(open("probe/demand_candidates.json")).get("rows") or []
          except Exception:
              rows = []
          seen = []
          for r in rows:
              oid = r.get("demand_observation_id")
              if oid and oid not in seen:
                  seen.append(oid)
          print("\n".join(seen[:12]))
          PY
          i=0
          while read -r id; do
            [ -n "$id" ] || continue
            i=$((i+1)); get "obs_$i.json" "$T/api/intelligence/demand-observation-inspect?id=$id"
          done < probe/obs_ids.txt

      - name: NEWFIND-linked TRACER URLs liveness (all, liveness header -> no funnel write)
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY' > probe/nf_urls.txt
          import json
          d = json.load(open("probe/newfind_discovery_public.json"))
          for p in d.get("products") or []:
              if (p.get("discoverySource") or p.get("discovery_source")) == "tracer":
                  print(p.get("productUrl") or p.get("product_url") or "")
          PY
          total=0; declare -A codes
          while read -r u; do
            [ -n "$u" ] || continue
            total=$((total+1))
            c="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -H 'x-tracer-liveness-check: 1' "$u" || echo 000)"
            codes[$c]=$(( ${codes[$c]:-0} + 1 ))
          done < probe/nf_urls.txt
          echo "newfind tracer urls checked: $total"
          for k in "${!codes[@]}"; do echo "  HTTP $k: ${codes[$k]}"; done

      - name: Summarize
        shell: bash
        run: |
          python3 - <<'PY'
          import json, glob, collections
          def load(name):
              try:
                  return json.load(open(f"probe/{name}"))
              except Exception as e:
                  return {"_error": str(e)}
          print("tracer health:", {k: v for k, v in load("tracer_health.json").items() if k in ("ok", "commit", "commitSha", "version")})
          m = load("demand_matches.json")
          rows = m.get("rows") or []
          print("demand_product_matches (latest<=100):", len(rows), "methods:", dict(collections.Counter(r.get("match_method") for r in rows)))
          for r in rows[:15]:
              q = ((r.get("demand_observations") or {}).get("metadata") or {}).get("query")
              print("  match", r.get("created_at"), r.get("match_method"), r.get("match_score"), "| q=", q, "| p=", (r.get("products") or {}).get("canonical_name"))
          c = load("demand_candidates.json")
          crow = c.get("rows") or []
          print("demand_product_candidates (latest<=100):", len(crow), "status:", dict(collections.Counter(r.get("status") for r in crow)), "source:", dict(collections.Counter(r.get("source") for r in crow)))
          for r in crow[:20]:
              print("  cand", r.get("created_at"), r.get("status"), r.get("category"), "| q=", r.get("query"), "| obs=", r.get("demand_observation_id"))
          d = load("demand_latest.json")
          for r in (d.get("rows") or []):
              md = r.get("metadata") or {}
              print("  obs", r.get("observed_at"), r.get("signal_type"), r.get("value"), "| q=", md.get("query"), "| provider=", md.get("provider"), "| product_id=", r.get("product_id"), "| ids=", {k: md.get(k) for k in ("jan","gtin","mpn","model","brand") if md.get(k)})
          for f in sorted(glob.glob("probe/obs_*.json")):
              o = load(f.split("/")[-1])
              r = o.get("row") or o.get("data") or o
              md = (r or {}).get("metadata") or {}
              print("  trace-obs", f, (r or {}).get("signal_type"), "| q=", md.get("query"), "| provider=", md.get("provider"), "| ids=", {k: md.get(k) for k in ("jan","gtin","ean","upc","mpn","model","brand","asin") if md.get(k)})
          cj = load("cj_listings.json")
          for r in (cj.get("rows") or []):
              print("  cj", r.get("id"), "| pid=", r.get("supplier_product_id"), "| vid=", r.get("supplier_variant_id"), "| identity=", r.get("identity_method"), r.get("identity_status"), r.get("identity_confidence"),
                    "| verify=", r.get("verification_status"), "| inv=", r.get("inventory"), "inv_conf=", r.get("inventory_confirmed"), "| orderable=", r.get("orderable"),
                    "| cost=", r.get("cost"), r.get("currency"), "ship=", r.get("shipping_cost"), "| jan/gtin/mpn=", r.get("jan"), r.get("gtin"), r.get("mpn"), "| product_id=", r.get("product_id"), "| bestseller=", r.get("bestseller_id"))
          nd = load("newfind_discovery_public.json")
          prods = nd.get("products") or []
          print("newfind public discovery:", len(prods), "by source:", dict(collections.Counter((p.get("discoverySource") or p.get("discovery_source")) for p in prods)))
          tr = [p for p in prods if (p.get("discoverySource") or p.get("discovery_source")) == "tracer"]
          for p in tr[:10]:
              print("  nf-tracer", p.get("id"), p.get("status"), "|", p.get("productName") or p.get("product_name"), "| url=", p.get("productUrl") or p.get("product_url"), "| price=", p.get("price"), p.get("currency"))
          print("newfind receiver:", load("newfind_tracer_receiver.json"))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: readonly-probe
          path: probe/
          retention-days: 7
