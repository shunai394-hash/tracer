name: TRACER Vercel Production Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_yNR5X8H8XNJ253d4OoM1NePz
      VERCEL_PROJECT_ID: prj_b60X4VV7OQgOOZQxgzW28PCsy9me
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install -g vercel@58.1.0
      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build production
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy production
        run: vercel deploy --prebuilt --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
