name: TRACER Live Shopify Sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: tracer-live-shopify-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production deployment
        run: sleep 60
      - name: Sync published TRACER listings to Shopify
        shell: bash
        run: |
          set -euo pipefail
          token() {
            curl -sSf \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-self.vercel.app" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o "sync-$i.json" -w "%{http_code}" --max-time 120 \
              -H "Authorization: Bearer $(token)" \
              -H "Content-Type: application/json" \
              -X POST "https://tracer-self.vercel.app/api/admin/shopify/sync" \
              -d '{}')
            echo "pass $i: HTTP $code"
            cat "sync-$i.json"
            echo
            test "$code" -ge 200
            test "$code" -lt 300
          done
