name: TRACER Live Shopify Sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production deployment
        run: sleep 60
      - name: Sync published TRACER listings to Shopify
        uses: actions/github-script@v7
        with:
          script: |
            const results = [];
            for (let i = 0; i < 8; i++) {
              const token = await core.getIDToken('https://tracer-pied-alpha.vercel.app');
              const response = await fetch('https://tracer-pied-alpha.vercel.app/api/admin/shopify/sync', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${token}`,
                  'Content-Type': 'application/json',
                },
                body: '{}',
              });
              const text = await response.text();
              core.info(`pass ${i + 1}: HTTP ${response.status} ${text}`);
              results.push({ pass: i + 1, status: response.status, body: text });
              if (!response.ok) core.setFailed(`Shopify sync pass ${i + 1} failed: HTTP ${response.status}`);
            }
            core.info(JSON.stringify(results));
