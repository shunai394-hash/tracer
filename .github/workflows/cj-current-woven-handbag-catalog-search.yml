name: CJ current woven handbag catalog search

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cj-current-woven-handbag-catalog-search
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call read-only production catalog diagnostic
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          token="$(curl -sSf --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          code="$(curl -sS -o diagnostic.json -w "%{http_code}" --max-time 720 -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" "$BASE/api/internal/cj-current-woven-handbag-catalog-search" || true)"
          echo "=== read-only CJ catalog search HTTP $code ==="
          python3 - <<'PY'
          import json
          d = json.load(open("diagnostic.json"))
          print(json.dumps({
            "ok": d.get("ok"),
            "readOnly": d.get("readOnly"),
            "originalProductId": d.get("originalProductId"),
            "searches": d.get("searches"),
            "candidateCount": d.get("candidateCount"),
            "imageVariantCount": d.get("imageVariantCount"),
            "freightNote": d.get("freightNote"),
            "candidates": d.get("candidates"),
          }, ensure_ascii=False, indent=2))
          PY
          if [ "$code" != "200" ] && [ "$code" != "207" ]; then
            exit 1
          fi
          python3 -c 'import json,sys; d=json.load(open("diagnostic.json")); sys.exit(0 if d.get("readOnly") is True else 1)'
