name: CJ five-color Shopify migration
# Retry after correcting numeric price comparison and existing variant image repair.
# Run the exact five-color migration only after the production route is available.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cj-current-woven-handbag-catalog-search.yml
      - app/api/cron/commerce-cj-import/**
      - app/api/internal/shopify-five-color-family-migrate/**
      - lib/sources/cj/**
      - lib/shopify/admin.ts

permissions:
  contents: read
  id-token: write

concurrency:
  group: cj-five-color-shopify-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refresh exact CJ supplier data for the five-color family
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          token="$(curl -sSf --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          code="$(curl -sS -o import.json -w "%{http_code}" --max-time 720 -H "Authorization: Bearer $token" "$BASE/api/cron/commerce-cj-import?productIds=2606090341151608200&limit=1&variantLimit=6" || true)"
          echo "=== targeted CJ five-color family refresh HTTP $code ==="
          python3 - <<'PY'
          import json
          d = json.load(open("import.json"))
          print(json.dumps({
            "ok": d.get("ok"),
            "skipped": d.get("skipped"),
            "reason": d.get("reason"),
            "imported": d.get("imported"),
            "stats": d.get("stats"),
            "error": d.get("error"),
          }, ensure_ascii=False, indent=2))
          PY
          if [ "$code" != "200" ] && [ "$code" != "207" ] && [ "$code" != "202" ]; then
            exit 1
          fi

      - name: Consolidate the five verified colors into one published Shopify product
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          token="$(curl -sSf --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          ready=0
          for attempt in $(seq 1 30); do
            probe_code="$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "$BASE/api/internal/shopify-five-color-family-migrate" || true)"
            if [ "$probe_code" = "405" ]; then
              ready=1
              break
            fi
            echo "Waiting for the deployed Shopify migration route (HTTP $probe_code), attempt $attempt/30"
            sleep 10
          done
          if [ "$ready" -ne 1 ]; then
            echo "Shopify migration route did not become available"
            exit 1
          fi
          code="$(curl -sS -o family.json -w "%{http_code}" --max-time 720 -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" "$BASE/api/internal/shopify-five-color-family-migrate" || true)"
          echo "=== Shopify five-color family migration HTTP $code ==="
          python3 - <<'PY'
          import json,sys
          d = json.load(open("family.json"))
          print(json.dumps({
            "ok": d.get("ok"),
            "status": d.get("status"),
            "supplierProductId": d.get("supplierProductId"),
            "productId": d.get("productId"),
            "productUrl": d.get("productUrl"),
            "variantCount": d.get("variantCount"),
            "variants": d.get("variants"),
            "oldProductsUnpublished": d.get("oldProductsUnpublished"),
            "error": d.get("error"),
          }, ensure_ascii=False, indent=2))
          sys.exit(0 if d.get("ok") is True and d.get("status") == "PUBLISHED" and d.get("variantCount") == 5 else 1)
          PY
          if [ "$code" != "200" ]; then
            exit 1
          fi
