name: CJ color-family live refresh

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cj-current-woven-handbag-catalog-search.yml
      - app/api/cron/commerce-cj-import/**

permissions:
  contents: read
  id-token: write

concurrency:
  group: cj-color-family-live-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refresh one five-color handbag family from live CJ data
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          token="$(curl -sSf --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          code="$(curl -sS -o import.json -w "%{http_code}" --max-time 720 -H "Authorization: Bearer $token" "$BASE/api/cron/commerce-cj-import?productIds=2606090341151608200&limit=1&variantLimit=6" || true)"
          echo "=== targeted CJ five-color family refresh HTTP $code ==="
          python3 - <<'PY'
          import json
          d = json.load(open("import.json"))
          print(json.dumps({
            "ok": d.get("ok"),
            "skipped": d.get("skipped"),
            "reason": d.get("reason"),
            "imported": d.get("imported"),
            "stats": d.get("stats"),
            "error": d.get("error"),
          }, ensure_ascii=False, indent=2))
          PY
          if [ "$code" != "200" ] && [ "$code" != "207" ] && [ "$code" != "202" ]; then
            exit 1
          fi
