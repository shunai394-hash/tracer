name: TRACER BASE duplicate SKU cleanup

on:
  push:
    branches: [main]
    paths:
      - "app/api/channels/base/duplicate-cleanup/route.ts"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: tracer-base-duplicate-sku-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out commit history for deployment verification
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait until production serves this commit
        env:
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            response="$(curl --fail --silent --show-error --max-time 15 https://tracer-pied-alpha.vercel.app/api/health || true)"
            deployed_sha="$(printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);process.stdout.write(String(j.commitSha||j.commit||j.sha||""))}catch{}})')"
            if [ "$deployed_sha" = "$TARGET_SHA" ]; then
              echo "Production serves $TARGET_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Production did not report target SHA $TARGET_SHA; refusing BASE visibility changes."
          exit 1

      - name: Run guarded duplicate cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          const audience = "https://tracer-pied-alpha.vercel.app";
          const tokenUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          tokenUrl.searchParams.set("audience", audience);
          const tokenResponse = await fetch(tokenUrl, {
            headers: { Authorization: "Bearer " + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN },
          });
          if (!tokenResponse.ok) throw new Error("OIDC_TOKEN_REQUEST_FAILED:" + tokenResponse.status);
          const tokenBody = await tokenResponse.json();
          if (typeof tokenBody.value !== "string" || !tokenBody.value) throw new Error("OIDC_TOKEN_MISSING");
          const response = await fetch(audience + "/api/channels/base/duplicate-cleanup", {
            method: "POST",
            headers: { Authorization: "Bearer " + tokenBody.value, "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify({ apply: true, limit: 100 }),
            signal: AbortSignal.timeout(110000),
          });
          const result = await response.json().catch(() => ({}));
          await writeFile("base-duplicate-cleanup-result.json", JSON.stringify(result, null, 2), { mode: "0600" });
          console.log(JSON.stringify({
            httpStatus: response.status, ok: result.ok === true, snapshotComplete: result.snapshotComplete,
            duplicateSkuGroups: result.duplicateSkuGroups, duplicateHideCandidates: result.duplicateHideCandidates,
            duplicateHidden: result.duplicateHidden, duplicateHideFailed: result.duplicateHideFailed,
            deferredByLimit: result.deferredByLimit, sample: (result.results || []).slice(0, 10),
          }, null, 2));
          if (!response.ok || result.ok !== true || result.duplicateHideFailed > 0) throw new Error("BASE_DUPLICATE_CLEANUP_FAILED");
          NODE
          python3 - <<'PY' > base-duplicate-cleanup-summary.md
          import json
          d = json.load(open("base-duplicate-cleanup-result.json", encoding="utf-8"))
          print("# TRACER BASE duplicate SKU cleanup")
          print()
          print("Only exact duplicate TRC SKUs were considered. A duplicate was hidden only when one published canonical listing mapped to the other BASE item, titles/prices/stock matched exactly, and the duplicate item ID had no TRACER mapping. No BASE items were deleted.")
          print()
          print(json.dumps({k:d.get(k) for k in ["ok","snapshotComplete","scannedBaseItems","duplicateSkuGroups","duplicateHideCandidates","duplicateHidden","duplicateHideFailed","deferredByLimit","results"]}, ensure_ascii=False, indent=2))
          PY
          gh issue create --repo shunai394-hash/tracer --title "[TRACER BASE duplicate SKU cleanup] Run $GITHUB_RUN_ID" --body-file base-duplicate-cleanup-summary.md
