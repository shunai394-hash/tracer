name: TRACER BASE duplicate SKU cleanup

on:
  push:
    branches: [main]
    paths:
      - "app/api/channels/base/duplicate-cleanup/route.ts"
      - ".github/workflows/tracer-base-duplicate-cleanup.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Hide only verified duplicate BASE copies; default is read-only diagnostics"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: tracer-base-duplicate-sku-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out commit history for deployment verification
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait until production serves this commit
        env:
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            response="$(curl --fail --silent --show-error --max-time 15 https://tracer-pied-alpha.vercel.app/api/health || true)"
            deployed_sha="$(printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);process.stdout.write(String(j.gitCommitSha||j.commitSha||j.commit||j.sha||""))}catch{}})')"
            if [ "$deployed_sha" = "$TARGET_SHA" ]; then
              echo "Production serves $TARGET_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Production did not report target SHA $TARGET_SHA; refusing BASE visibility changes."
          exit 1

      - name: Diagnose duplicates and optionally apply guarded cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          const audience = "https://tracer-pied-alpha.vercel.app";
          const tokenUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          tokenUrl.searchParams.set("audience", audience);
          const tokenResponse = await fetch(tokenUrl, {
            headers: { Authorization: "Bearer " + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN },
          });
          if (!tokenResponse.ok) throw new Error("OIDC_TOKEN_REQUEST_FAILED:" + tokenResponse.status);
          const tokenBody = await tokenResponse.json();
          if (typeof tokenBody.value !== "string" || !tokenBody.value) throw new Error("OIDC_TOKEN_MISSING");
          const endpoint = audience + "/api/channels/base/duplicate-cleanup";
          const headers = { Authorization: "Bearer " + tokenBody.value, "Content-Type": "application/json", Accept: "application/json" };
          const preflightResponse = await fetch(endpoint, {
            method: "POST", headers, body: JSON.stringify({ apply: false, limit: 65 }), signal: AbortSignal.timeout(110000),
          });
          const preflight = await preflightResponse.json().catch(() => ({}));
          if (!preflightResponse.ok || preflight.ok !== true || preflight.duplicateHideCandidates > 65) {
            throw new Error("BASE_DUPLICATE_CLEANUP_PREFLIGHT_FAILED");
          }
          console.log(JSON.stringify({
            stage: "read-only preflight", httpStatus: preflightResponse.status,
            duplicateSkuGroups: preflight.duplicateSkuGroups, duplicateHideCandidates: preflight.duplicateHideCandidates,
            visibilityValueKinds: preflight.visibilityValueKinds, diagnosticSummary: preflight.diagnosticSummary, diagnostics: preflight.diagnostics,
          }, null, 2));
          const allowApply = process.env.ALLOW_APPLY === "true";
          let response = preflightResponse;
          let result = preflight;
          if (allowApply) {
            response = await fetch(endpoint, {
              method: "POST", headers, body: JSON.stringify({ apply: true, limit: 65 }), signal: AbortSignal.timeout(110000),
            });
            result = await response.json().catch(() => ({}));
          } else {
            console.log("Read-only diagnostics mode; no BASE item visibility or stock was changed.");
          }
          await writeFile("base-duplicate-cleanup-result.json", JSON.stringify(result, null, 2), { mode: "0600" });
          console.log(JSON.stringify({
            stage: allowApply ? "apply" : "read-only diagnostics", httpStatus: response.status, ok: result.ok === true, snapshotComplete: result.snapshotComplete,
            duplicateSkuGroups: result.duplicateSkuGroups, duplicateHideCandidates: result.duplicateHideCandidates,
            duplicateHidden: result.duplicateHidden, duplicateHideFailed: result.duplicateHideFailed,
            deferredByLimit: result.deferredByLimit, diagnosticSummary: result.diagnosticSummary, diagnostics: result.diagnostics,
            sample: (result.results || []).slice(0, 10),
          }, null, 2));
          if (!response.ok || result.ok !== true || result.duplicateHideFailed > 0 || result.deferredByLimit > 0 || result.duplicateHideCandidates > 65) {
            throw new Error("BASE_DUPLICATE_CLEANUP_FAILED");
          }
          NODE
          python3 - <<'PY' > base-duplicate-cleanup-summary.md
          import json
          d = json.load(open("base-duplicate-cleanup-result.json", encoding="utf-8"))
          print("# TRACER BASE duplicate SKU cleanup")
          print()
          print("Only exact duplicate TRC SKUs were considered. A duplicate was hidden only when exactly one published canonical listing mapped to the canonical BASE item, the canonical item was visible, and the duplicate item ID had no commerce or legacy mapping. Stale duplicate title/price/stock do not block hiding. No BASE items were deleted.")
          print()
          print(json.dumps({k:d.get(k) for k in ["ok","snapshotComplete","scannedBaseItems","duplicateSkuGroups","duplicateHideCandidates","duplicateHidden","duplicateHideFailed","deferredByLimit","visibilityValueKinds","diagnosticSummary","diagnostics","results"]}, ensure_ascii=False, indent=2))
          PY
          gh issue create --repo shunai394-hash/tracer --title "[TRACER BASE duplicate SKU cleanup] Run $GITHUB_RUN_ID" --body-file base-duplicate-cleanup-summary.md
