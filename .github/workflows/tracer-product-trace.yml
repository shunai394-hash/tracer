name: TRACER Product Trace

# Before/after trace of specific products through the formal pipeline:
# trace (read-only) -> optional formal intelligence cron -> trace again.
# The cron is the same /api/cron/intelligence Vercel runs daily; nothing here
# writes intelligence or publication state directly.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated product ids (max 20)"
        required: true
      run_supply_first:
        description: "Run /api/cron/supply-first (live CJ verification + intelligence, no publication)"
        type: boolean
        default: true
      run_intelligence:
        description: "Run /api/cron/intelligence between the two traces"
        type: boolean
        default: false
      run_sales_test_publication:
        description: "Run /api/cron/sales-test-publication (formal Sales Test Gate)"
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trace -> intelligence cron -> trace
        shell: bash
        env:
          IDS: ${{ inputs.ids }}
          RUN_INTELLIGENCE: ${{ inputs.run_intelligence }}
          RUN_SUPPLY_FIRST: ${{ inputs.run_supply_first }}
          RUN_SALES_TEST: ${{ inputs.run_sales_test_publication }}
        run: |
          set -uo pipefail
          BASE=https://tracer-naito3087.vercel.app
          token() {
            curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-self.vercel.app" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }
          cat > summarize.py <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          print("deployment:", d.get("deployment"), "| product_intelligence rows:", d.get("productIntelligenceRows"), "| readErrors:", d.get("readErrors"))
          for p in d.get("products") or []:
              pi = p.get("product_intelligence") or {}
              oi = p.get("opportunity_intelligence") or {}
              print("\n==", p["product_id"], "|", (p.get("product") or {}).get("canonical_name"))
              print("  product_intelligence:", bool(pi), "| sweep_rank:", p.get("sweep_rank"), "| selling_price_jpy:", (pi.get("metadata") or {}).get("selling_price_jpy"))
              print("  offers:", [(o.get("seller_name"), o.get("price"), o.get("currency")) for o in p.get("offers") or []])
              for l in p.get("supplier_listings") or []:
                  print("  supplier:", l.get("supplier"), l.get("supplier_product_id"), l.get("supplier_variant_id"), "| identity:", l.get("identity_method"), l.get("identity_status"), l.get("identity_confidence"),
                        "| verify:", l.get("verification_status"), "| inv:", l.get("inventory"), l.get("inventory_confirmed"), "| orderable:", l.get("orderable"), "| cost:", l.get("cost"), l.get("currency"), "ship:", l.get("shipping_cost"), "| tracking:", l.get("tracking_available"), "| next_verify:", l.get("next_verification_at"), "attempts:", l.get("verification_attempts"), "err:", l.get("verification_error"), "| listing_id:", l.get("id"))
              print("  demand_matches:", p.get("demand_matches"))
              print("  opportunity_intelligence:", {k: oi.get(k) for k in ("sellability_state", "lifecycle_status", "demand_score", "selection_eligible", "overall_confidence", "filter_state", "profit_state", "profit_calculable", "latest_test_status", "updated_at")} if oi else None)
              if oi: print("  oi.missing:", (oi.get("metadata") or {}).get("missing"))
              print("  sales_tests:", p.get("sales_tests"))
              for s in p.get("shop_listings") or []:
                  print("  shop_listing:", s.get("id"), "variant:", s.get("supplier_name"), s.get("supplier_product_id"), s.get("supplier_variant_id"), "sl:", s.get("supplier_listing_id"), "|", s.get("published"), s.get("pipeline_stage"), s.get("pipeline_reason"), "| gate_passed:", s.get("sales_test_gate_passed"), "| base:", s.get("base_item_id"))
              print("  newfind:", p.get("newfind"))
              print("  gate_dry_run:", p.get("gate_dry_run"))
          PY
          echo "=== TRACE BEFORE ==="
          curl -sS --max-time 60 -H "Authorization: Bearer $(token)" "$BASE/api/intelligence/product-trace?ids=$IDS" > before.json
          python3 summarize.py before.json || cat before.json
          if [ "$RUN_SUPPLY_FIRST" = "true" ]; then
            echo "=== FORMAL SUPPLY-FIRST CRON ==="
            curl -sS --max-time 300 -H "Authorization: Bearer $(token)" "$BASE/api/cron/supply-first" > supply.json
            python3 -c '
          import json
          d = json.load(open("supply.json"))
          s = d.get("supplyFirst") or {}
          print("ok:", d.get("ok"), "verified:", s.get("verified"), "rejected:", s.get("rejected"), "error:", d.get("error"))
          for i in s.get("items") or []:
              print("  item:", {k: i.get(k) for k in ("productId", "supplierVariantId", "rejectedStage", "sellingPriceJpy", "inventory", "freightUsd", "error") if i.get(k) is not None})
          print("opportunityIntelligence:", d.get("opportunityIntelligence"))
          print("publication:", d.get("publication"))
          ' || cat supply.json
          fi
          if [ "$RUN_INTELLIGENCE" = "true" ]; then
            echo "=== FORMAL INTELLIGENCE CRON ==="
            curl -sS --max-time 300 -H "Authorization: Bearer $(token)" "$BASE/api/cron/intelligence" > cron.json
            python3 -c '
          import json
          d = json.load(open("cron.json"))
          print("ok:", d.get("ok"), "complete:", d.get("complete"), "error:", d.get("error"))
          for s in d.get("steps") or []:
              r = s.get("result") if isinstance(s.get("result"), dict) else {}
              keep = {k: r.get(k) for k in ("skipped", "reason", "processed", "upserted", "testReady", "published", "considered", "productIds", "matched", "persisted") if k in r}
              print(" ", s.get("name"), "ok=" + str(s.get("ok")), keep, s.get("error") or "")
          ' || cat cron.json
          fi
          if [ "$RUN_SALES_TEST" = "true" ]; then
            echo "=== FORMAL SALES-TEST-PUBLICATION CRON ==="
            curl -sS --max-time 300 -H "Authorization: Bearer $(token)" "$BASE/api/cron/sales-test-publication" > sales.json
            python3 -c '
          import json
          d = json.load(open("sales.json"))
          s = d.get("supplySelected") or {}
          print("ok:", d.get("ok"), "mode:", d.get("mode"), "skipped:", d.get("skipped"), "reason:", d.get("reason"), "error:", d.get("error"))
          print("supply gate: considered", s.get("considered"), "published", s.get("published"), s.get("publishedListingIds"))
          print("downstream:", d.get("downstream"))
          ' || cat sales.json
          fi
          if [ "$RUN_SUPPLY_FIRST" = "true" ] || [ "$RUN_INTELLIGENCE" = "true" ] || [ "$RUN_SALES_TEST" = "true" ]; then
            echo "=== TRACE AFTER ==="
            curl -sS --max-time 60 -H "Authorization: Bearer $(token)" "$BASE/api/intelligence/product-trace?ids=$IDS" > after.json
            python3 summarize.py after.json || cat after.json
          fi
