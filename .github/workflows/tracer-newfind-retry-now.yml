name: TRACER Retry NEWFIND Queue Now

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: tracer-newfind-retry-now
  # A normal push that skips this job must not cancel an active bounded retry.
  cancel-in-progress: false

jobs:
  retry:
    # workflow_dispatch must run directly; push-triggered runs remain opt-in.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-newfind-retry-now]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for production deployment
        run: sleep 60
      - name: Reconcile BASE and Shopify, then drain NEWFIND retries
        shell: bash
        run: |
          set -uo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          failures=0
          token() {
            curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }
          call_get() {
            local path="$1" max_time="$2" out="$3"
            local t code
            t="$(token)" || { echo "::error::OIDC token failed for $path"; return 1; }
            code="$(curl -sS -o "$out" -w "%{http_code}" --max-time "$max_time" -H "Authorization: Bearer $t" "$BASE/$path")" || {
              echo "::error::Request failed for $path (HTTP ${code:-unknown})"
              return 1
            }
            echo "=== $path HTTP $code ==="
            python3 - "$code" "$out" <<'PY'
          import json,sys
          code=int(sys.argv[1]) if sys.argv[1].isdigit() else 0
          try:
              with open(sys.argv[2], encoding="utf-8") as f:
                  d=json.load(f)
          except Exception as e:
              print(f"Invalid JSON response: {e}")
              raise SystemExit(1)
          keys=("ok","success","phase","attempted","published","synced","failed","processed","stillFailing","rescue","error")
          print(json.dumps({k:d.get(k) for k in keys if k in d},ensure_ascii=False)[:2500])
          if not 200 <= code < 300:
              print(f"HTTP failure: {code}")
              raise SystemExit(1)
          if d.get("ok") is not True and d.get("success") is not True:
              print("API did not explicitly confirm success")
              raise SystemExit(1)
          if d.get("error"):
              print("API reported an error")
              raise SystemExit(1)
          PY
          }
          echo "=== Retry failed BASE publication without creating duplicate items ==="
          call_get api/cron/base-publish 65 base-publish.json || failures=1
          echo "=== Sync gate-passed listings to Shopify ==="
          call_get api/cron/shopify-publish 300 shopify-publish.json || failures=1
          echo "=== Drain NEWFIND deliveries and rescue gate-passed listings ==="
          for pass in $(seq 1 20); do
            echo "=== NEWFIND retry pass $pass/20 ==="
            call_get api/cron/newfind-retry 65 "newfind-retry-$pass.json" || failures=1
          done
          if [ -f newfind-retry-20.json ]; then
            python3 - newfind-retry-20.json <<'PY'
          import json,sys
          try:
              with open(sys.argv[1], encoding="utf-8") as f:
                  d=json.load(f)
          except Exception as e:
              raise SystemExit(f"Final NEWFIND retry response is not valid JSON: {e}")
          if "stillFailing" not in d:
              raise SystemExit("Final NEWFIND retry response lacks stillFailing; queue status cannot be verified")
          try:
              remaining=int(d["stillFailing"])
          except (TypeError, ValueError):
              raise SystemExit(f"Cannot verify remaining NEWFIND failures: {d.get('stillFailing')!r}")
          if remaining > 0:
              raise SystemExit(f"NEWFIND queue still has {remaining} failing deliveries after 20 passes")
          PY
            [ "$?" -eq 0 ] || failures=1
          else
            echo "::error::No final NEWFIND retry response was produced"
            failures=1
          fi
          if [ "$failures" -ne 0 ]; then
            echo "::error::One or more publishing/retry operations failed; workflow must not report success"
            exit 1
          fi
          echo "All endpoints explicitly confirmed success and NEWFIND reported no remaining failures."
