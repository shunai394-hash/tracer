name: TRACER BASE duplicate SKU highest-price alignment

on:
  push:
    branches: [main]
    paths:
      - "ops/run-base-duplicate-sku-highest-price-once.txt"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply highest-price alignment to exact duplicate TRC SKU groups"
        required: false
        type: boolean
        default: false
      limit:
        description: "Maximum item price updates in this run (1-25)"
        required: false
        type: number
        default: 10

permissions:
  contents: read
  id-token: write

concurrency:
  group: tracer-base-duplicate-sku-highest-price
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait until production serves this commit
        env:
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            response="$(curl --fail --silent --show-error --max-time 15 https://tracer-pied-alpha.vercel.app/api/health || true)"
            deployed_sha="$(printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);process.stdout.write(String(j.gitCommitSha||j.commitSha||j.commit||j.sha||""))}catch{}})')"
            if [ "$deployed_sha" = "$TARGET_SHA" ]; then echo "Production serves $TARGET_SHA"; exit 0; fi
            sleep 10
          done
          echo "Production does not serve target SHA; refusing BASE price updates."
          exit 1
      - name: Dry-run, optionally align prices, and verify readback
        env:
          APPLY: ${{ github.event_name == 'push' || inputs.apply }}
          LIMIT: ${{ github.event_name == 'push' && 25 || inputs.limit }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          const audience = "https://tracer-pied-alpha.vercel.app";
          const tokenUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          tokenUrl.searchParams.set("audience", audience);
          const tokenResponse = await fetch(tokenUrl, { headers: { Authorization: "Bearer " + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN } });
          if (!tokenResponse.ok) throw new Error("OIDC_TOKEN_REQUEST_FAILED:" + tokenResponse.status);
          const tokenBody = await tokenResponse.json();
          if (typeof tokenBody.value !== "string" || !tokenBody.value) throw new Error("OIDC_TOKEN_MISSING");
          const endpoint = audience + "/api/channels/base/duplicate-sku-price-alignment";
          const headers = { Authorization: "Bearer " + tokenBody.value, "Content-Type": "application/json", Accept: "application/json" };
          const limit = Math.max(1, Math.min(25, Math.floor(Number(process.env.LIMIT) || 10)));
          const post = async apply => {
            const response = await fetch(endpoint, { method: "POST", headers, body: JSON.stringify({ apply, limit }), signal: AbortSignal.timeout(110000) });
            const result = await response.json().catch(() => ({}));
            console.log(JSON.stringify({ status: response.status, ...result }, null, 2));
            if (!response.ok || result.ok !== true) throw new Error("BASE_PRICE_ALIGNMENT_FAILED:" + response.status);
            return result;
          };
          const dryRun = await post(false);
          if (dryRun.readOnly !== true || dryRun.snapshotComplete !== true) throw new Error("BASE_PRICE_ALIGNMENT_PREFLIGHT_FAILED");
          let result = dryRun;
          const batches = [];
          if (process.env.APPLY === "true") {
            let remaining = Number(dryRun.candidatePriceUpdates || 0);
            for (let batch = 1; batch <= 20 && remaining > 0; batch++) {
              const applied = await post(true);
              if (applied.failed > 0 || applied.ok !== true) throw new Error("BASE_PRICE_ALIGNMENT_BATCH_FAILED:" + batch);
              batches.push({ batch, selected: applied.selected, updatedAndVerified: applied.updatedAndVerified, failed: applied.failed, groups: applied.duplicateSkuGroups });
              const next = await post(false);
              if (next.readOnly !== true || next.snapshotComplete !== true) throw new Error("BASE_PRICE_ALIGNMENT_PREFLIGHT_FAILED_AFTER_BATCH");
              const nextCount = Number(next.candidatePriceUpdates || 0);
              if (nextCount >= remaining && applied.updatedAndVerified === 0) throw new Error("BASE_PRICE_ALIGNMENT_NO_PROGRESS");
              remaining = nextCount;
              result = next;
            }
            if (remaining > 0) throw new Error("BASE_PRICE_ALIGNMENT_BATCH_CAP_REACHED:" + remaining);
            result = { ok: true, apply: true, readOnly: false, batches, finalPreflight: result, totalUpdatedAndVerified: batches.reduce((n, b) => n + Number(b.updatedAndVerified || 0), 0) };
          }
          await writeFile("base-duplicate-sku-price-alignment.json", JSON.stringify(result, null, 2), { mode: "0600" });
          await writeFile(process.env.GITHUB_STEP_SUMMARY, ["# BASE duplicate SKU highest-price alignment", "", "Mode: " + (process.env.APPLY === "true" ? "apply" : "read-only"), "", "```json", JSON.stringify(result, null, 2), "```", ""].join("\n"));
          NODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-duplicate-sku-price-alignment-${{ github.run_id }}
          path: base-duplicate-sku-price-alignment.json
          if-no-files-found: ignore
          retention-days: 14
