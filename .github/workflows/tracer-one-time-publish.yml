name: TRACER one-time 3-site publication
on:
  push:
    branches: [main]
    paths:
      - "ops/publish-3-sites-20261015.txt"
permissions:
  contents: read
  id-token: write
concurrency:
  group: tracer-one-time-publish-20261015
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout marker
        uses: actions/checkout@v4
      - name: Publish eligible catalog to TRACER, BASE, Shopify and NEWFIND
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -f ops/publish-3-sites-20261015.txt ] || [ "$(cat ops/publish-3-sites-20261015.txt)" != "RUN" ]; then
            echo "One-time marker absent or inactive; no publication performed."
            exit 0
          fi
          BASE=https://tracer-pied-alpha.vercel.app
          get_token() {
            curl -sSf --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }
          call_route() {
            local name="$1" path="$2" max_time="$3" code
            local token
            token="$(get_token)" || { echo "$name auth_token_failed"; return 1; }
            code="$(curl -sS -o response.json -w "%{http_code}" --max-time "$max_time" \
              -H "Authorization: Bearer $token" -H "Cache-Control: no-store" "$BASE$path" || true)"
            python3 - "$name" "$code" <<'PY'
          import json,sys
          name,code=sys.argv[1],sys.argv[2]
          try:
              d=json.load(open("response.json"))
          except Exception:
              print(json.dumps({"route":name,"httpStatus":code,"body":"non-json or empty response"}))
              raise SystemExit(0)
          out={"route":name,"httpStatus":code,"ok":d.get("ok"),"phase":d.get("phase"),"elapsedMs":d.get("elapsedMs"),"error":d.get("error"),"reason":d.get("reason")}
          for key in ("supplyFirst","opportunityIntelligence","supplySelected","downstream","published","attempted","failed","synced","listingIds","baseReady"):
              if key in d:
                  value=d[key]
                  if isinstance(value,dict):
                      out[key]={k:value.get(k) for k in ("discovered","verified","eligibleCount","eligible","published","considered","failed","attempted","synced","rejectedCount","processed","testReady","newfindSent") if k in value}
                  elif isinstance(value,list):
                      out[key+"_count"]=len(value)
                  else:
                      out[key]=value
          print(json.dumps(out,ensure_ascii=False))
          PY
          }
          echo "=== supplier discovery ==="
          call_route supply-first /api/cron/supply-first 275
          echo "=== TRACER gate and 3-site delivery ==="
          call_route sales-test-publication /api/cron/sales-test-publication 275
          echo "=== BASE reconciliation ==="
          call_route base-publish /api/cron/base-publish 100
          echo "=== Shopify reconciliation ==="
          call_route shopify-publish /api/cron/shopify-publish 275
