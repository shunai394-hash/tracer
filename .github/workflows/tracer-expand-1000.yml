name: TRACER Expand Catalog to 1000

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: tracer-expand-1000
  cancel-in-progress: true

jobs:
  expand:
    if: contains(github.event.head_commit.message, '[expand-1000]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Expand verified CJ supply
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          token() {
            curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }
          sleep 60
          for pass in $(seq 1 8); do
            echo "=== SUPPLY EXPANSION $pass/8 ==="
            T="$(token)"
            curl -sSf --max-time 300 -H "Authorization: Bearer $T" "$BASE/api/cron/supply-first"
            sleep 5
          done
          T="$(token)"
          echo "=== FINAL SALES TEST PUBLICATION ==="
          curl -sSf --max-time 300 -H "Authorization: Bearer $T" "$BASE/api/cron/sales-test-publication"
