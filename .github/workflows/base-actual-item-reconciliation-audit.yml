name: BASE actual-item reconciliation audit
# The exported items.csv is the source evidence for targeted BASE item-ID checks.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/base-actual-item-reconciliation-audit.yml'
      - 'app/api/channels/base/reconciliation/route.ts'
      - 'lib/channels/base-actual-reconciliation.ts'
      - 'scripts/test-base-actual-reconciliation.mjs'

permissions:
  contents: read
  id-token: write

concurrency:
  group: base-actual-item-reconciliation-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out commit history for deployment verification
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait until production serves this commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          git fetch origin main --quiet
          for attempt in $(seq 1 36); do
            token="$(curl -sSf --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            sha="$(curl -sS --max-time 20 -H "Authorization: Bearer $token" "$BASE/api/intelligence/pipeline-audit" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("deployment") or {}).get("commitSha") or "")' || true)"
            echo "attempt $attempt/36: production commit=$sha expected=$GITHUB_SHA"
            if [ "$sha" = "$GITHUB_SHA" ]; then exit 0; fi
            if [ -n "$sha" ] && git cat-file -e "$sha^{commit}" 2>/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" "$sha"; then
              exit 0
            fi
            sleep 10
          done
          echo "Production is not at this commit or a descendant; refusing a stale BASE scan."
          exit 1

      - name: Reconcile the actual BASE /items snapshot against TRACER
        env:
          BASE_AUDIT_ORIGIN: https://tracer-pied-alpha.vercel.app
        run: |
          node <<'NODE'
          const fs = require("node:fs/promises");
          (async () => {
            const origin = process.env.BASE_AUDIT_ORIGIN;
            const oidcUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            oidcUrl.searchParams.set("audience", origin);
            const oidcResponse = await fetch(oidcUrl, {
              headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            });
            if (!oidcResponse.ok) throw new Error(`GitHub OIDC token request failed: HTTP ${oidcResponse.status}`);
            const { value: token } = await oidcResponse.json();
            if (!token) throw new Error("GitHub OIDC token was missing");

            let response = await fetch(new URL("/api/channels/base/reconciliation", origin), {
              headers: { Authorization: `Bearer ${token}`, Accept: "application/json" },
              cache: "no-store",
            });
            let body = await response.json();
            if (body.resumable === true && body.checkpoint && Array.isArray(body.priorItems)) {
              response = await fetch(new URL("/api/channels/base/reconciliation", origin), {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: "application/json",
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({ checkpoint: body.checkpoint, priorItems: body.priorItems }),
                cache: "no-store",
              });
              body = await response.json();
            }
            const report = {
              generatedAt: new Date().toISOString(),
              httpStatus: response.status,
              source: "BASE /items actual snapshot compared with TRACER channel_listings",
              apiReadComplete: body.apiReadComplete === true,
              apiErrors: Number(body.apiErrors ?? (response.ok && body.apiReadComplete === true ? 0 : 1)),
              itemCount: Number(body.itemCount ?? 0),
              pages: Number(body.pages ?? 0),
              dbListingCount: Number(body.dbListingCount ?? 0),
              mappedItems: Number(body.mappedItems ?? 0),
              exactIdMatches: Number(body.exactIdMatches ?? 0),
              exactSkuMatches: Number(body.exactSkuMatches ?? 0),
              unmappedItems: Number(body.unmappedItems ?? 0),
              ambiguousItems: Number(body.ambiguousItems ?? 0),
              missingSku: Number(body.missingSku ?? 0),
              unknownVisibility: Number(body.unknownVisibility ?? 0),
              unreadablePrices: Number(body.unreadablePrices ?? 0),
              priceMismatches: Number(body.priceMismatches ?? 0),
              skuMismatches: Number(body.skuMismatches ?? 0),
              publicationMismatches: Number(body.publicationMismatches ?? 0),
              auditRowsWritten: Number(body.auditRowsWritten ?? 0),
              auditStorage: body.auditStorage ?? null,
              auditWriteErrorCode: body.auditWriteErrorCode ?? null,
              auditWriteError: body.auditWriteError ?? null,
              auditFailedItemIds: Array.isArray(body.auditFailedItemIds) ? body.auditFailedItemIds : [],
              runId: body.runId ?? null,
              ok: body.ok === true,
              evidenceComplete: body.evidenceComplete === true,
              error: body.error ?? body.auditWriteError ?? null,
            };
            const out = "base-actual-item-reconciliation-artifacts";
            await fs.mkdir(out, { recursive: true });
            const items = Array.isArray(body.items) ? body.items : [];
            report.itemRowsExported = items.length;
            await fs.writeFile(`${out}/report.json`, JSON.stringify(report, null, 2) + "\n");
            await fs.writeFile(`${out}/items.json`, JSON.stringify(items, null, 2) + "\n");
            const itemColumns = [
              "baseItemId", "title", "baseIdentifier", "basePrice", "tracerVariantId",
              "tracerSku", "tracerPrice", "baseVisibility", "dbStatus", "existingExternalProductId",
              "mappingStatus", "mappingMethod", "candidateCount", "candidateListingIds",
              "priceMatches", "skuMatches", "publicationMatches", "discrepancyReasons",
            ];
            const itemCell = (value) => {
              const s = value == null ? "" : Array.isArray(value) ? value.join("|") : String(value);
              return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
            };
            const itemCsv = (rows) => [
              itemColumns.join(","),
              ...rows.map((item) => itemColumns.map((key) => itemCell(item[key])).join(",")),
            ].join("\n") + "\n";
            await fs.writeFile(`${out}/items.csv`, itemCsv(items));
            await fs.writeFile(`${out}/certain-matches.csv`, itemCsv(items.filter((item) =>
              item.mappingStatus === "matched" && ["base_item_id", "exact_sku"].includes(item.mappingMethod)
            )));
            await fs.writeFile(`${out}/ambiguous.csv`, itemCsv(items.filter((item) => item.mappingStatus === "ambiguous")));
            await fs.writeFile(`${out}/unmapped.csv`, itemCsv(items.filter((item) => item.mappingStatus === "unmapped")));
            const columns = Object.keys(report);
            const cell = (value) => {
              const s = value == null ? "" : String(value);
              return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
            };
            await fs.writeFile(`${out}/summary.csv`,
              [columns.join(","), columns.map((key) => cell(report[key])).join(",")].join("\n") + "\n");
            const summary = [
              "# BASE actual-item reconciliation audit", "",
              `- Actual BASE items scanned: **${report.itemCount}**`,
              `- API scan complete: **${report.apiReadComplete}** (${report.pages} pages)`,
              `- TRACER BASE listing rows: **${report.dbListingCount}**`,
              `- Mapped / unmapped / ambiguous: **${report.mappedItems} / ${report.unmappedItems} / ${report.ambiguousItems}**`,
              `- Exact ID / exact SKU matches: **${report.exactIdMatches} / ${report.exactSkuMatches}**`,
              `- Item-level rows exported: **${report.itemRowsExported}**`,
              `- Missing SKU / API errors: **${report.missingSku} / ${report.apiErrors}**`,
              `- Price mismatches: **${report.priceMismatches}**`,
              `- SKU mismatches: **${report.skuMismatches}**`,
              `- Publication mismatches: **${report.publicationMismatches}**`,
              `- Unknown visibility / unreadable prices: **${report.unknownVisibility} / ${report.unreadablePrices}**`,
              `- Audit rows persisted: **${report.auditRowsWritten}** in ${report.auditStorage ?? "unknown"}`,
              `- Audit write error: ${report.auditWriteErrorCode ?? "none"} ${report.auditWriteError ?? ""}`,
              `- Run ID: ${report.runId ?? "not returned"}`, "",
              "Summary JSON/CSV plus item-level JSON/CSV and separate certain-match, ambiguous, and unmapped CSVs are attached as artifact `base-actual-item-reconciliation-audit`.", ""
            ].join("\n");
            await fs.appendFile(process.env.GITHUB_STEP_SUMMARY, summary);
            console.log(JSON.stringify(report, null, 2));
            if (response.status !== 200 || !report.apiReadComplete || report.apiErrors !== 0 || report.itemCount < 1 || report.itemCount !== report.auditRowsWritten || report.itemCount !== report.itemRowsExported || report.evidenceComplete !== true) {
              throw new Error("BASE reconciliation did not persist one audit row for every fetched item");
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-actual-item-reconciliation-audit
          path: base-actual-item-reconciliation-artifacts/
          if-no-files-found: warn
          retention-days: 30
