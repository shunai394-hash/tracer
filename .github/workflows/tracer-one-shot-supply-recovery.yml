name: Deprecated one-shot supply recovery

# TRACER_CLEAN_COMMERCE_RECOVERY: retire the duplicate push-triggered workflow.
# All bounded production recovery must run through tracer-clean-commerce-recovery.yml.
# This workflow is intentionally inert to prevent duplicate supplier imports or order tests.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: echo "This workflow is retired. Use tracer-clean-commerce-recovery.yml."
