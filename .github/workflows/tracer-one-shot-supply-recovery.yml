name: Clean commerce recovery
# TRACER_CLEAN_COMMERCE_RECOVERY: execute bounded production reconciliation and order-pipeline check

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  recover:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'TRACER_ONE_SHOT_SUPPLY_RECOVERY'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository history for deployment SHA verification
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for production to serve this exact commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          ready=0
          for attempt in $(seq 1 36); do
            code="$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 10 "$BASE/api/health" || true)"
            sha="$(python3 -c 'import json; d=json.load(open("/tmp/health.json")); print(d.get("gitCommitSha") or "")' 2>/dev/null || true)"
            if [[ "$code" == "200" && "$sha" == "$GITHUB_SHA" ]]; then
              echo "Production is serving expected commit $GITHUB_SHA."
              ready=1
              break
            fi
            if [[ "$code" == "200" && -n "$sha" ]]; then
              git fetch --no-tags origin main
              if git cat-file -e "$sha^{commit}" 2>/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" "$sha"; then
                echo "Production is serving descendant commit $sha, which includes $GITHUB_SHA."
                ready=1
                break
              fi
            fi
            echo "Waiting for deployment: HTTP=$code sha=$sha attempt=$attempt/36"
            sleep 10
          done
          [[ "$ready" == "1" ]] || { echo "Production did not serve this commit within 6 minutes."; exit 1; }

      - name: Run bounded clean commerce recovery
        shell: bash
        run: |
          set -uo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          token() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }
          wait_for_deployment() {
            for attempt in $(seq 1 20); do
              t="$(token)" || { sleep 15; continue; }
              code="$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 10 \
                -H "Authorization: Bearer $t" "$BASE/api/health" || true)"
              if [ "$code" = "200" ] && grep -q "$GITHUB_SHA" /tmp/health.json; then
                echo "Production is serving $GITHUB_SHA"
                return 0
              fi
              echo "Waiting for production deployment $GITHUB_SHA (attempt $attempt, HTTP $code)"
              sleep 15
            done
            echo "Production did not serve $GITHUB_SHA; skip recovery to avoid acting on an older deployment"
            return 1
          }

          call_get() {
            local path="$1" max_time="$2" t code
            t="$(token)" || { echo "OIDC token failed for $path"; return 1; }
            code="$(curl -sS -o /tmp/response.json -w "%{http_code}" --max-time "$max_time" \
              -H "Authorization: Bearer $t" "$BASE/$path" || true)"
            echo "=== $path HTTP $code ==="
            python3 - <<'PY'
          import json
          try:
              d=json.load(open("/tmp/response.json"))
              print(json.dumps(d,ensure_ascii=False)[:5000])
          except Exception:
              print(open("/tmp/response.json").read()[:1000])
          PY
          }
          call_post() {
            local path="$1" payload="$2" max_time="$3" t code
            t="$(token)" || { echo "OIDC token failed for $path"; return 1; }
            code="$(curl -sS -o /tmp/response.json -w "%{http_code}" --max-time "$max_time" -X POST \
              -H "Authorization: Bearer $t" -H "Content-Type: application/json" \
              --data "$payload" "$BASE/$path" || true)"
            echo "=== $path HTTP $code ==="
            python3 - <<'PY'
import json
try:
    d=json.load(open("/tmp/response.json"))
    print(json.dumps(d,ensure_ascii=False)[:5000])
except Exception:
    print(open("/tmp/response.json").read()[:1000])
PY
          }

          wait_for_deployment || exit 0
          call_post "api/cron/cj-sandbox-order-test" '{"supplierListingId":"d970c5d9-0662-4894-bfe6-4e377819666d"}' 300 || true
          call_get "api/cron/commerce-cj-import?q=women%20handbag&limit=3" 300 || true
          call_get "api/cron/commerce-publish-base?limit=3" 120 || true
          call_get "api/cron/commerce-publish-shopify?limit=3" 120 || true
          call_get "api/cron/commerce-base-orders" 120 || true
          call_get "api/cron/commerce-procurement" 300 || true
