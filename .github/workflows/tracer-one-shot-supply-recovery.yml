name: Clean commerce recovery

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  recover:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'TRACER_CLEAN_COMMERCE_RECOVERY'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Run bounded clean commerce recovery
        shell: bash
        run: |
          set -uo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          token() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }
          call_get() {
            local path="$1" max_time="$2" t code
            t="$(token)" || { echo "OIDC token failed for $path"; return 1; }
            code="$(curl -sS -o /tmp/response.json -w "%{http_code}" --max-time "$max_time" \
              -H "Authorization: Bearer $t" "$BASE/$path" || true)"
            echo "=== $path HTTP $code ==="
            python3 - <<'PY'
          import json
          try:
              d=json.load(open("/tmp/response.json"))
              print(json.dumps(d,ensure_ascii=False)[:5000])
          except Exception:
              print(open("/tmp/response.json").read()[:1000])
          PY
          }
          call_get "api/cron/commerce-cj-import?q=women%20handbag&limit=3" 300 || true
          call_get "api/cron/commerce-publish-base?limit=3" 120 || true
          call_get "api/cron/commerce-publish-shopify?limit=3" 120 || true
          call_get "api/cron/commerce-base-orders" 120 || true
          call_get "api/cron/commerce-procurement" 300 || true
