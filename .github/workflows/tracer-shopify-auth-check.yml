name: TRACER Shopify Auth Check

# Diagnoses Shopify Admin API authentication and scopes, reconciles Shopify
# against shop_listings and previews the next sync (all read-only). Only when
# sync_batch > 0 does it write: the first N gate-eligible listings from the dry
# run plus every blocked listing still linked to a Shopify product (so it is
# unpublished), by explicit listing id, never a blind bulk sync. Never prints
# credential values.
on:
  workflow_dispatch:
    inputs:
      sync_batch:
        description: "Gate-eligible listings to sync after the read-only checks (0 = read-only). Linked blocked listings are always included for unpublish."
        type: number
        default: 0

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Auth check, readiness and catalog (read-only)
        shell: bash
        run: |
          set -uo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          token() {
            curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }
          SYNC_BATCH="${{ inputs.sync_batch }}"
          for path in api/admin/shopify/auth-check api/admin/shopify/readiness api/admin/shopify/catalog api/admin/shopify/reconcile; do
            code=$(curl -sS -o out.json -w "%{http_code}" --max-time 60 -H "Authorization: Bearer $(token)" "$BASE/$path" || echo 000)
            echo "=== $path HTTP $code ==="
            python3 - "$path" <<'PY'
          import json, sys
          path = sys.argv[1]
          try:
              d = json.load(open("out.json"))
          except Exception as e:
              print("non-JSON response:", open("out.json").read()[:500]); raise SystemExit(0)
          if path.endswith("catalog"):
              d.pop("products", None)
          print(json.dumps(d, ensure_ascii=False, indent=1)[:6000])
          PY
          done
          summarize_sync() {
            python3 - <<'PY'
          import json
          d = json.load(open("sync.json"))
          rows = d.pop("rows", None)
          print(json.dumps({k: v for k, v in d.items() if k not in ("listingIds",)}, ensure_ascii=False, indent=1)[:4000])
          if rows is not None:
              elig = [r for r in rows if r.get("eligible")]
              print("eligible sample:", json.dumps(elig[:5], ensure_ascii=False))
              print("blocked sample:", json.dumps([r for r in rows if not r.get("eligible")][:5], ensure_ascii=False))
          PY
          }
          echo "=== sync dry run (no writes) ==="
          curl -sS -o sync.json --max-time 120 -H "Authorization: Bearer $(token)" -H "Content-Type: application/json" -X POST "$BASE/api/admin/shopify/sync" -d '{"dryRun":true,"limit":1000}'
          summarize_sync
          if [ "${SYNC_BATCH%.*}" -gt 0 ] 2>/dev/null; then
            python3 - "${SYNC_BATCH%.*}" <<'PY' > ids.json
          import json, sys
          n = int(sys.argv[1])
          rows = json.load(open("sync.json")).get("rows") or []
          eligible = [r["listingId"] for r in rows if r.get("eligible")][:n]
          stale = [r["listingId"] for r in rows if not r.get("eligible") and r.get("shopifyProductId")]
          ids = (stale + eligible)[:100]
          print(json.dumps({"listingIds": ids}))
          sys.stderr.write(f"batch: eligible={len(eligible)} blocked_linked={len(stale)} sent={len(ids)}\n")
          PY
            echo "=== gated sync by listing id (writes) ==="
            curl -sS -o sync.json --max-time 130 -H "Authorization: Bearer $(token)" -H "Content-Type: application/json" -X POST "$BASE/api/admin/shopify/sync" -d @ids.json
            python3 -c 'import json; d=json.load(open("sync.json")); f=d.get("failed") or []; print(json.dumps({"ok": d.get("ok"), "attempted": d.get("attempted"), "synced": d.get("synced"), "failedCount": len(f), "error": d.get("error")}, indent=1)); import collections; print("failure kinds:", dict(collections.Counter(x["error"][:80] for x in f))); print("failed sample:", json.dumps(f[:5], ensure_ascii=False))'
            echo "=== reconcile after sync ==="
            curl -sS -o out.json --max-time 60 -H "Authorization: Bearer $(token)" "$BASE/api/admin/shopify/reconcile"
            python3 -c 'import json; d=json.load(open("out.json")); print(json.dumps({k: d.get(k) for k in ("ok","shopify","db","error")}, ensure_ascii=False, indent=1)); print(json.dumps(d.get("samples",{}).get("mismatches",[])[:3], ensure_ascii=False))'
          fi
