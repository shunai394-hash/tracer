name: TRACER Shopify Auth Check

# Re-run auth/catalog audit after bounded commerce recovery. All automatic triggers
# (push and workflow_run) are strictly read-only. Writes are available only through
# workflow_dispatch with explicit inputs; Shopify sync is always scoped to audited listing IDs.
# Never prints credential values.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tracer-shopify-auth-check.yml"
      - "app/api/admin/shopify/identity-audit/route.ts"
      - "app/api/admin/shopify/reconcile/route.ts"
      - "app/api/admin/shopify/auth-check/route.ts"
      - "app/api/admin/shopify/unit-cost/apply/route.ts"
      - "scripts/commerce-core.test.mjs"
      - "app/api/channels/base/diagnostics/route.ts"
      - "lib/config/env.ts"
      - "lib/channels/base.ts"
      - "lib/channels/base-orders.ts"
      - "lib/shopify/admin.ts"
      - "lib/intelligence/persist-cj-supply-intelligence.ts"
      - "lib/market/select-supply-sales-tests.ts"
      - "lib/catalog/canonical-supplier-identity.ts"
      - "lib/suppliers/discover-cj-supply.ts"
      - "lib/shopify/sync-orders.ts"
      - "app/api/cron/shopify-orders/route.ts"
      - "app/api/cron/sales-test-publication/route.ts"
      - "lib/market/select-supply-sales-tests.ts"
      - "scripts/test-cj-native-supply-identity-gate.mjs"
      - "lib/intelligence/womens-priority.ts"
      - "lib/intelligence/japanese-product.ts"
      - "lib/catalog/publishable-title.ts"
      - "scripts/test-publishable-title.mjs"
  # Refresh the read-only catalog/ID/SKU/price/inventory audit after supplier-first
  # recovery completes. sync_batch defaults to 0, so this trigger never writes listings.
  workflow_run:
    workflows:
      - "TRACER Run Supplier-First Recovery"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      sync_batch:
        description: "Gate-eligible listings to sync after the read-only checks (0 = read-only). Linked blocked listings are always included for unpublish."
        type: number
        default: 0
      apply_exact_base_links:
        description: "1 writes missing BASE IDs only when the TRC SKU or listing UUID is unique. 0 is a preview."
        type: number
        default: 0
      apply_stale_base_id_rebind:
        description: "1 may rebind a BASE channel ID only when its prior ID is absent from a complete BASE snapshot and exact unique TRC SKU evidence identifies the replacement. 0 is a preview."
        type: number
        default: 0

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout commit history for deployment ancestry check
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for the production deployment of this commit
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          git fetch origin main --quiet
          for i in $(seq 1 20); do
            token="$(curl -sSf --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            sha="$(curl -sS --max-time 20 -H "Authorization: Bearer $token" "$BASE/api/intelligence/pipeline-audit" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("deployment") or {}).get("commitSha") or "")' || true)"
            echo "attempt $i: production commit=$sha expected-or-ancestor=$GITHUB_SHA"
            if [ "$sha" = "$GITHUB_SHA" ]; then exit 0; fi
            if [ -n "$sha" ] && git cat-file -e "$sha^{commit}" 2>/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" "$sha"; then
              echo "Production commit $sha contains the diagnostic-trigger commit; proceeding read-only."
              exit 0
            fi
            sleep 15
          done
          echo "Production is not at this commit or a descendant of it; refusing to run diagnostics."
          exit 1
      - name: Auth check, readiness and catalog (read-only)
        shell: bash
        run: |
          set -uo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          token() {
            curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }
          # Automatic triggers are read-only; exact BASE identity repair is opt-in via workflow_dispatch.
          SYNC_BATCH="${{ inputs.sync_batch || 0 }}"
          for path in api/admin/shopify/auth-check api/admin/shopify/readiness api/admin/shopify/catalog api/admin/shopify/reconcile api/admin/shopify/identity-audit api/channels/base/diagnostics; do
            code=$(curl -sS -o out.json -w "%{http_code}" --max-time 60 -H "Authorization: Bearer $(token)" "$BASE/$path" || echo 000)
            echo "=== $path HTTP $code ==="
            python3 - "$path" <<'PY'
          import json, sys
          path = sys.argv[1]
          try:
              d = json.load(open("out.json"))
          except Exception as e:
              print("non-JSON response:", open("out.json").read()[:500]); raise SystemExit(0)
          if path.endswith("catalog"):
              d.pop("products", None)
          print(json.dumps(d, ensure_ascii=False, indent=1)[:6000])
          PY
            if [ "$path" = "api/admin/shopify/auth-check" ]; then cp out.json auth-check.json; fi
            if [ "$path" = "api/admin/shopify/catalog" ]; then cp out.json shopify-catalog.json; fi
            if [ "$path" = "api/admin/shopify/reconcile" ]; then cp out.json shopify-reconcile.json; fi
            if [ "$path" = "api/admin/shopify/identity-audit" ]; then cp out.json identity-audit.json; fi
            if [ "$path" = "api/channels/base/diagnostics" ]; then cp out.json base-diagnostics.json; fi
          done
          echo "=== exact supplier-link repair preview (read-only) ==="
          repair_code=$(curl -sS -o identity-repair.json -w "%{http_code}" --max-time 60 -H "Authorization: Bearer $(token)" -H "Content-Type: application/json" -X POST "$BASE/api/admin/shopify/identity-repair" -d '{"apply":false,"limit":1000}' || echo 000)
          echo "=== api/admin/shopify/identity-repair dry-run HTTP $repair_code ==="
          python3 - <<'PY'
          import json
          try:
              d = json.load(open("identity-repair.json"))
          except Exception:
              print("non-JSON response:", open("identity-repair.json").read()[:500])
              raise SystemExit(0)
          print(json.dumps({k: v for k, v in d.items() if k != "results"}, ensure_ascii=False, indent=1))
          rows = d.get("results") or []
          print("repairable samples:", json.dumps([r for r in rows if r.get("outcome") == "repairable_dry_run"][:10], ensure_ascii=False))
          print("blocked samples:", json.dumps([r for r in rows if r.get("outcome") not in ("repairable_dry_run",)][:10], ensure_ascii=False))
          PY
          echo "=== exact BASE identifier repair (automatic triggers read-only; explicit manual opt-in only) ==="
          BASE_APPLY=false
          BASE_STALE_REBIND=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.apply_exact_base_links || 0 }}" = "1" ]; then BASE_APPLY=true; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.apply_stale_base_id_rebind || 0 }}" = "1" ]; then BASE_APPLY=true; BASE_STALE_REBIND=true; fi
          base_repair_code=$(curl -sS -o base-identity-repair.json -w "%{http_code}" --max-time 120 -H "Authorization: Bearer $(token)" -H "Content-Type: application/json" -X POST "$BASE/api/channels/base/identity-repair" -d "{\"apply\":$BASE_APPLY,\"repairStaleExternalIds\":$BASE_STALE_REBIND,\"limit\":1000}" || echo 000)
          echo "=== api/channels/base/identity-repair HTTP $base_repair_code ==="
          python3 - <<'PY'
          import json
          try:
              d = json.load(open("base-identity-repair.json"))
          except Exception:
              print("non-JSON response:", open("base-identity-repair.json").read()[:500])
              raise SystemExit(0)
          print(json.dumps({k: v for k, v in d.items() if k != "results"}, ensure_ascii=False, indent=1))
          print("candidate samples:", json.dumps((d.get("results") or [])[:10], ensure_ascii=False))
          PY
          echo "=== CJ-native supply publication dry-run (no writes) ==="
          supply_dry_run_code=$(curl -sS -o supply-dry-run.json -w "%{http_code}" --max-time 90 -H "Authorization: Bearer $(token)" "$BASE/api/cron/sales-test-publication?dryRun=true&limit=450" || true)
          if [ -z "$supply_dry_run_code" ]; then supply_dry_run_code=000; fi
          echo "=== api/cron/sales-test-publication?dryRun=true HTTP $supply_dry_run_code ==="
          python3 - <<'PY'
          import collections, json, os
          if not os.path.exists("supply-dry-run.json"):
              print(json.dumps({"ok": False, "dryRun": True, "noWrites": True, "error": "request_timeout_or_no_response"}, indent=1))
              raise SystemExit(0)
          try:
              d = json.load(open("supply-dry-run.json"))
          except Exception:
              print("non-JSON response:", open("supply-dry-run.json").read()[:500])
              raise SystemExit(0)
          s = d.get("supplySelected") or {}
          rejected = s.get("rejected") or []
          counts = collections.Counter(reason for row in rejected for reason in (row.get("reasons") or []))
          print(json.dumps({
              "ok": d.get("ok"),
              "dryRun": d.get("dryRun"),
              "noWrites": d.get("noWrites"),
              "featureEnabledForLiveRuns": d.get("featureEnabledForLiveRuns"),
              "considered": s.get("considered"),
              "eligibleProductCount": len(s.get("eligibleProductIds") or []),
              "rejectedCount": len(rejected),
              "topRejectionReasons": dict(counts.most_common(12)),
              "eligibleSamples": (s.get("eligibleSamples") or [])[:10],
              "rejectedSample": rejected[:25],
          }, ensure_ascii=False, indent=1))
          PY
          summarize_sync() {
            python3 - <<'PY'
          import json
          d = json.load(open("sync.json"))
          rows = d.pop("rows", None)
          print(json.dumps({k: v for k, v in d.items() if k not in ("listingIds",)}, ensure_ascii=False, indent=1)[:4000])
          if rows is not None:
              elig = [r for r in rows if r.get("eligible")]
              print("eligible sample:", json.dumps(elig[:5], ensure_ascii=False))
              print("blocked sample:", json.dumps([r for r in rows if not r.get("eligible")][:5], ensure_ascii=False))
          PY
          }
          echo "=== sync dry run (no writes) ==="
          curl -sS -o sync.json --max-time 120 -H "Authorization: Bearer $(token)" -H "Content-Type: application/json" -X POST "$BASE/api/admin/shopify/sync" -d '{"dryRun":true,"limit":1000}'
          summarize_sync
          cp sync.json shopify-sync-dry-run.json
          if [ "${SYNC_BATCH%.*}" -gt 0 ] 2>/dev/null; then
            python3 - "${SYNC_BATCH%.*}" <<'PY' > ids.json
          import json, sys
          n = int(sys.argv[1])
          rows = json.load(open("sync.json")).get("rows") or []
          eligible = [r["listingId"] for r in rows if r.get("eligible")][:n]
          stale = [r["listingId"] for r in rows if not r.get("eligible") and r.get("shopifyProductId")]
          ids = (stale + eligible)[:100]
          print(json.dumps({"listingIds": ids}))
          sys.stderr.write(f"batch: eligible={len(eligible)} blocked_linked={len(stale)} sent={len(ids)}\n")
          PY
            echo "=== gated sync by listing id (writes) ==="
            curl -sS -o sync.json --max-time 130 -H "Authorization: Bearer $(token)" -H "Content-Type: application/json" -X POST "$BASE/api/admin/shopify/sync" -d @ids.json
            python3 -c 'import json; d=json.load(open("sync.json")); f=d.get("failed") or []; print(json.dumps({"ok": d.get("ok"), "attempted": d.get("attempted"), "synced": d.get("synced"), "failedCount": len(f), "error": d.get("error")}, indent=1)); import collections; print("failure kinds:", dict(collections.Counter(x["error"][:80] for x in f))); print("failed sample:", json.dumps(f[:5], ensure_ascii=False))'
            echo "=== reconcile after sync ==="
            curl -sS -o out.json --max-time 60 -H "Authorization: Bearer $(token)" "$BASE/api/admin/shopify/reconcile"
            python3 -c 'import json; d=json.load(open("out.json")); print(json.dumps({k: d.get(k) for k in ("ok","shopify","db","error")}, ensure_ascii=False, indent=1)); print(json.dumps(d.get("samples",{}).get("mismatches",[])[:3], ensure_ascii=False))'
          fi

      - name: Publish sanitized read-only auth result for review
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > auth-report.md
          import collections, json, os
          shopify = json.load(open("auth-check.json"))
          shopify.pop("db", None)
          base = json.load(open("base-diagnostics.json"))
          identity_audit = json.load(open("identity-audit.json"))
          # The API returns up to 1,000 row-level readiness records. Keep the
          # audit aggregates and a small reason-only sample so the GitHub Issue
          # stays below GitHub's 65,536-character body limit.
          readiness = identity_audit.get("nativeCjPublicationReadiness") or {}
          readiness_rows = readiness.pop("rows", []) or []
          eligible_rows = [row for row in readiness_rows if row.get("eligible") is True]
          blocked_rows = [row for row in readiness_rows if row.get("eligible") is not True]
          readiness["rowsReturned"] = len(readiness_rows)
          readiness["sampleRows"] = [
              {"eligible": row.get("eligible"), "identityStatus": row.get("identityStatus"), "blockReasons": (row.get("blockReasons") or [])[:12]}
              for row in eligible_rows[:3] + blocked_rows[:10]
          ]
          identity_audit["nativeCjPublicationReadiness"] = readiness
          base_identity_repair = {"ok": False, "readOnly": True, "error": "request_timeout_or_no_response"}
          if os.path.exists("base-identity-repair.json"):
              try:
                  raw_repair = json.load(open("base-identity-repair.json"))
                  repair_rows = raw_repair.pop("results", []) or []
                  base_identity_repair = raw_repair
                  base_identity_repair["outcomeCounts"] = dict(collections.Counter(str(row.get("outcome", "unknown")) for row in repair_rows))
                  base_identity_repair["sourceCounts"] = dict(collections.Counter(source for row in repair_rows for source in (row.get("source") or [])))
              except Exception:
                  base_identity_repair = {"ok": False, "readOnly": True, "error": "invalid_identity_repair_response"}
          supply_dry_run = {"ok": False, "dryRun": True, "noWrites": True, "error": "request_timeout_or_no_response"}
          if os.path.exists("supply-dry-run.json"):
              try:
                  raw = json.load(open("supply-dry-run.json"))
                  selected = raw.get("supplySelected") or {}
                  rejected = selected.get("rejected") or []
                  reasons = collections.Counter(reason for row in rejected for reason in (row.get("reasons") or []))
                  supply_dry_run = {
                      "ok": raw.get("ok"),
                      "dryRun": raw.get("dryRun"),
                      "noWrites": raw.get("noWrites"),
                      "featureEnabledForLiveRuns": raw.get("featureEnabledForLiveRuns"),
                      "considered": selected.get("considered"),
                      "eligibleProductCount": len(selected.get("eligibleProductIds") or []),
                      "rejectedCount": selected.get("rejectedCount", len(rejected)),
                      "topRejectionReasons": selected.get("rejectionCounts") or dict(reasons.most_common(12)),
                      "eligibleSamples": (selected.get("eligibleSamples") or [])[:10],
                      "rejectedSamples": rejected[:25],
                  }
              except Exception:
                  supply_dry_run = {"ok": False, "dryRun": True, "noWrites": True, "error": "invalid_dry_run_response"}
          print("# TRACER Shopify read-only authentication result")
          print()
          print("Generated by production diagnostics. Automatic triggers are read-only; no products, listings, supplier orders, or customer orders are written.")
          print()
          print("```json")
          payload = {"shopify": shopify, "base": base, "identityAudit": identity_audit, "baseIdentityRepair": base_identity_repair, "supplyDryRun": supply_dry_run}
          report_json = json.dumps(payload, ensure_ascii=False, indent=2)
          if len(report_json) > 48000:
              supply_dry_run["eligibleSamples"] = (supply_dry_run.get("eligibleSamples") or [])[:3]
              supply_dry_run["rejectedSamples"] = (supply_dry_run.get("rejectedSamples") or [])[:8]
              readiness["sampleRows"] = (readiness.get("sampleRows") or [])[:5]
              report_json = json.dumps(payload, ensure_ascii=False, indent=2)
          if len(report_json) > 50000:
              supply_dry_run.pop("eligibleSamples", None)
              supply_dry_run.pop("rejectedSamples", None)
              readiness.pop("sampleRows", None)
              report_json = json.dumps(payload, ensure_ascii=False, indent=2)
          if len(report_json) > 50000:
              raise SystemExit("AUTH_REPORT_EXCEEDS_SAFE_ISSUE_BODY_LIMIT")
          print(report_json)
          print("```")
          PY
          gh issue create \
            --repo shunai394-hash/tracer \
            --title "[TRACER auth diagnostic] Run $GITHUB_RUN_ID" \
            --body-file auth-report.md

      - name: Export complete read-only Shopify reconciliation artifacts
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, json
          from pathlib import Path

          report = json.load(open("shopify-reconcile.json"))
          items = report.get("items") or []
          if report.get("ok") is not True or report.get("shopifyStore", {}).get("countPrecision") != "EXACT" or report.get("shopify", {}).get("scanComplete") is not True:
              raise SystemExit("SHOPIFY_RECONCILIATION_INCOMPLETE_REFUSING_TO_LABEL_AUDIT_COMPLETE")
          if not isinstance(items, list) or not isinstance(report.get("unlinkedProducts"), list):
              raise SystemExit("SHOPIFY_RECONCILIATION_MISSING_ROW_LEVEL_DATA")
          fields = [
              "listingId", "existsInShopify", "dbShopifyProductId", "shopifyProductId", "shopifyHandle",
              "dbShopifyVariantId", "shopifyVariantId", "variantScanComplete", "expectedSku", "shopifySku",
              "skuMatches", "variantIdMatches", "dbSellingPrice", "shopifyPrice", "priceMatches",
              "dbInventory", "shopifyInventory", "expectedStorefrontInventory", "inventoryMatches",
              "dbPublished", "shopifyStatus", "publishedOnOnlineStore", "expectedLive", "publicationMatches",
              "gatePassed", "supplierVariantId", "syncStatus", "hasImage"
          ]
          with open("shopify-linked-row-audit.csv", "w", newline="", encoding="utf-8-sig") as f:
              writer = csv.DictWriter(f, fieldnames=fields, extrasaction="ignore")
              writer.writeheader()
              writer.writerows(items)

          unlinked_fields = ["shopifyProductId", "handle", "status", "publishedOnOnlineStore", "vendor",
                             "totalInventory", "variantScanComplete", "shopifyVariantId", "sku", "price", "inventoryQuantity"]
          with open("shopify-unlinked-products.csv", "w", newline="", encoding="utf-8-sig") as f:
              writer = csv.DictWriter(f, fieldnames=unlinked_fields, extrasaction="ignore")
              writer.writeheader()
              for product in report.get("unlinkedProducts") or []:
                  variants = product.get("variants") or [None]
                  for variant in variants:
                      row = {k: product.get(k) for k in unlinked_fields}
                      if variant:
                          row.update(variant)
                      writer.writerow(row)

          db = report.get("db") or {}
          shopify = report.get("shopify") or {}
          summary = {
              "generatedAt": report.get("generatedAt"),
              "ok": report.get("ok"),
              "readOnly": True,
              "writesPerformed": False,
              "shopifyStore": report.get("shopifyStore"),
              "shopify": shopify,
              "commerceChannelListings": report.get("commerceChannelListings"),
              "db": db,
              "linkedRowsReturned": len(items),
              "unlinkedProductsReturned": len(report.get("unlinkedProducts") or []),
              "variantScanIncompleteLinkedRows": sum(1 for row in items if row.get("variantScanComplete") is False),
              "skuMismatchRows": sum(1 for row in items if row.get("skuMatches") is False),
              "priceMismatchRows": sum(1 for row in items if row.get("priceMatches") is False),
              "inventoryMismatchRows": sum(1 for row in items if row.get("inventoryMatches") is False),
              "publicationMismatchRows": sum(1 for row in items if row.get("publicationMatches") is False),
              "variantIdMismatchRows": sum(1 for row in items if row.get("variantIdMatches") is False),
          }
          Path("shopify-live-audit-summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload read-only Shopify audit evidence
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: tracer-shopify-live-audit-${{ github.run_id }}
          path: |
            shopify-reconcile.json
            shopify-catalog.json
            shopify-sync-dry-run.json
            shopify-linked-row-audit.csv
            shopify-unlinked-products.csv
            shopify-live-audit-summary.json
            auth-check.json
            identity-audit.json
            base-diagnostics.json
          if-no-files-found: error
          retention-days: 30
