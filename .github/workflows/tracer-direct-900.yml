name: TRACER Direct 900 Gate Runner

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/tracer-direct-900.yml"
      - "scripts/direct-900-gate.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracer-direct-900
  cancel-in-progress: false

jobs:
  direct-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate Vercel CLI credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::error::Repository Actions secret VERCEL_TOKEN is required for the read-only production DB gate. Configure it in GitHub Actions secrets; do not use a GitHub OIDC token as a Vercel CLI token."
            exit 1
          fi

      - name: Pull production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          export VERCEL_ORG_ID="team_yNR5X8H8XNJ253d4OoM1NePz"
          export VERCEL_PROJECT_ID="prj_BPHJz1lzHLqw4hvcZxhoeSxCatoo"
          npx vercel@latest pull --yes --token "$VERCEL_TOKEN" --environment=production --scope=shunai394-9704s-projects --project="$VERCEL_PROJECT_ID"

      - name: Run current source against production DB
        run: |
          set -euo pipefail
          npx --yes dotenv-cli -e .env.production.local -- npx --yes tsx scripts/direct-900-gate.ts
