name: TRACER product title audit (read-only)

on:
  push:
    branches: [main]
    paths:
      - "app/api/admin/commerce/title-audit/route.ts"
      - ".github/workflows/tracer-title-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait until production serves this commit
        env:
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            sha="$(curl --fail --silent --max-time 15 https://tracer-pied-alpha.vercel.app/api/health | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).gitCommitSha||""))}catch{}})' || true)"
            if [ "$sha" = "$TARGET_SHA" ]; then exit 0; fi
            sleep 15
          done
          echo "Production does not serve $TARGET_SHA"; exit 1
      - name: Read shared-title groups
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          const audience = "https://tracer-pied-alpha.vercel.app";
          const tokenUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          tokenUrl.searchParams.set("audience", audience);
          const { value: token } = await (await fetch(tokenUrl, { headers: { Authorization: "Bearer " + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN } })).json();
          const response = await fetch(audience + "/api/admin/commerce/title-audit", { headers: { Authorization: "Bearer " + token }, signal: AbortSignal.timeout(60000) });
          const result = await response.json();
          await writeFile("title-audit.json", JSON.stringify(result, null, 2));
          console.log(JSON.stringify(result));
          if (!response.ok || result.ok !== true) throw new Error("TITLE_AUDIT_FAILED:" + response.status);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: title-audit-${{ github.run_id }}
          path: title-audit.json
          if-no-files-found: ignore
          retention-days: 14
