name: TRACER Shopify read-only auth verification

on:
  push:
    branches:
      - refactor/commerce-boundaries-audit
    paths:
      - ".github/workflows/tracer-readonly-shopify-auth.yml"

permissions:
  contents: read
  id-token: write

jobs:
  readonly-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production Shopify auth without writes
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://tracer-pied-alpha.vercel.app"
          TOKEN="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          HTTP="$(curl -sS -o auth-check.json -w "%{http_code}" --max-time 60 -H "Authorization: Bearer ${TOKEN}" "${BASE}/api/admin/shopify/auth-check")"
          echo "Diagnostic endpoint HTTP: ${HTTP}"
          python3 - "${HTTP}" <<'PY'
          import json, sys
          outer = int(sys.argv[1])
          try:
              d = json.load(open("auth-check.json"))
          except Exception:
              print("response_json=false")
              raise SystemExit(1)
          probe = {
              "endpointHttpStatus": outer,
              "shopifyHttpStatus": d.get("shopifyHttpStatus"),
              "graphqlErrorCount": len(d.get("graphqlErrors") or []),
              "shopId": d.get("shopId"),
              "expectedShopIdMatch": d.get("shopId") == "gid://shopify/Shop/74624434220",
              "authMode": (d.get("config") or {}).get("authMode"),
              "storeDomainIsMyshopify": (d.get("config") or {}).get("storeDomainIsMyshopify"),
              "tokenExchangeHttpStatus": (d.get("tokenExchange") or {}).get("httpStatus"),
              "tokenExchangeOk": (d.get("tokenExchange") or {}).get("ok"),
              "adminApiOk": (d.get("adminApi") or {}).get("ok"),
              "adminApiHttpStatus": (d.get("adminApi") or {}).get("httpStatus"),
              "missingScopes": (d.get("adminApi") or {}).get("missingScopes") or [],
              "commitSha": (d.get("config") or {}).get("commitSha"),
          }
          print(json.dumps(probe, ensure_ascii=False, indent=2))
          ok = (
              outer == 200
              and probe["shopifyHttpStatus"] == 200
              and probe["graphqlErrorCount"] == 0
              and probe["expectedShopIdMatch"]
              and probe["tokenExchangeOk"] is True
              and probe["adminApiOk"] is True
          )
          if not ok:
              raise SystemExit("READ_ONLY_SHOPIFY_AUTH_CHECK_FAILED; no write endpoint was called")
          print("READ_ONLY_SHOPIFY_AUTH_CHECK=PASS")
          PY
