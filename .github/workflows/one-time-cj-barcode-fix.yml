name: one-time-cj-barcode-fix

on:
  push:
    paths:
      - "ops/trigger-cj-barcode-fix.txt"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CJ variant barcode fallback
        shell: python
        run: |
          from pathlib import Path
          p = Path("lib/sources/cj/client.ts")
          s = p.read_text(encoding="utf-8-sig")
          old = '''    barcode:\n      row.barcode === undefined || row.barcode === null\n        ? null\n        : String(row.barcode).replace(/\\D/g, "") || null,\n'''
          new = '''    barcode:\n      [row.barcode, row.variantBarcode, row.variantBarCode, row.productBarCode]\n        .find((value) => value !== undefined && value !== null && String(value).trim())\n        ? String(\n            [row.barcode, row.variantBarcode, row.variantBarCode, row.productBarCode]\n              .find((value) => value !== undefined && value !== null && String(value).trim()),\n          ).replace(/\\D/g, "") || null\n        : null,\n'''
          if old not in s:
              raise SystemExit("expected CJ variant barcode block not found; refusing unsafe patch")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
      - name: Verify and clean up
        shell: bash
        run: |
          grep -n -A8 -B2 'barcode:' lib/sources/cj/client.ts | head -40
          rm -f ops/trigger-cj-barcode-fix.txt .github/workflows/one-time-cj-barcode-fix.yml
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/sources/cj/client.ts ops/trigger-cj-barcode-fix.txt .github/workflows/one-time-cj-barcode-fix.yml
          git diff --cached --check
          git commit -m "fix(cj): persist all supported variant barcode fields"
          git push origin HEAD:main
