name: BASE priority item pin

on:
  push:
    branches: [main]
    paths:
      - "app/api/cron/base-priority-pin/route.ts"
      - "lib/channels/base.ts"
      - "vercel.json"
      - ".github/workflows/base-priority-pin.yml"

permissions:
  contents: read
  id-token: write

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authenticate to the deployed BASE pin route with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app")"
          oidc_token="$(printf '%s' "$token_response" | jq -r '.value')"
          test -n "$oidc_token"
          for attempt in $(seq 1 18); do
            if curl -fsS --show-error \
              -H "Authorization: Bearer $oidc_token" \
              "https://tracer-pied-alpha.vercel.app/api/cron/base-priority-pin"; then
              exit 0
            fi
            echo "BASE pin route is not ready yet (attempt $attempt/18); retrying in 10 seconds."
            sleep 10
          done
          echo "BASE priority pin did not complete after deployment became available."
          exit 1
