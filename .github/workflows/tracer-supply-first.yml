name: TRACER Supply First Patrol

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  supply-first:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run supply-first patrol
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://tracer-self.vercel.app/api/cron/supply-first"
