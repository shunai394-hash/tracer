name: TRACER Supply First Patrol

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  supply-first:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run supply-first patrol passes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          for pass in 1 2 3 4; do
            echo "=== supply-first pass $pass/4 ==="
            curl --fail-with-body --silent --show-error --max-time 300 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://tracer-self.vercel.app/api/cron/supply-first"
            sleep 5
          done
