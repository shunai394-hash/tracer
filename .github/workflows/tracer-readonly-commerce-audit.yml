name: TRACER Read-only Commerce Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tracer-readonly-commerce-audit.yml"
      - "app/api/admin/commerce/status/route.ts"
      - "lib/commerce/publish.ts"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: tracer-readonly-commerce-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query authenticated read-only production diagnostics
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://tracer-pied-alpha.vercel.app"

          get_oidc_token() {
            curl --fail-with-body --silent --show-error --max-time 20 \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }

          status_token="$(get_oidc_token)"
          status_code="$(curl --silent --show-error --max-time 150 -o commerce-status.json -w "%{http_code}" \
            -H "Authorization: Bearer ${status_token}" \
            "${BASE}/api/admin/commerce/status")"
          echo "=== COMMERCE STATUS HTTP ${status_code} ==="
          python3 - <<'PY'
          import json
          with open("commerce-status.json", encoding="utf-8") as f:
              r=json.load(f)
          print("ok:", r.get("ok"), "readOnly:", r.get("readOnly"), "generatedAt:", r.get("generatedAt"))
          for key in ("catalog", "supplierOffers", "supplierOfferErrors", "prices", "channels", "livePlatforms", "orders", "procurement", "approvalEvents", "cronRuns", "listingErrors"):
              if key in r:
                  print(key + ":", json.dumps(r[key], ensure_ascii=False, separators=(",", ":")))
          items = r.get("listingErrorItems", [])
          print("listingErrorEvidence:", json.dumps([{
              "channel": item.get("channel"),
              "reason": item.get("reason"),
              "offers": [{
                  "supplier": offer.get("supplier"),
                  "status": offer.get("status"),
                  "hasProductId": bool(offer.get("productId")),
                  "hasVariantId": bool(offer.get("variantId")),
                  "lastCheckedAt": offer.get("lastCheckedAt"),
              } for offer in item.get("offers", [])]
          } for item in items], ensure_ascii=False, separators=(",", ":")))
          PY
          test "${status_code}" = "200"

          base_token="$(get_oidc_token)"
          base_code="$(curl --silent --show-error --max-time 150 -o base-diagnostics.json -w "%{http_code}" \
            -H "Authorization: Bearer ${base_token}" \
            "${BASE}/api/channels/base/diagnostics")"
          echo "=== BASE MAPPING DIAGNOSTICS HTTP ${base_code} ==="
          python3 - <<'PY'
          import json
          with open("base-diagnostics.json", encoding="utf-8") as f:
              r=json.load(f)
          print("ok:", r.get("ok"), "configured:", r.get("configured"), "baseApi:", r.get("baseApi"))
          for key in ("ordersApiStatus", "orderCountReturned", "dispatchStatuses", "itemsApiStatus", "itemCountReturned", "visibleItemsReturned", "hiddenItemsReturned", "unknownVisibilityCount", "itemPages", "itemAuditComplete", "itemErrorStage", "mappingAuditOk", "visibleItemsMatchedToDatabase", "visibleItemsManagedByCommerce", "visibleItemsLinked", "visibleItemsUnlinked", "visibleItemsWithoutDbMapping", "visibleItemsWithAmbiguousDbMapping", "itemIdentifierPresentCount", "stableTracerIdentifierCount", "itemIdMissingCount", "duplicateItemCount", "unmappedVisibleItems", "mappingAuditErrorStage"):
              if key in r:
                  print(key + ":", json.dumps(r[key], ensure_ascii=False, separators=(",", ":")))
          PY
          test "${base_code}" = "200"

          # The identity-repair endpoint defaults to dry-run; explicitly keep apply=false.
          repair_token="$(get_oidc_token)"
          repair_code="$(curl --silent --show-error --max-time 150 -o base-identity-repair-dry-run.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${repair_token}" \
            -H "Content-Type: application/json" \
            --data '{"apply":false,"limit":1000}' \
            "${BASE}/api/channels/base/identity-repair")"
          echo "=== BASE IDENTITY REPAIR DRY RUN HTTP ${repair_code} ==="
          python3 - <<'PY'
          import json
          with open("base-identity-repair-dry-run.json", encoding="utf-8") as f:
              r=json.load(f)
          print("ok:", r.get("ok"), "readOnly:", r.get("readOnly"), "apply:", r.get("apply"))
          for key in ("snapshotComplete", "scannedBaseItems", "stableIdentifierCandidates", "recoveryMarkerCandidates", "uniqueEvidencePairs", "repairable", "repaired", "commerceRepairable", "commerceRepaired", "ambiguous", "listingNotFound", "listingAlreadyLinked", "baseItemAlreadyMapped", "publicationChanged"):
              if key in r:
                  print(key + ":", json.dumps(r[key], ensure_ascii=False, separators=(",", ":")))
          PY
          test "${repair_code}" = "200"

          # This endpoint reads complete BASE and Shopify snapshots and compares
          # them with recorded external IDs/SKUs and canonical TRACER prices.
          # HTTP 207 means a complete audit found discrepancies, not a transport failure.
          audit_token="$(get_oidc_token)"
          audit_code="$(curl --silent --show-error --max-time 300 -o live-price-audit.json -w "%{http_code}" \
            -H "Authorization: Bearer ${audit_token}" \
            "${BASE}/api/admin/commerce/live-price-audit")"
          echo "=== LIVE STOREFRONT PRICE AUDIT HTTP ${audit_code} ==="
          python3 - <<'PY'
          import json
          from collections import Counter
          with open("live-price-audit.json", encoding="utf-8") as f:
              r=json.load(f)
          print("ok:", r.get("ok"), "readOnly:", r.get("readOnly"), "complete:", r.get("complete"), "generatedAt:", r.get("generatedAt"))
          print("summary:", json.dumps(r.get("summary", {}), ensure_ascii=False, separators=(",", ":")))
          counts=Counter((str(d.get("channel")), str(d.get("issue"))) for d in r.get("discrepancies", []))
          print("discrepancyCounts:", json.dumps({channel: dict((issue,n) for (ch,issue),n in counts.items() if ch==channel) for channel in sorted({ch for ch,_ in counts})}, ensure_ascii=False, separators=(",", ":")))
          if r.get("readOnly") is not True or r.get("complete") is not True:
              raise SystemExit("live storefront audit was not complete/read-only")
          PY
          [[ "${audit_code}" == "200" || "${audit_code}" == "207" ]]
