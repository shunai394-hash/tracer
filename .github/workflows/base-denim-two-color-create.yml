name: BASE denim two-color parent creation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/base-denim-two-color-create.yml'
      - 'app/api/cron/base-denim-two-color-create/route.ts'

permissions:
  contents: read
  id-token: write

concurrency:
  group: base-denim-two-color-create
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for production deployment of this commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          for attempt in $(seq 1 36); do
            token="$(curl -sSf --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            sha="$(curl -sS --max-time 20 -H "Authorization: Bearer $token" "$BASE/api/intelligence/pipeline-audit" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("deployment") or {}).get("commitSha") or "")' || true)"
            echo "attempt $attempt/36: production commit=$sha expected=$GITHUB_SHA"
            if [ "$sha" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 10
          done
          echo "Production deployment did not reach this commit; refusing stale BASE create."

      - name: Create the exact two-color BASE parent and mappings
        env:
          BASE_ORIGIN: https://tracer-pied-alpha.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -sSf --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl -sS --fail-with-body --max-time 240 -X POST \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "$BASE_ORIGIN/api/cron/base-denim-two-color-create" \
            -o base-denim-two-color-create.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("base-denim-two-color-create.json").read_text())
          print(json.dumps(data, ensure_ascii=False, indent=2))
          if data.get("ok") is not True or data.get("writesPerformed") is not True or data.get("finalReadbackVerified") is not True:
            raise SystemExit("BASE denim two-color parent creation did not pass final readback")
          if len(data.get("variations", [])) != 2 or data.get("galleryImageCount") != 2:
            raise SystemExit("BASE denim two-color counts mismatch")
          PY

      - name: Preserve creation evidence
        uses: actions/upload-artifact@v4
        with:
          name: base-denim-two-color-create
          path: base-denim-two-color-create.json
          if-no-files-found: error
          retention-days: 30
