name: BASE five-color item readback
# Refresh exact item/variation state after the first guarded consolidation attempt.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/base-five-color-readback.yml'
      - 'app/api/cron/base-targeted-readback/route.ts'

permissions:
  contents: read
  id-token: write

concurrency:
  group: base-five-color-readback
  cancel-in-progress: false

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for production deployment of this commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          for attempt in $(seq 1 36); do
            token="$(curl -sSf --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            sha="$(curl -sS --max-time 20 -H "Authorization: Bearer $token" "$BASE/api/intelligence/pipeline-audit" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("deployment") or {}).get("commitSha") or "")' || true)"
            echo "attempt $attempt/36: production commit=$sha expected=$GITHUB_SHA"
            if [ "$sha" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 10
          done
          echo "Production deployment did not reach this commit; refusing stale readback."
          exit 1

      - name: Read the five exact BASE item IDs (read-only)
        env:
          BASE_ORIGIN: https://tracer-pied-alpha.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -sSf --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl -sS --fail-with-body --max-time 120 \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/json" \
            "$BASE_ORIGIN/api/cron/base-targeted-readback?targetBaseItemIds=163167419,163159546,163159545,163159542,163159540" \
            -o base-five-color-readback.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("base-five-color-readback.json").read_text())
          print(json.dumps({
            "ok": data.get("ok"),
            "readOnly": data.get("readOnly"),
            "writesPerformed": data.get("writesPerformed"),
            "generatedAt": data.get("generatedAt"),
            "targetCount": data.get("targetCount"),
            "readErrors": data.get("readErrors"),
            "results": data.get("results"),
          }, ensure_ascii=False, indent=2))
          if data.get("readOnly") is not True or data.get("writesPerformed") is not False:
            raise SystemExit("Readback safety contract failed")
          if data.get("ok") is not True or data.get("targetCount") != 5:
            raise SystemExit("Five-item BASE readback incomplete")
          PY

      - name: Preserve the readback artifact
        uses: actions/upload-artifact@v4
        with:
          name: base-five-color-readback
          path: base-five-color-readback.json
          if-no-files-found: error
          retention-days: 14
