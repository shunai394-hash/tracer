name: TRACER Production Patrol

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: tracer-production-patrol
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Measure, repair, and report
        shell: bash
        run: |
          set -euo pipefail
          OIDC_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-self.vercel.app"
          OIDC_TOKEN="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$OIDC_URL" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          test -n "$OIDC_TOKEN"

          curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "https://tracer-self.vercel.app/api/intelligence/patrol-ai" | tee patrol-report.json

          python3 - <<'PY'
          import json
          with open("patrol-report.json", encoding="utf-8") as f:
              r=json.load(f)
          before=r.get("before",{}).get("counts",{})
          after=r.get("after",{}).get("counts",{})
          print("=== TRACER PATROL REPORT ===")
          print("patrolId:", r.get("patrolId"))
          print("repairs:", r.get("repairs", []))
          print("orderable before:", before.get("supplier_listings_orderable"))
          print("orderable after:", after.get("supplier_listings_orderable"))
          print("BASE published before:", before.get("shop_listings_on_base_published"))
          print("BASE published after:", after.get("shop_listings_on_base_published"))
          print("verdict:", r.get("verdict"))
          print("deployment:", r.get("after",{}).get("deployment",{}))
          PY
