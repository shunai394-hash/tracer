name: TRACER Recurring Patrol

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run commerce patrol pipeline
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TRACER_URL: https://tracer-self.vercel.app
        run: |
          set -euo pipefail
          run_stage() {
            echo "=== $1 ==="
            curl --fail-with-body --silent --show-error --max-time 300               -H "Authorization: Bearer $CRON_SECRET"               "$TRACER_URL$1"
          }

          # One patrol is deliberately multi-pass. Do not stop after the
          # first bestseller row: keep advancing the persisted source cursor
          # until several batches have been observed and several supplier
          # candidates have been investigated.
          for i in 1 2 3 4 5 6; do
            run_stage /api/cron/market-sourcing
            sleep 5
          done

          for i in 1 2 3 4; do
            run_stage /api/cron/supplier-investigation
            sleep 5
          done

          run_stage /api/cron/sales-test-publication
          sleep 10
          run_stage /api/cron/inventory-refresh
          sleep 10
          run_stage /api/cron/base-publish
          sleep 10
          run_stage /api/cron/dropship-execution
          sleep 10
          run_stage /api/cron/supplier-reconciliation
          sleep 10
          run_stage /api/cron/supplier-orders
