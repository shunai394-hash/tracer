name: TRACER NEWFIND Retry

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run NEWFIND retry
        run: |
          set -euo pipefail
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          token="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-self.vercel.app" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          test -n "$token"
          curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer $token" \
            "https://tracer-self.vercel.app/api/cron/newfind-retry"
