name: TRACER NEWFIND Retry

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run NEWFIND retry
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://tracer-self.vercel.app/api/cron/newfind-retry"
