name: TRACER Run Sales Test Now

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: tracer-sales-test-now
  cancel-in-progress: true

jobs:
  run:
    if: contains(github.event.head_commit.message, '[run-sales-test-now]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for production deployment
        run: sleep 60
      - name: Run canonical Sales Test publication
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          TOKEN="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl -sSf --max-time 300 -H "Authorization: Bearer $TOKEN" "$BASE/api/cron/sales-test-publication" | tee sales-test-now.json
