name: TRACER Commerce Status (read-only)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tracer-commerce-status-readonly.yml"
      - "app/api/admin/commerce/status/route.ts"
      - "app/api/channels/base/diagnostics/route.ts"
      - "app/api/admin/channels/base/snapshot/route.ts"
      - "lib/channels/base.ts"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: tracer-commerce-status-readonly
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for production deployment
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          git init status-check
          cd status-check
          git remote add origin https://github.com/${GITHUB_REPOSITORY}.git
          git fetch --depth=100 origin main
          for i in $(seq 1 20); do
            token="$(curl -sSf --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            sha="$(curl -sS --max-time 20 -H "Authorization: Bearer $token" "$BASE/api/intelligence/pipeline-audit" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("deployment") or {}).get("commitSha") or "")' || true)"
            echo "attempt $i: production commit=$sha expected=$GITHUB_SHA"
            if [ "$sha" = "$GITHUB_SHA" ]; then exit 0; fi
            if [ -n "$sha" ] && git cat-file -e "$sha^{commit}" 2>/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" "$sha"; then exit 0; fi
            sleep 15
          done
          echo "Production is not at this commit or a descendant of it."
          exit 1
      - name: Read production commerce counts (no writes)
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          token="$(curl -sSf --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          code="$(curl -sS -o status.json -w "%{http_code}" --max-time 70 -H "Authorization: Bearer $token" "$BASE/api/admin/commerce/status" || true)"
          echo "=== production commerce status HTTP $code ==="
          python3 -c 'import json; print(json.dumps(json.load(open("status.json")), ensure_ascii=False, indent=2))' || echo "status response was not JSON"
          [[ "$code" =~ ^2 ]]
