name: TRACER Autonomous Commerce Cycle

on:
  # Live multi-stage sourcing/publication/fulfillment is manual-only.
  # Vercel Cron owns scheduled production operations; pushes must not trigger commerce writes.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Reverify CJ supply at scale, publish canonical listings, then refresh operations
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://tracer-pied-alpha.vercel.app"

          token() {
            curl -sSf --max-time 20 \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }

          call() {
            local path="$1"
            local max_time="$2"
            local out="$3"
            local code
            code=$(curl -sS -o "$out" -w "%{http_code}" --max-time "$max_time" \
              -H "Authorization: Bearer $(token)" \
              "$BASE$path" || true)
            echo "=== $path HTTP $code ==="
            python3 - "$out" <<'PY'
          import json,sys
          p=sys.argv[1]
          try:
              print(json.dumps(json.load(open(p,encoding="utf-8")),ensure_ascii=False,indent=2)[:20000])
          except Exception:
              print(open(p,encoding="utf-8",errors="replace").read()[:20000])
          PY
          }

          echo "Start the bounded supply-to-publication cycle."
          sleep 15

          # Reverify supplier identity before the publication gate.
          for pass in 1 2 3 4 5 6 7 8; do
            call "/api/cron/cj-identity-reverify" 300 "cj-reverify-${pass}.json"
          done

          # Canonical gate only: no source importer may bypass it.
          call "/api/cron/sales-test-publication" 300 publish-first.json
          call "/api/cron/market-sourcing" 60 market-sourcing.json
          call "/api/cron/supplier-investigation" 180 supplier-investigation.json
          call "/api/cron/intelligence" 300 intelligence.json
          call "/api/cron/sales-test-publication" 300 publish-after-intelligence.json
          call "/api/cron/base-publish" 300 base-reconcile.json
          call "/api/cron/shopify-publish" 300 shopify-sync.json
          call "/api/cron/dropship-execution" 300 dropship.json
