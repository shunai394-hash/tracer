name: TRACER Autonomous Commerce Cycle

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: tracer-autonomous-commerce-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Identity reverify -> Intelligence -> Sales Test
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://tracer-self.vercel.app"

          token() {
            curl -sSf               -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-self.vercel.app" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }

          call() {
            local path="$1"
            local max_time="$2"
            local out="$3"
            local code
            code=$(curl -sS -o "$out" -w "%{http_code}" --max-time "$max_time"               -H "Authorization: Bearer $(token)"               "$BASE$path")
            echo "=== $path HTTP $code ==="
            python3 - "$out" <<'PY'
          import json, sys
          path = sys.argv[1]
          try:
              data = json.load(open(path, encoding="utf-8"))
              print(json.dumps(data, ensure_ascii=False, indent=2)[:50000])
          except Exception:
              print(open(path, encoding="utf-8", errors="replace").read()[:50000])
          PY
            test "$code" -ge 200
            test "$code" -lt 300
          }

          call "/api/cron/cj-identity-reverify" 300 identity.json
          call "/api/cron/intelligence" 300 intelligence.json
          call "/api/cron/sales-test-publication" 300 sales.json
