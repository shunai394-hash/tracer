name: TRACER Publish CJ Products Now

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  publish-cj-now:
    if: contains(github.event.head_commit.message, '[publish-cj-now]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for production deployment
        run: sleep 90
      - name: Reverify CJ identities and publish canonical products
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://tracer-self.vercel.app
          token() {
            curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-self.vercel.app" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }

          echo "=== SALES TEST PUBLICATION ==="
          curl -sSf --max-time 300 -H "Authorization: Bearer $(token)" "$BASE/api/cron/sales-test-publication" > sales.json
          python3 - <<'PY'
          import json
          d=json.load(open("sales.json"))
          print(json.dumps(d, ensure_ascii=False, indent=2)[:50000])
          PY

          echo "=== PRODUCTION PUBLISHED COUNT ==="
          curl -sSf --max-time 60 -H "Authorization: Bearer $(token)" "$BASE/api/intelligence/e2e-funnel" > funnel.json
          python3 - <<'PY'
          import json
          d=json.load(open("funnel.json"))
          print(json.dumps(d, ensure_ascii=False, indent=2)[:30000])
          PY
