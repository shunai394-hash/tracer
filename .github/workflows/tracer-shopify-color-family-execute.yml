          {"supplierVariantId":"2610130254321622300","canonicalVariantId":"b8a81003-ca31-41d2-b092-49a053ffc907","sourceShopifyProductId":"8661943124012","sourceShopifyVariantId":"46584580669484","sku":"CJNS325064801AZ","colorLabel":"カーキ","imageUrl":"https://cdn.shopify.com/s/files/1/0746/2443/4220/files/efba2566-74c0-4da5-9507-79368e24f4c3_683c503e-2e57-46fd-8a08-53c5184ef45b.png?v=1793874642","colorImageVerified":true,"price":5824,"inventory":10},
          {"supplierVariantId":"2610130254321622301","canonicalVariantId":"fa7d6f54-881f-4720-93b8-a65887e16c2c","sourceShopifyProductId":"8661943058476","sourceShopifyVariantId":"46584580636716","sku":"CJNS325064802BY","colorLabel":"レッド","imageUrl":"https://cdn.shopify.com/s/files/1/0746/2443/4220/files/efba2566-74c0-4da5-9507-79368e24f4c3_a7738c4c-36be-46bd-97be-f422b3fa783e.png?v=1793874638","colorImageVerified":true,"price":5824,"inventory":10},
          {"supplierVariantId":"2610130254321622302","canonicalVariantId":"ba1b7089-c6ee-42f8-8682-6ef764cfdcc3","sourceShopifyProductId":"8661942796332","sourceShopifyVariantId":"46584580407340","sku":"CJNS325064803CX","colorLabel":"ブラック","imageUrl":"https://cdn.shopify.com/s/files/1/0746/2443/4220/files/efba2566-74c0-4da5-9507-79368e24f4c3_8c8b7a6c-5fee-49d9-993e-4b058f3aab32.png?v=1793874634","colorImageVerified":true,"price":5824,"inventory":10},
          {"supplierVariantId":"2610130254321622303","canonicalVariantId":"2170283d-d650-4cef-8bf2-94e4ac1edde5","sourceShopifyProductId":"8661941813292","sourceShopifyVariantId":"46584578670636","sku":"CJNS325064804DW","colorLabel":"ブルー","imageUrl":"https://cdn.shopify.com/s/files/1/0746/2443/4220/files/efba2566-74c0-4da5-9507-79368e24f4c3_412fc85e-8dde-4ee5-9fe2-7de2091b2172.png?v=1793874630","colorImageVerified":true,"price":5824,"inventory":10},
          {"supplierVariantId":"2610130254321622304","canonicalVariantId":"33d4c321-2157-4c91-8ea0-6cec48df1433","sourceShopifyProductId":"8661941485612","sourceShopifyVariantId":"46584579522604","sku":"CJNS325064805EV","colorLabel":"グリーン","imageUrl":"https://cdn.shopify.com/s/files/1/0746/2443/4220/files/efba2566-74c0-4da5-9507-79368e24f4c3.png?v=1793874626","colorImageVerified":true,"price":5824,"inventory":10}
          ]}}
          JSON

          for family in a b c; do
            code="$(curl -sS -o "/tmp/result-${family}.json" -w "%{http_code}" -X POST "https://tracer-pied-alpha.vercel.app/api/admin/shopify/color-family" \
              -H "Authorization: Bearer ${OIDC_TOKEN}" -H "Content-Type: application/json" \
              --data-binary "@/tmp/family-${family}.json")"
            cat "/tmp/result-${family}.json"
            echo
            test "$code" = "200"
          done
