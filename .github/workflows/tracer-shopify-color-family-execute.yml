name: TRACER one-time Shopify color family draft creation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tracer-shopify-color-family-execute.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: tracer-shopify-color-family-draft-create
  cancel-in-progress: false

jobs:
  create-draft-families:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtain GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://tracer-pied-alpha.vercel.app")"
          token="$(jq -r '.value // empty' <<< "$token_json")"
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Create the three DRAFT parent products
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/family-a.json <<'JSON'
