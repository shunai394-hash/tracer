          {"supplierVariantId":"2611030217291630601","canonicalVariantId":"5a576ab9-6104-448d-8a70-ceaf0b299d8e","sourceShopifyProductId":"8665688113196","sourceShopifyVariantId":"46595166175276","sku":"CJNS355974202BY","colorLabel":"レッド","imageUrl":"https://cdn.shopify.com/s/files/1/0746/2443/4220/files/2759fe09-30d3-40d5-b299-1b9396ca758b_d71b1415-b055-49f8-be89-9acb34eba80b.jpg?v=1793982640","colorImageVerified":true,"price":9610,"inventory":10},
