          {"supplierVariantId":"2608270931501633201","canonicalVariantId":"2722178e-120f-43e8-a219-e3da7b1b32a6","sourceShopifyProductId":"8659229999148","sourceShopifyVariantId":"46578672861228","sku":"CJNS310228902BY","colorLabel":"クロコ柄","imageUrl":"https://cdn.shopify.com/s/files/1/0746/2443/4220/files/0f9782b6-9414-4c56-8dbd-7d8e731ceca9_f311d0a3-b23a-4d8f-b9d8-ee06fdaf9817.jpg?v=1793802641","colorImageVerified":true,"price":11546,"inventory":10},
          {"supplierVariantId":"2608270931501633202","canonicalVariantId":"f3152e19-7d52-4c37-810e-3e6741c98781","sourceShopifyProductId":"8659229835308","sourceShopifyVariantId":"46578672730156","sku":"CJNS310228903CX","colorLabel":"ブラックタビー","imageUrl":"https://cdn.shopify.com/s/files/1/0746/2443/4220/files/0f9782b6-9414-4c56-8dbd-7d8e731ceca9_a3030458-a810-41b1-8db7-cfab51edea37.jpg?v=1793802636","colorImageVerified":true,"price":11546,"inventory":10},
