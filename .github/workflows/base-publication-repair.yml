name: BASE publication mismatch repair

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Delete five hidden duplicates and hide two visible non-canonical items
        type: boolean
        default: false
        required: true
      confirmation:
        description: Type REPAIR_BASE_PUBLICATION_MISMATCHES_AND_HIDDEN_DUPLICATES only when authorizing the repair
        type: string
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait until production serves this commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          git fetch origin main --quiet
          for attempt in $(seq 1 36); do
            token="$(curl -sSf --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            sha="$(curl -sS --max-time 20 -H "Authorization: Bearer $token" "$BASE/api/intelligence/pipeline-audit" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("deployment") or {}).get("commitSha") or "")' || true)"
            echo "attempt $attempt/36: production commit=$sha expected=$GITHUB_SHA"
            if [ "$sha" = "$GITHUB_SHA" ]; then exit 0; fi
            if [ -n "$sha" ] && git cat-file -e "$sha^{commit}" 2>/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" "$sha"; then exit 0; fi
            sleep 10
          done
          echo "Production is not at this commit."
          exit 1
      - name: Dry-run the eleven publication targets
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          mkdir -p repair-results
          token="$(curl -sSf --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          code="$(curl -sS --max-time 110 -o repair-results/dry-run.json -w "%{http_code}" -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data '{"apply":false}' "$BASE/api/channels/base/publication-repair")"
          echo "dry-run HTTP $code"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("repair-results/dry-run.json").read_text())
          print(json.dumps({"ok": d.get("ok"), "blocked": d.get("blocked"), "itemCount": d.get("itemCount"), "orderScan": d.get("orderScan"), "listingReferences": d.get("listingReferences"), "deletes": d.get("deletes"), "hides": d.get("hides"), "errorItems": d.get("errorItems")}, ensure_ascii=False))
          if d.get("readOnly") is not True or (d.get("orderScan") or {}).get("complete") is not True:
            raise SystemExit("dry-run could not finish the order scan")
          if d.get("listingReferences"):
            raise SystemExit("a listing still points at a repair target")
          PY
          [[ "$code" == "200" || "$code" == "409" ]]
      - name: Apply only with explicit confirmation
        if: inputs.apply
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "REPAIR_BASE_PUBLICATION_MISMATCHES_AND_HIDDEN_DUPLICATES" ]] || { echo "Exact confirmation phrase required."; exit 1; }
          BASE=https://tracer-pied-alpha.vercel.app
          token="$(curl -sSf --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          code="$(curl -sS --max-time 110 -o repair-results/apply.json -w "%{http_code}" -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data '{"apply":true,"confirmation":"REPAIR_BASE_PUBLICATION_MISMATCHES_AND_HIDDEN_DUPLICATES"}' "$BASE/api/channels/base/publication-repair")"
          echo "apply HTTP $code"
          cat repair-results/apply.json
          [[ "$code" == "200" ]]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base-publication-repair-${{ github.run_id }}
          path: repair-results/
