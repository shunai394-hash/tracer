name: TRACER Production Deploy (BASE + Shopify)

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Production deployment
        run: |
          echo "TRACER production deployment is managed by the connected Vercel Git integration."
          echo "Commit: ${GITHUB_SHA}"
          echo "This workflow intentionally does not target tracer-self.vercel.app or use VERCEL_TOKEN."
