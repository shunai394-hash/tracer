name: TRACER Run Supplier-First Recovery
# Use the live supplier-native pipeline. The legacy supplier-investigation endpoint is intentionally disabled and only returns skipped=true.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tracer-link-existing-supply.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: tracer-link-existing-supply
  cancel-in-progress: false

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait until production includes this workflow commit
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://tracer-pied-alpha.vercel.app"
          token="$(curl -sSf --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          for i in $(seq 1 18); do
            sha="$(curl -sS --max-time 15 -H "Authorization: Bearer $token" "$BASE/api/intelligence/pipeline-audit" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("deployment") or {}).get("commitSha") or "")' || true)"
            echo "attempt $i: production commit=$sha expected=$GITHUB_SHA"
            if [ "$sha" = "$GITHUB_SHA" ]; then exit 0; fi
            if [ -n "$sha" ] && git cat-file -e "$sha^{commit}" 2>/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" "$sha"; then
              echo "Production is on a descendant commit containing this workflow."
              exit 0
            fi
            sleep 10
          done
          echo "Production has not reflected this commit; refusing to call a stale deployment."
          exit 1

      - name: Run supplier-first discovery, verification, and gated channel sync
        shell: bash
        run: |
          set -euo pipefail
          OIDC_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app"
          OIDC_TOKEN="$(curl --fail-with-body --silent --show-error --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$OIDC_URL" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          audit_code="$(curl -sS --max-time 30 -o source-audit.json -w "%{http_code}" -H "Authorization: Bearer $OIDC_TOKEN" "https://tracer-pied-alpha.vercel.app/api/intelligence/pipeline-audit" || true)"
          echo "=== SOURCE AUDIT HTTP $audit_code ==="
          python3 - <<'PY'
          import json
          try:
              with open("source-audit.json", encoding="utf-8") as f:
                  r=json.load(f)
              keys = [
                  "marketplace_bestsellers", "marketplace_bestsellers_pending",
                  "marketplace_bestsellers_failed", "marketplace_bestsellers_blocked",
                  "marketplace_bestsellers_with_strict_identifier", "marketplace_bestseller_variants",
                  "internal_supply_products", "internal_supply_products_active",
                  "internal_supply_variants", "internal_supply_variants_active_orderable_stocked",
                  "internal_supply_links", "supplier_listings", "supplier_listings_orderable",
              ]
              print("SOURCE AUDIT:", json.dumps({
                  "deployment": r.get("deployment"),
                  "counts": {k: (r.get("counts") or {}).get(k) for k in keys},
              }, ensure_ascii=False))
          except Exception as e:
              print("Could not parse source audit:", e)
          PY
          if [ "$audit_code" != "200" ]; then
            echo "Source audit failed; refusing to interpret linkage without counts."
            exit 1
          fi
          code="$(curl -sS --max-time 300 -o linkage-report.json -w "%{http_code}" -H "Authorization: Bearer $OIDC_TOKEN" "https://tracer-pied-alpha.vercel.app/api/cron/supply-first" || true)"
          echo "=== SUPPLIER-FIRST RECOVERY HTTP $code ==="
          python3 - <<'PY'
          import json,sys
          try:
              with open("linkage-report.json", encoding="utf-8") as f:
                  r=json.load(f)
          except Exception as e:
              print("Could not parse linkage report:", e)
              sys.exit(1)
          supply = r.get("supplyFirst") or {}
          publication = r.get("publication") or {}
          summary = {
              "ok": r.get("ok"),
              "discoveryIncomplete": r.get("discoveryIncomplete"),
              "elapsedMs": r.get("elapsedMs"),
              "reason": supply.get("reason"),
              "quotaBlocked": supply.get("quotaBlocked"),
              "retryAfter": supply.get("retryAfter"),
              "candidateCount": supply.get("candidateCount"),
              "discovered": supply.get("discovered"),
              "verified": supply.get("verified"),
              "eligibleCount": supply.get("eligibleCount"),
              "published": supply.get("published"),
              "opportunityIntelligence": r.get("opportunityIntelligence"),
              "channelPublication": publication,
          }
          print("SUPPLIER-FIRST REPORT:", json.dumps(summary, ensure_ascii=False))
          if r.get("ok") is not True:
              print("Supplier-first pipeline did not complete; inspect quota/deadline/eligibility details above.")
              sys.exit(1)
          PY
          if [ "$code" != "200" ]; then
            echo "Supplier linkage did not return HTTP 200."
            exit 1
          fi
