name: One-time BASE Japanese copy repair

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[run-base-japanese-copy]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run verified BASE Japanese copy batches
        uses: actions/github-script@v7
        with:
          script: |
            const audience = "https://tracer-pied-alpha.vercel.app";
            const token = await core.getIDToken(audience);
            const endpoint = "https://tracer-pied-alpha.vercel.app/api/cron/base-japanese-copy?limit=10";
            let totalTranslated = 0;
            for (let batch = 1; batch <= 5; batch++) {
              const response = await fetch(endpoint, {
                method: "GET",
                headers: { authorization: `Bearer ${token}`, accept: "application/json" },
                cache: "no-store",
              });
              const raw = await response.text();
              let data;
              try { data = JSON.parse(raw); } catch { throw new Error(`Batch ${batch}: non-JSON response HTTP ${response.status}: ${raw.slice(0, 300)}`); }
              core.info(`Batch ${batch}: HTTP ${response.status}; requested=${data.requested ?? "?"}; verified=${data.translatedAndVerified ?? 0}; failed=${data.failed ?? "?"}; deferred=${data.deferred ?? "?"}; remainingEstimate=${data.remainingEnglishEstimate ?? "?"}`);
              if (!response.ok || data.ok === false && !(data.translatedAndVerified > 0)) {
                core.warning(JSON.stringify(data.results ?? data).slice(0, 4000));
                break;
              }
              totalTranslated += Number(data.translatedAndVerified ?? 0);
              if (Number(data.translatedAndVerified ?? 0) === 0) {
                core.warning("No verified translations in this batch; stopping to avoid repeating failures.");
                break;
              }
            }
            core.info(`Total BASE items translated and verified this run: ${totalTranslated}`);
