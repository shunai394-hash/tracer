name: Legacy CJ sandbox once workflow (disabled)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Use the canonical clean-commerce recovery workflow instead
        run: echo "Disabled legacy sandbox workflow; use .github/workflows/tracer-clean-commerce-recovery.yml."
