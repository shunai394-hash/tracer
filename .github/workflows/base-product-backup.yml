name: BASE product backup
# Read-only BASE snapshot and exact-ID reconciliation refresh after the latest production audit.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/base-product-backup.yml"
      - "app/api/admin/channels/base/reconciliation/route.ts"
      - "app/api/admin/channels/base/snapshot/route.ts"
      - "app/api/cron/base-channel-external-readback/route.ts"
      - "lib/channels/base-publisher.ts"

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  export:
    name: Export and validate BASE product snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out commit history for deployment verification
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait until production serves this commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://tracer-pied-alpha.vercel.app
          git fetch origin main --quiet
          for attempt in $(seq 1 24); do
            token="$(curl -sSf --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            sha="$(curl -sS --max-time 20 -H "Authorization: Bearer $token" "$BASE/api/intelligence/pipeline-audit" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("deployment") or {}).get("commitSha") or "")' || true)"
            echo "attempt $attempt/24: production commit=$sha expected=$GITHUB_SHA"
            if [ "$sha" = "$GITHUB_SHA" ]; then exit 0; fi
            if [ -n "$sha" ] && git cat-file -e "$sha^{commit}" 2>/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" "$sha"; then
              exit 0
            fi
            sleep 10
          done
          echo "Production is not at this commit or a descendant; refusing a stale BASE scan."
          exit 1

      - name: Request a short-lived GitHub OIDC token for Vercel
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";

          const audience = "https://tracer-pied-alpha.vercel.app";
          const tokenUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          tokenUrl.searchParams.set("audience", audience);
          const tokenResponse = await fetch(tokenUrl, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          });
          if (!tokenResponse.ok) throw new Error(`OIDC_TOKEN_REQUEST_FAILED:${tokenResponse.status}`);
          const tokenBody = await tokenResponse.json();
          if (typeof tokenBody.value !== "string" || !tokenBody.value) {
            throw new Error("OIDC_TOKEN_MISSING");
          }

          const response = await fetch(`${audience}/api/admin/channels/base/snapshot`, {
            headers: {
              Authorization: `Bearer ${tokenBody.value}`,
              Accept: "application/json",
            },
            signal: AbortSignal.timeout(110_000),
          });
          if (!response.ok) {
            const body = await response.json().catch(() => ({}));
            throw new Error(`BASE_SNAPSHOT_HTTP_${response.status}:${String(body.error ?? "request_failed").slice(0, 100)}`);
          }

          const snapshot = await response.json();
          if (snapshot.complete !== true || !Array.isArray(snapshot.items)) {
            throw new Error("BASE_SNAPSHOT_INCOMPLETE");
          }
          if (!Number.isInteger(snapshot.itemCount) || snapshot.itemCount !== snapshot.items.length || snapshot.itemCount < 1) {
            throw new Error("BASE_SNAPSHOT_COUNT_MISMATCH_OR_EMPTY");
          }
          const ids = snapshot.items.map((item) => String(item?.item_id ?? ""));
          if (ids.some((id) => !id) || new Set(ids).size !== ids.length) {
            throw new Error("BASE_SNAPSHOT_ITEM_ID_MISSING_OR_DUPLICATE");
          }
          const file = `tracer-base-products-${new Date().toISOString().slice(0, 10)}-${process.env.GITHUB_RUN_ID}.json`;
          await writeFile(file, JSON.stringify(snapshot, null, 2), { mode: 0o600 });

          let report = null;
          // GitHub push workflows can start before Vercel finishes deploying the
          // same commit. Retry the read-only report until the new route contract
          // is live; otherwise the issue could silently contain stale metrics.
          for (let attempt = 0; attempt < 12; attempt += 1) {
            const auditResponse = await fetch(`${audience}/api/admin/channels/base/reconciliation`, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${tokenBody.value}`,
                "Content-Type": "application/json",
                Accept: "application/json",
              },
              body: JSON.stringify({ snapshot }),
              signal: AbortSignal.timeout(110_000),
            });
            if (!auditResponse.ok) {
              const body = await auditResponse.json().catch(() => ({}));
              throw new Error(`BASE_RECONCILIATION_HTTP_${auditResponse.status}:${String(body.error ?? "request_failed").slice(0, 100)}`);
            }
            const candidate = await auditResponse.json();
            if (candidate.complete !== true || !Array.isArray(candidate.items) || candidate.baseItemCount !== candidate.items.length) {
              throw new Error("BASE_RECONCILIATION_INCOMPLETE_OR_COUNT_MISMATCH");
            }
            if (candidate.schemaVersion >= 3 && Object.prototype.hasOwnProperty.call(candidate, "unmappedClassification") && Object.prototype.hasOwnProperty.call(candidate, "commerceChannelListingCount") && Object.prototype.hasOwnProperty.call(candidate, "commerceTrcIdentifierMatchCount") && Object.prototype.hasOwnProperty.call(candidate, "baseItemsWithExactSupplierIdentifierCandidateCount") && Object.prototype.hasOwnProperty.call(candidate, "baseItemsWithAmbiguousExactTitleCandidateCount")) {
              report = candidate;
              break;
            }
            await new Promise((resolve) => setTimeout(resolve, 10_000));
          }
          if (!report) throw new Error("BASE_RECONCILIATION_DEPLOYMENT_NOT_CURRENT");
          const reportFile = `tracer-base-reconciliation-${new Date().toISOString().slice(0, 10)}-${process.env.GITHUB_RUN_ID}.json`;
          await writeFile(reportFile, JSON.stringify(report, null, 2), { mode: 0o600 });

          // Identity repair is deliberately dry-run only; this workflow never mutates mappings.
          const identityResponse = await fetch(audience + "/api/channels/base/identity-repair", {
            method: "POST",
            headers: {
              Authorization: "Bearer " + tokenBody.value,
              "Content-Type": "application/json",
              Accept: "application/json",
            },
            body: JSON.stringify({ apply: false, limit: 1000 }),
            signal: AbortSignal.timeout(110_000),
          });
          const identityRepair = await identityResponse.json().catch(() => ({}));
          if (!identityResponse.ok) {
            throw new Error("BASE_IDENTITY_REPAIR_DRY_RUN_HTTP_" + identityResponse.status + ":" + String(identityRepair.error ?? "request_failed").slice(0, 100));
          }
          if (identityRepair.ok !== true || identityRepair.readOnly !== true || identityRepair.snapshotComplete !== true) {
            throw new Error("BASE_IDENTITY_REPAIR_DRY_RUN_NOT_SAFE_OR_INCOMPLETE");
          }
          const identityFile = "tracer-base-identity-repair-dry-run-" + new Date().toISOString().slice(0, 10) + "-" + process.env.GITHUB_RUN_ID + ".json";
          await writeFile(identityFile, JSON.stringify(identityRepair, null, 2), { mode: 0o600 });
          console.log(JSON.stringify({
            identityRepairDryRunFile: identityFile, readOnly: identityRepair.readOnly,
            snapshotComplete: identityRepair.snapshotComplete, scannedBaseItems: identityRepair.scannedBaseItems,
            stableIdentifierCandidates: identityRepair.stableIdentifierCandidates, recoveryMarkerCandidates: identityRepair.recoveryMarkerCandidates,
            uniqueEvidencePairs: identityRepair.uniqueEvidencePairs, repairable: identityRepair.repairable,
            commerceRepairable: identityRepair.commerceRepairable, ambiguous: identityRepair.ambiguous,
            listingNotFound: identityRepair.listingNotFound, listingAlreadyLinked: identityRepair.listingAlreadyLinked,
            baseItemAlreadyMapped: identityRepair.baseItemAlreadyMapped, repaired: identityRepair.repaired,
            commerceRepaired: identityRepair.commerceRepaired, publicationChanged: identityRepair.publicationChanged,
          }));
          console.log(JSON.stringify({
            reconciliationFile: reportFile,
            tracerListingCount: report.tracerListingCount,
            exactBaseIdMappedCount: report.exactBaseIdMappedCount,
            baseItemsWithoutExactMappingCount: report.baseItemsWithoutExactMappingCount,
            baseItemsWithAmbiguousExactMappingCount: report.baseItemsWithAmbiguousExactMappingCount,
            baseItemsWithExactTitleCandidateCount: report.baseItemsWithExactTitleCandidateCount,
            tracerListingsWithoutBaseItemIdCount: report.tracerListingsWithoutBaseItemIdCount,
            duplicateBaseItemIdGroupsInTracer: report.duplicateBaseItemIdGroupsInTracer,
            safeLinkCandidateCount: report.safeLinkCandidateCount,
            unmappedClassification: Object.fromEntries(Object.entries(report.unmappedClassification).map(([key, value]) => [key, { total: value.total, visible: value.visible, hidden: value.hidden }])),
          }));
          console.log(JSON.stringify({ unmappedSamples: report.unmappedClassification }, null, 1));
          console.log(JSON.stringify({
            backupFile: file,
            complete: snapshot.complete,
            pages: snapshot.pages,
            itemCount: snapshot.itemCount,
            visibleCount: snapshot.visibleCount,
            hiddenCount: snapshot.hiddenCount,
            unknownVisibilityCount: snapshot.unknownVisibilityCount,
            uniqueItemIds: new Set(ids).size,
            generatedAt: snapshot.generatedAt,
          }));
          NODE

      - name: Publish sanitized BASE reconciliation summary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > base-reconciliation-summary.md
          import glob, json, os
          files = glob.glob("tracer-base-reconciliation-*.json")
          if len(files) != 1:
              raise SystemExit("BASE_RECONCILIATION_REPORT_FILE_MISSING_OR_AMBIGUOUS")
          d = json.load(open(files[0], encoding="utf-8"))
          identity_files = glob.glob("tracer-base-identity-repair-dry-run-*.json")
          if len(identity_files) != 1:
              raise SystemExit("BASE_IDENTITY_REPAIR_DRY_RUN_FILE_MISSING_OR_AMBIGUOUS")
          identity = json.load(open(identity_files[0], encoding="utf-8"))
          if identity.get("ok") is not True or identity.get("readOnly") is not True or identity.get("snapshotComplete") is not True:
              raise SystemExit("BASE_IDENTITY_REPAIR_DRY_RUN_NOT_SAFE_OR_INCOMPLETE")
          base_items_by_id = {str(item.get("baseItemId", "")): item for item in d.get("items", [])}
          summary = {
              "complete": d.get("complete"),
              "baseItemCount": d.get("baseItemCount"),
              "baseVisibleCount": d.get("baseVisibleCount"),
              "baseHiddenCount": d.get("baseHiddenCount"),
              "tracerListingCount": d.get("tracerListingCount"),
              "commerceChannelListingCount": d.get("commerceChannelListingCount"),
              "commerceTrcIdentifierMatchCount": d.get("commerceTrcIdentifierMatchCount"),
              "exactBaseIdMappedCount": d.get("exactBaseIdMappedCount"),
              "baseItemsWithoutExactMappingCount": d.get("baseItemsWithoutExactMappingCount"),
              "baseItemsWithAmbiguousExactMappingCount": d.get("baseItemsWithAmbiguousExactMappingCount"),
              "baseItemsWithExactTitleCandidateCount": d.get("baseItemsWithExactTitleCandidateCount"),
              "baseItemsWithAmbiguousExactTitleCandidateCount": d.get("baseItemsWithAmbiguousExactTitleCandidateCount"),
              "baseItemsWithExactSupplierIdentifierCandidateCount": d.get("baseItemsWithExactSupplierIdentifierCandidateCount"),
              "baseItemsWithAmbiguousSupplierIdentifierCandidateCount": d.get("baseItemsWithAmbiguousSupplierIdentifierCandidateCount"),
              "stableIdentifierCount": sum(1 for item in d.get("items", []) if str(item.get("identifier", "")).startswith("TRC-")),
              "stableIdentifierListingMatchedCount": sum(1 for item in d.get("items", []) if str(item.get("identifier", "")).startswith("TRC-") and item.get("stableIdentifierMatchCount") == 1),
              "stableIdentifierBaseItemIdMissingCount": sum(1 for item in d.get("items", []) if str(item.get("identifier", "")).startswith("TRC-") and item.get("stableIdentifierMatchCount") == 1 and item.get("stableIdentifierMatches", [{}])[0].get("existingBaseItemId") is None),
              "stableIdentifierBaseItemIdConflictCount": sum(1 for item in d.get("items", []) if str(item.get("identifier", "")).startswith("TRC-") and item.get("stableIdentifierMatchCount") == 1 and item.get("stableIdentifierMatches", [{}])[0].get("existingBaseItemId") is not None and str(item.get("stableIdentifierMatches", [{}])[0].get("existingBaseItemId")) != str(item.get("baseItemId"))),
              "stableIdentifierConflictSamples": [
                  {
                      "identifier": item.get("identifier"),
                      "baseItemId": item.get("baseItemId"),
                      "baseTitle": str(item.get("title", ""))[:100],
                      "listingId": (item.get("stableIdentifierMatches") or [{}])[0].get("listingId"),
                      "listingTitle": str((item.get("stableIdentifierMatches") or [{}])[0].get("title", ""))[:100],
                      "existingBaseItemId": (item.get("stableIdentifierMatches") or [{}])[0].get("existingBaseItemId"),
                      "orderable": (item.get("stableIdentifierMatches") or [{}])[0].get("orderable"),
                      "supplierVariantId": (item.get("stableIdentifierMatches") or [{}])[0].get("supplierVariantId"),
                      "exactBaseIdMatchCount": item.get("exactBaseIdMatchCount"),
                      "exactTitleCandidateListingIds": [candidate.get("listingId") for candidate in (item.get("exactTitleCandidates") or [])[:5]],
                      "existingBaseItemEvidence": {
                          "identifier": (base_items_by_id.get(str((item.get("stableIdentifierMatches") or [{}])[0].get("existingBaseItemId"))) or {}).get("identifier"),
                          "title": str((base_items_by_id.get(str((item.get("stableIdentifierMatches") or [{}])[0].get("existingBaseItemId"))) or {}).get("title", ""))[:100],
                          "visible": (base_items_by_id.get(str((item.get("stableIdentifierMatches") or [{}])[0].get("existingBaseItemId"))) or {}).get("visible"),
                          "listingId": (((base_items_by_id.get(str((item.get("stableIdentifierMatches") or [{}])[0].get("existingBaseItemId"))) or {}).get("stableIdentifierMatches") or [{}])[0]).get("listingId"),
                          "stableIdentifierMatchCount": (base_items_by_id.get(str((item.get("stableIdentifierMatches") or [{}])[0].get("existingBaseItemId"))) or {}).get("stableIdentifierMatchCount")
                      }
                  }
                  for item in d.get("items", [])
                  if str(item.get("identifier", "")).startswith("TRC-")
                  and item.get("stableIdentifierMatchCount") == 1
                  and (item.get("stableIdentifierMatches") or [{}])[0].get("existingBaseItemId") is not None
                  and str((item.get("stableIdentifierMatches") or [{}])[0].get("existingBaseItemId")) != str(item.get("baseItemId"))
              ],
              "tracerListingsWithoutBaseItemIdCount": d.get("tracerListingsWithoutBaseItemIdCount"),
              "duplicateBaseItemIdGroupsInTracer": d.get("duplicateBaseItemIdGroupsInTracer"),
              "safeLinkCandidateCount": d.get("safeLinkCandidateCount"),
              "unmappedClassification": {k: {"total": v.get("total"), "visible": v.get("visible"), "hidden": v.get("hidden")} for k, v in (d.get("unmappedClassification") or {}).items()},
              "generatedAt": d.get("generatedAt"),
              "note": "Exact-title candidates are evidence only; no mappings or listings were changed."
          }
          print("# TRACER BASE mapping audit")
          print()
          print("Read-only reconciliation summary. No BASE listing, TRACER mapping, or order was modified.")
          print()
          print("## Exact-ID identity repair dry run (read-only)")
          print()
          print("```json")
          print(json.dumps({key: identity.get(key) for key in [
              "readOnly", "snapshotComplete", "scannedBaseItems", "stableIdentifierCandidates",
              "recoveryMarkerCandidates", "uniqueEvidencePairs", "repairable", "commerceRepairable",
              "ambiguous", "listingNotFound", "listingAlreadyLinked", "baseItemAlreadyMapped",
              "repaired", "commerceRepaired", "publicationChanged"
          ]}, ensure_ascii=False, indent=2))
          print("```")
          print()
          print("Repair was not applied; this workflow only reports exact-evidence candidates.")
          print()
          print("```json")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          print("```")
          PY
          gh issue create \
            --repo shunai394-hash/tracer \
            --title "[TRACER BASE mapping audit] Run $GITHUB_RUN_ID" \
            --body-file base-reconciliation-summary.md

