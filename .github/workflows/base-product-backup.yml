name: BASE product reconciliation audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/base-product-backup.yml"

permissions:
  contents: read
  id-token: write

jobs:
  export:
    name: Export and validate BASE product snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request a short-lived GitHub OIDC token for Vercel
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const audience = "https://tracer-pied-alpha.vercel.app";
          const tokenUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          tokenUrl.searchParams.set("audience", audience);
          const tokenResponse = await fetch(tokenUrl, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          });
          if (!tokenResponse.ok) throw new Error(`OIDC_TOKEN_REQUEST_FAILED:${tokenResponse.status}`);
          const tokenBody = await tokenResponse.json();
          if (typeof tokenBody.value !== "string" || !tokenBody.value) {
            throw new Error("OIDC_TOKEN_MISSING");
          }

          const response = await fetch(`${audience}/api/admin/channels/base/snapshot`, {
            headers: {
              Authorization: `Bearer ${tokenBody.value}`,
              Accept: "application/json",
            },
            signal: AbortSignal.timeout(110_000),
          });
          if (!response.ok) {
            const body = await response.json().catch(() => ({}));
            throw new Error(`BASE_SNAPSHOT_HTTP_${response.status}:${String(body.error ?? "request_failed").slice(0, 100)}`);
          }

          const snapshot = await response.json();
          if (snapshot.complete !== true || !Array.isArray(snapshot.items)) {
            throw new Error("BASE_SNAPSHOT_INCOMPLETE");
          }
          if (!Number.isInteger(snapshot.itemCount) || snapshot.itemCount !== snapshot.items.length || snapshot.itemCount < 1) {
            throw new Error("BASE_SNAPSHOT_COUNT_MISMATCH_OR_EMPTY");
          }
          const ids = snapshot.items.map((item) => String(item?.item_id ?? ""));
          if (ids.some((id) => !id) || new Set(ids).size !== ids.length) {
            throw new Error("BASE_SNAPSHOT_ITEM_ID_MISSING_OR_DUPLICATE");
          }

          const auditResponse = await fetch(`${audience}/api/admin/channels/base/reconciliation`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${tokenBody.value}`,
              "Content-Type": "application/json",
              Accept: "application/json",
            },
            body: JSON.stringify({ snapshot }),
            signal: AbortSignal.timeout(110_000),
          });
          if (!auditResponse.ok) {
            const body = await auditResponse.json().catch(() => ({}));
            throw new Error(`BASE_RECONCILIATION_HTTP_${auditResponse.status}:${String(body.error ?? "request_failed").slice(0, 100)}`);
          }
          const report = await auditResponse.json();
          if (report.complete !== true || !Array.isArray(report.items) || report.baseItemCount !== report.items.length) {
            throw new Error("BASE_RECONCILIATION_INCOMPLETE_OR_COUNT_MISMATCH");
          }

          // Only aggregate counts are written to public workflow logs.
          // Raw product snapshots and per-item reconciliation records must be
          // stored only after a private, access-controlled destination is configured.
          console.log(JSON.stringify({
            audit: "base-reconciliation",
            complete: report.complete,
            tracerListingCount: report.tracerListingCount,
            baseItemCount: report.baseItemCount,
            exactBaseIdMappedCount: report.exactBaseIdMappedCount,
            baseItemsWithoutExactMappingCount: report.baseItemsWithoutExactMappingCount,
            baseItemsWithAmbiguousExactMappingCount: report.baseItemsWithAmbiguousExactMappingCount,
            baseItemsWithExactTitleCandidateCount: report.baseItemsWithExactTitleCandidateCount,
            tracerListingsWithoutBaseItemIdCount: report.tracerListingsWithoutBaseItemIdCount,
            duplicateBaseItemIdGroupsInTracer: report.duplicateBaseItemIdGroupsInTracer,
            snapshotPages: snapshot.pages,
            visibleCount: snapshot.visibleCount,
            hiddenCount: snapshot.hiddenCount,
            unknownVisibilityCount: snapshot.unknownVisibilityCount,
            uniqueItemIds: new Set(ids).size,
            generatedAt: snapshot.generatedAt,
            rawArtifactStored: false,
          }));
          NODE
