name: TRACER run BASE Japanese copy batch once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-base-japanese-copy-once.yml"
      - "app/api/cron/base-japanese-copy/route.ts"

permissions:
  contents: read
  id-token: write

concurrency:
  group: tracer-base-japanese-copy-one-shot
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for production deployment
        run: sleep 90
      - name: Invoke BASE Japanese copy repair batch
        shell: bash
        env:
          PRODUCTION_URL: https://tracer-pied-alpha.vercel.app
        run: |
          set -euo pipefail
          token_json="$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app")"
          id_token="$(printf '%s' "$token_json" | jq -er '.value')"
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 300 \
            -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer ${id_token}" \
            "${PRODUCTION_URL}/api/cron/base-japanese-copy?itemId=160447305")"
          echo "BASE Japanese copy batch HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "BASE Japanese copy batch failed with HTTP $status" >&2
            exit 1
          fi
          jq -e '.phase == "base_japanese_copy_repair"' "$response_file" >/dev/null
          jq -e '.translatedAndVerified >= 0 and .failed >= 0 and (.results | type == "array")' "$response_file" >/dev/null
          {
            echo "## BASE Japanese copy — targeted item 160447305"
            echo
            echo "- HTTP: $status"
            echo "- Snapshot items: $(jq -r '.snapshotItems // "unknown"' "$response_file")"
            echo "- Candidate pool: $(jq -r '.candidatePool // "unknown"' "$response_file")"
            echo "- Requested: $(jq -r '.requested // "unknown"' "$response_file")"
            echo "- Translated and readback-verified: $(jq -r '.translatedAndVerified // "unknown"' "$response_file")"
            echo "- Failed: $(jq -r '.failed // "unknown"' "$response_file")"
            echo
            echo "| BASE item ID | Outcome | Price preserved | Stock preserved | Visibility preserved | Identifier preserved |"
            echo "|---|---|---|---|---|---|"
            jq -r '.results[]? | "| \(.itemId // "unknown") | \(.outcome // "unknown") | \(.pricePreserved // false) | \(.stockPreserved // false) | \(.visibilityPreserved // false) | \(.identifierPreserved // false) |"' "$response_file"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$(jq -r '.failed // 1' "$response_file")" != "0" ]; then
            echo "One or more BASE Japanese copy updates failed verification." >&2
            exit 1
          fi

# One targeted item; BASE readback verification is required.
