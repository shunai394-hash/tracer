name: TRACER repair one BASE product in Japanese and verify live readback

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-base-japanese-copy-once.yml"
      - "app/api/cron/base-japanese-copy/route.ts"

permissions:
  contents: read
  id-token: write

concurrency:
  group: tracer-base-japanese-copy-one-shot
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for production deployment
        run: sleep 90
      - name: Repair exact BASE item and require verified readback
        shell: bash
        env:
          PRODUCTION_URL: https://tracer-pied-alpha.vercel.app
          BASE_ITEM_ID: "160447305"
        run: |
          set -euo pipefail
          token_json="$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app")"
          id_token="$(printf '%s' "$token_json" | jq -er '.value')"
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 300 \
            -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer ${id_token}" \
            "${PRODUCTION_URL}/api/cron/base-japanese-copy?itemId=${BASE_ITEM_ID}&limit=1")"
          echo "BASE item ${BASE_ITEM_ID} Japanese-copy repair HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "BASE Japanese copy repair failed with HTTP $status" >&2
            exit 1
          fi
          jq -e --arg id "$BASE_ITEM_ID" '
            .phase == "base_japanese_copy_repair" and
            .requested == 1 and
            (.results | type == "array") and
            (.results | length == 1) and
            (.results[0].itemId | tostring) == $id and
            .results[0].outcome == "translated_and_verified" and
            .results[0].pricePreserved == true and
            .results[0].stockPreserved == true and
            .results[0].visibilityPreserved == true and
            .results[0].identifierPreserved == true and
            .results[0].titleJapanese == true and
            .results[0].descriptionJapanese == true and
            .failed == 0
          ' "$response_file" >/dev/null || {
            echo "The exact BASE item did not pass Japanese-copy and unchanged-state readback checks." >&2
            exit 1
          }
          {
            echo "## BASE Japanese-copy repair — exact item"
            echo
            echo "- BASE item ID: ${BASE_ITEM_ID}"
            echo "- HTTP: $status"
            echo "- Outcome: $(jq -r '.results[0].outcome' "$response_file")"
            echo "- Price/stock/visibility/identifier preserved: true (BASE live readback)"
            echo "- Japanese title and description verified: true (BASE live readback)"
          } >> "$GITHUB_STEP_SUMMARY"
