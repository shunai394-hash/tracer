name: TRACER repair up to three BASE products in Japanese and verify live readback

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-base-japanese-copy-once.yml"
      - "app/api/cron/base-japanese-copy/route.ts"

permissions:
  contents: read
  id-token: write

concurrency:
  group: tracer-base-japanese-copy-one-shot
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for production deployment
        run: sleep 90
      - name: Repair up to three offline-safe BASE items and require verified readback
        shell: bash
        env:
          PRODUCTION_URL: https://tracer-pied-alpha.vercel.app
        run: |
          set -euo pipefail
          token_json="$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app")"
          id_token="$(printf '%s' "$token_json" | jq -er '.value')"
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 300 \
            -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer ${id_token}" \
            "${PRODUCTION_URL}/api/cron/base-japanese-copy?limit=3")"
          echo "BASE Japanese-copy batch repair HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "BASE Japanese copy repair failed with HTTP $status" >&2
            exit 1
          fi
          jq -e '
            .phase == "base_japanese_copy_repair" and
            .requested >= 1 and .requested <= 3 and
            .translatedAndVerified >= 1 and
            (.results | type == "array") and
            (.results | length) == .requested and
            .failed == 0 and
            ([.results[] | select(
              .outcome == "translated_and_verified" and
              .pricePreserved == true and
              .stockPreserved == true and
              .visibilityPreserved == true and
              .identifierPreserved == true and
              .titleJapanese == true and
              .descriptionJapanese == true
            )] | length) == .translatedAndVerified
          ' "$response_file" >/dev/null || {
            echo "BASE batch did not pass Japanese-copy and unchanged-state live readback checks." >&2
            exit 1
          }
          {
            echo "## BASE Japanese-copy repair — verified batch"
            echo
            echo "- Requested batch size: up to 3"
            echo "- HTTP: $status"
            echo "- Items translated and verified: $(jq -r '.translatedAndVerified' "$response_file")"
            echo "- Price/stock/visibility/identifier preserved for every translated item: true (BASE live readback)"
            echo "- Japanese title and description verified for every translated item: true (BASE live readback)"
          } >> "$GITHUB_STEP_SUMMARY"
