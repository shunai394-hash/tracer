name: TRACER repair BASE products in Japanese and verify live readback
# Triggered for the user's requested production BASE Japanese-copy repair on 2026-10-21.
# A commit message containing [run-base-japanese-copy] reruns the bounded, readback-verified sweep.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-base-japanese-copy-once.yml"
      - "app/api/cron/base-japanese-copy/route.ts"
      - "lib/intelligence/japanese-product.ts"

permissions:
  contents: read
  id-token: write

concurrency:
  group: tracer-base-japanese-copy-one-shot
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Wait for production deployment
        run: sleep 90
      - name: Repair repeated batches of up to ten BASE items with live readback
        shell: bash
        env:
          PRODUCTION_URL: https://tracer-pied-alpha.vercel.app
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          total_verified=0
          total_failed=0
          completed_batches=0
          after_item_id=0
          cursor_exhausted=0
          no_progress_batches=0
          for batch in $(seq 1 50); do
            # GitHub OIDC ID tokens expire; mint a fresh token for each batch.
            token_json="$(curl --fail --silent --show-error --max-time 20 \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app")"
            id_token="$(printf '%s' "$token_json" | jq -er '.value')"
            request_url="${PRODUCTION_URL}/api/cron/base-japanese-copy?limit=10"
            if [ -n "$after_item_id" ]; then request_url="${request_url}&afterItemId=${after_item_id}"; fi
            if [ "$cursor_exhausted" -eq 1 ]; then request_url="${request_url}&offset=$((batch * 10))"; fi
            status="$(curl --silent --show-error --max-time 300 \
              -o "$response_file" -w '%{http_code}' \
              -H "Authorization: Bearer ${id_token}" \
              "$request_url")"
            echo "BASE Japanese-copy batch $batch HTTP $status"
            cat "$response_file"
            echo
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "Stopping after HTTP $status; earlier verified repairs remain applied." >&2
              break
            fi
            if ! jq -e '
              .phase == "base_japanese_copy_repair" and
              .requested >= 0 and .requested <= 10 and
              (.results | type == "array") and
              (.results | length) == .requested and
              ([.results[] | select(
                .outcome == "translated_and_verified" and
                .pricePreserved == true and
                .stockPreserved == true and
                .visibilityPreserved == true and
                .identifierPreserved == true and
                .titleJapanese == true and
                .descriptionJapanese == true
              )] | length) == .translatedAndVerified
            ' "$response_file" >/dev/null; then
              echo "Stopping: batch failed live readback validation." >&2
              break
            fi
            verified="$(jq -r '.translatedAndVerified // 0' "$response_file")"
            failed="$(jq -r '.failed // 0' "$response_file")"
            provider_unavailable="$(jq -r '.providerUnavailable // false' "$response_file")"
            total_verified=$((total_verified + verified))
            total_failed=$((total_failed + failed))
            completed_batches=$batch
            deferred="$(jq -r '.deferred // 0' "$response_file")"
            requested="$(jq -r '.requested // 0' "$response_file")"
            next_cursor="$(jq -r '[.results[] | .itemId? | select(. != null) | tonumber] | if length == 0 then empty else max end' "$response_file")"
            if [ "$requested" -eq 0 ] || [ -z "$next_cursor" ]; then
              if [ "$cursor_exhausted" -eq 0 ]; then
                echo "Cursor reached end; restarting scan with rotating offsets. This is not catalog completion."
                cursor_exhausted=1
                after_item_id=""
                continue
              fi
              no_progress_batches=$((no_progress_batches + 1))
              echo "No candidate IDs returned during rotating scan (no-progress count $no_progress_batches); checking further offsets."
              after_item_id=""
              if [ "$no_progress_batches" -ge 5 ]; then
                echo "Stopping after five empty rotating batches; remaining count must be verified separately."
                break
              fi
              continue
            fi
            after_item_id="$next_cursor"
            if [ "$verified" -eq 0 ]; then no_progress_batches=$((no_progress_batches + 1)); else no_progress_batches=0; fi
            if [ "$failed" -gt 0 ]; then
              echo "Continuing after item-level failures; cursor advanced to $after_item_id so later products are still processed."
            fi
            if [ "$provider_unavailable" = "true" ]; then
              echo "Gemini unavailable: continuing scan; AI-only items are deferred without changing their copy."
            fi
          done
          {
            echo "## BASE Japanese-copy repair — repeated verified batches"
            echo
            echo "- Batches completed: $completed_batches (maximum 50)"
            echo "- Items translated and verified: $total_verified"
            echo "- Failed/skipped state count reported by batches: $total_failed"
            remaining="$(jq -r '.remainingEnglishEstimate // "unknown"' "$response_file" 2>/dev/null || echo unknown)"
            echo "- Last reported remaining English estimate: $remaining"
            echo "- A cursor ending or empty batch is not proof of catalog completion; only a full live rescan with zero remaining candidates qualifies."
            echo "- Every translated item passed live checks for Japanese title/description and unchanged price/stock/visibility/identifier."
            echo "- This workflow only edits copy; it does not change publication state or stock."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$total_verified" -eq 0 ]; then
            echo "No items were verified in this run." >&2
            exit 1
          fi
