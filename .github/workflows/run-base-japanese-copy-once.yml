name: TRACER repair BASE products in Japanese and verify live readback

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-base-japanese-copy-once.yml"
      - "app/api/cron/base-japanese-copy/route.ts"
      - "lib/intelligence/japanese-product.ts"

permissions:
  contents: read
  id-token: write

concurrency:
  group: tracer-base-japanese-copy-one-shot
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for production deployment
        run: sleep 90
      - name: Repair repeated batches of up to ten BASE items with live readback
        shell: bash
        env:
          PRODUCTION_URL: https://tracer-pied-alpha.vercel.app
        run: |
          set -euo pipefail
          token_json="$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-pied-alpha.vercel.app")"
          id_token="$(printf '%s' "$token_json" | jq -er '.value')"
          response_file="$(mktemp)"
          total_verified=0
          total_failed=0
          completed_batches=0
          for batch in $(seq 1 5); do
            status="$(curl --silent --show-error --max-time 300 \
              -o "$response_file" -w '%{http_code}' \
              -H "Authorization: Bearer ${id_token}" \
              "${PRODUCTION_URL}/api/cron/base-japanese-copy?limit=10")"
            echo "BASE Japanese-copy batch $batch HTTP $status"
            cat "$response_file"
            echo
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "Stopping after HTTP $status; earlier verified repairs remain applied." >&2
              break
            fi
            if ! jq -e '
              .phase == "base_japanese_copy_repair" and
              .requested >= 0 and .requested <= 10 and
              (.results | type == "array") and
              (.results | length) == .requested and
              ([.results[] | select(
                .outcome == "translated_and_verified" and
                .pricePreserved == true and
                .stockPreserved == true and
                .visibilityPreserved == true and
                .identifierPreserved == true and
                .titleJapanese == true and
                .descriptionJapanese == true
              )] | length) == .translatedAndVerified
            ' "$response_file" >/dev/null; then
              echo "Stopping: batch failed live readback validation." >&2
              break
            fi
            verified="$(jq -r '.translatedAndVerified // 0' "$response_file")"
            failed="$(jq -r '.failed // 0' "$response_file")"
            provider_unavailable="$(jq -r '.providerUnavailable // false' "$response_file")"
            total_verified=$((total_verified + verified))
            total_failed=$((total_failed + failed))
            completed_batches=$batch
            if [ "$failed" -gt 0 ] || [ "$provider_unavailable" = "true" ] || [ "$verified" -eq 0 ]; then
              echo "Stopping safely: no further verified offline-safe progress in this batch."
              break
            fi
          done
          {
            echo "## BASE Japanese-copy repair — repeated verified batches"
            echo
            echo "- Batches completed: $completed_batches (maximum 5)"
            echo "- Items translated and verified: $total_verified"
            echo "- Failed/skipped state count reported by batches: $total_failed"
            echo "- Every translated item passed live checks for Japanese title/description and unchanged price/stock/visibility/identifier."
            echo "- This workflow only edits copy; it does not change publication state or stock."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$total_verified" -eq 0 ]; then
            echo "No items were verified in this run." >&2
            exit 1
          fi
