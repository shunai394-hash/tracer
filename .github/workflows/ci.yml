name: TRACER CI

on:
  push:
    branches:
      - main
      - feat/chrome-extension-ec-pulse
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      CRON_SECRET: ci-cron-secret
      CJ_API_KEY: ci-cj-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test Issue 484 shared commerce gate and order identity
        run: node --experimental-strip-types --experimental-test-module-mocks --import ./scripts/register-test-hooks.mjs ./scripts/test-issue-484-commerce.mjs
      - name: Test channel safety
        run: node --experimental-strip-types --experimental-test-module-mocks --import ./scripts/register-test-hooks.mjs ./scripts/test-channel-safety.mjs
      - name: Test cron failure propagation
        run: node --experimental-strip-types --experimental-test-module-mocks --import ./scripts/register-test-hooks.mjs ./scripts/test-cron-failure-propagation.mjs
      - name: Test storefront publication gate
        run: node --experimental-strip-types --experimental-test-module-mocks --import ./scripts/register-test-hooks.mjs ./scripts/test-storefront-gate.mjs
      - name: Test supplier order safety
        run: node --experimental-strip-types --experimental-test-module-mocks --import ./scripts/register-test-hooks.mjs ./scripts/test-supplier-order-safety.mjs
      - name: Test internal supply retry lifecycle
        run: node --experimental-strip-types --experimental-test-module-mocks --import ./scripts/register-test-hooks.mjs ./scripts/test-internal-link-retry-lifecycle.mjs
      - name: Verify demand match evidence
        run: node --experimental-strip-types --no-warnings scripts/verify-demand-match-evidence.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
