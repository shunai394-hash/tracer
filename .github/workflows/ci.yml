name: TRACER CI

on:
  push:
    branches:
      - main
      - feat/chrome-extension-ec-pulse
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      CRON_SECRET: ci-cron-secret
      CJ_API_KEY: ci-cj-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  ops-trigger:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ops-trigger]')
    runs-on: ubuntu-latest
    steps:
      - name: Run sales publication
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://tracer-self.vercel.app/api/cron/sales-test-publication"
          sleep 10
          curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://tracer-self.vercel.app/api/cron/base-publish"
