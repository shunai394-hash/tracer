name: TRACER CI

on:
  push:
    branches:
      - main
      - feat/chrome-extension-ec-pulse
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      CRON_SECRET: ci-cron-secret
      CJ_API_KEY: ci-cj-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  ops-trigger:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[ops-trigger]')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Deploy production from the exact main commit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          test -n "$VERCEL_TOKEN"
          npx vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx vercel@latest build --prod --token "$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"
      - name: Verify the production deployment contains Patrol AI
        run: |
          set -e
          sleep 10
          code="$(curl -sS -o /tmp/patrol.html -w "%{http_code}" --max-time 30 https://tracer-self.vercel.app/api/cron/patrol-ai || true)"
          if [ "$code" = "404" ]; then
            echo "Patrol AI route is still 404 in production"
            cat /tmp/patrol.html
            exit 1
          fi
          echo "Patrol AI route responded HTTP $code"
      - name: Run autonomous patrol AI
        run: |
          set -e
          token="$(curl --fail-with-body --silent --show-error             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ftracer-self.vercel.app"             | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl --fail-with-body --silent --show-error --max-time 300             -H "Authorization: Bearer $token"             "https://tracer-self.vercel.app/api/cron/patrol-ai"
          echo
