name: TRACER CI

on:
  push:
    branches:
      - main
      - feat/chrome-extension-ec-pulse
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      CRON_SECRET: ci-cron-secret
      CJ_API_KEY: ci-cj-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:tracer-core
      - name: Test Shopify parent-variant grouping planner
        run: npm run test:shopify-variant-grouping-planner
      - name: Test BASE unfulfillable reconciliation retry filter
        run: node scripts/test-base-unfulfillable-reconciliation.mjs
      - name: Test Shopify order SKU mapping
        run: npm run test:shopify-order-sku-mapping
      - name: Test order gate profit invariants
        run: npm run test:order-gate
      - name: Test CJ quota exhaustion policy
        run: npm run test:cj-quota-policy
      - name: Test dropship order safety invariants
        run: npm run test:dropship-order-gate
      - name: Test autonomous order run-claim safety
        run: npm run test:autonomous-order-claim
      - name: Test Shopify order line-item pagination safety
        run: npm run test:shopify-line-item-pagination
      - name: Test sanitized provider diagnostics
        run: npm run test:auth-diagnostics
      - name: Test bounded product-intelligence scoring
        run: npm run test:bounded-product-scoring
      - name: Test bounded reorder recommendation writes
        run: npm run test:bounded-reorder-recommendations
      - name: Test bounded demand identity stamping
        run: npm run test:bounded-identity-stamping
      - name: Set up disposable local PostgreSQL for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          sudo pg_ctlcluster 16 main start
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'ci-postgres-password';"
          sudo -u postgres createdb tracer_test
          sudo -u postgres createdb tracer_ingestion_test
          sudo -u postgres createdb tracer_variant_link_test
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --no-warnings scripts/verify-demand-match-evidence.mjs
      - run: node --experimental-strip-types --no-warnings scripts/test-deferred-bestseller-gate.mjs
      - run: node scripts/test-canonical-variant-evidence-retry.mjs
      - name: Test Amazon child variant recovery diagnostics
        run: npm run test:amazon-child-variant-diagnostics
      - name: Test Amazon child identifier fallback
        run: node scripts/test-amazon-child-identifier-retry.mjs
      - run: node --experimental-strip-types --no-warnings scripts/test-base-item-identity.mjs
      - run: node --experimental-strip-types --no-warnings scripts/test-base-actual-reconciliation.mjs
      - run: node --experimental-strip-types --no-warnings scripts/test-base-snapshot-resume.mjs
      - run: node --experimental-strip-types --no-warnings scripts/test-publication-and-unit-cost.mjs
      - run: node scripts/test-base-snapshot-export.mjs
      - run: node scripts/test-cron-schedule-invariants.mjs
      - run: node scripts/test-commerce-status-readonly.mjs
      - run: node scripts/test-archived-readback-pagination.mjs
      - run: node --experimental-strip-types --no-warnings scripts/test-base-auth-retry-circuit.mjs
      - run: node --experimental-strip-types --no-warnings scripts/test-publishable-title.mjs
      - run: node scripts/test-shopify-copy-quota-fallback.mjs
      - run: npm run test:shopify-seo-sync
      - run: node --experimental-strip-types --no-warnings scripts/test-cj-query-fallback.mjs
      - run: node --experimental-strip-types --no-warnings scripts/test-canonical-supplier-identity-gate.mjs
      - name: Test detached supply inventory holds in sales-test publication
        run: node scripts/test-supply-sales-test-hold.mjs
      - run: node --experimental-strip-types --no-warnings scripts/test-shopify-line-match.mjs
      - run: node --experimental-strip-types --no-warnings scripts/test-supplier-payment-persistence.mjs
      - run: node --experimental-strip-types --no-warnings scripts/test-supplier-tracking-persistence.mjs
      - run: node --experimental-strip-types --no-warnings scripts/test-shopify-fulfillment-state-persistence.mjs
      - run: node --experimental-strip-types --no-warnings scripts/test-listing-shipping-and-variant-recovery.mjs
      - run: node --experimental-strip-types --no-warnings scripts/test-supply-first-priority.mjs
      - run: node --experimental-strip-types --no-warnings scripts/test-newfind-retry-policy.mjs
      - run: node --experimental-strip-types --no-warnings scripts/test-newfind-commerce.mjs
      - run: node --experimental-strip-types --no-warnings scripts/test-catalog-reconcile.mjs
      - run: node --experimental-strip-types --no-warnings scripts/test-unit-economics.mjs
      - run: node --experimental-strip-types --no-warnings scripts/test-procurement-approval.mjs
      - run: node scripts/verify-cj-internal-supply-wiring.mjs
      - name: Run atomic catalog sync PostgreSQL integration tests (disposable CI database only)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: ci-postgres-password
          PGDATABASE: tracer_test
        run: psql -v ON_ERROR_STOP=1 -f scripts/test-atomic-catalog-sync.sql
      - name: Run canonical marketplace variant evidence migration tests (disposable CI database only)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: ci-postgres-password
          PGDATABASE: tracer_test
        run: psql -v ON_ERROR_STOP=1 -f scripts/test-canonical-variant-evidence.sql
      - name: Run internal supply ingestion conflict-target tests (disposable CI database only)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: ci-postgres-password
          PGDATABASE: tracer_ingestion_test
        run: psql -v ON_ERROR_STOP=1 -f scripts/test-internal-supply-ingestion-conflicts.sql
      - name: Run canonical supplier variant link migration tests (disposable CI database only)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: ci-postgres-password
          PGDATABASE: tracer_variant_link_test
        run: psql -v ON_ERROR_STOP=1 -f scripts/test-canonical-supplier-variant-links.sql
      - run: npm run test:base-targeted-readback
      - run: npm run test:base-stale-item-deletion-contract
      - run: npm run test:archive-listing-republication
      - run: npm run test:archived-listing-republication-guards
      - name: Test Shopify color-variant identity safety
        run: node --experimental-strip-types --no-warnings scripts/test-shopify-variant-identity.mjs
      - run: npm run lint
      - run: npm run build
