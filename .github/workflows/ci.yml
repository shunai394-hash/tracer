name: TRACER CI

on:
  push:
    branches:
      - main
      - feat/chrome-extension-ec-pulse
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      CRON_SECRET: ci-cron-secret
      CJ_API_KEY: ci-cj-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:tracer-core
      - name: Test order gate profit invariants
        run: npm run test:order-gate
      - name: Test CJ quota exhaustion policy
        run: npm run test:cj-quota-policy
      - name: Test dropship order safety invariants
        run: npm run test:dropship-order-gate
      - name: Test autonomous order run-claim safety
        run: npm run test:autonomous-order-claim
      - name: Test Shopify order line-item pagination safety
        run: npm run test:shopify-line-item-pagination
      - name: Test sanitized provider diagnostics
        run: npm run test:auth-diagnostics
      - name: Test bounded product-intelligence scoring
        run: npm run test:bounded-product-scoring
      - name: Test bounded reorder recommendation writes
        run: npm run test:bounded-reorder-recommendations
      - name: Test bounded demand identity stamping
        run: npm run test:bounded-identity-stamping
      - name: Set up disposable local PostgreSQL for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          sudo pg_ctlcluster 16 main start
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'ci-postgres-password';"
          sudo -u postgres createdb tracer_test
          sudo -u postgres createdb tracer_ingestion_test
          sudo -u postgres createdb tracer_variant_link_test
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --no-warnings scripts/verify-demand-match-evidence.mjs
      - run: node scripts/test-canonical-variant-evidence-retry.mjs
      - run: node --experimental-strip-types --no-warnings scripts/test-publishable-title.mjs
      - run: node --experimental-strip-types --no-warnings scripts/test-cj-query-fallback.mjs
      - run: node --experimental-strip-types --no-warnings scripts/test-canonical-supplier-identity-gate.mjs
      - run: node scripts/verify-cj-internal-supply-wiring.mjs
      - name: Run atomic catalog sync PostgreSQL integration tests (disposable CI database only)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: ci-postgres-password
          PGDATABASE: tracer_test
        run: psql -v ON_ERROR_STOP=1 -f scripts/test-atomic-catalog-sync.sql
      - name: Run canonical marketplace variant evidence migration tests (disposable CI database only)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: ci-postgres-password
          PGDATABASE: tracer_test
        run: psql -v ON_ERROR_STOP=1 -f scripts/test-canonical-variant-evidence.sql
      - name: Run internal supply ingestion conflict-target tests (disposable CI database only)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: ci-postgres-password
          PGDATABASE: tracer_ingestion_test
        run: psql -v ON_ERROR_STOP=1 -f scripts/test-internal-supply-ingestion-conflicts.sql
      - name: Run canonical supplier variant link migration tests (disposable CI database only)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: ci-postgres-password
          PGDATABASE: tracer_variant_link_test
        run: psql -v ON_ERROR_STOP=1 -f scripts/test-canonical-supplier-variant-links.sql
      - run: npm run lint
      - run: npm run build
